          filename = 'alus-transfers-' + ymd();
        } else if (tab === 'adjustments') {
          var adj = (dbf.adjustments || []).slice().sort(function(a, b) { return new Date(b.at) - new Date(a.at); });
          title = 'گزارش تعدیلات موجودی';
          headers = ['تاریخ', 'کاربر', 'نوع', 'تعداد اقلام', 'یادداشت'];
          rows = adj.map(function(a) { return [faDate(a.at), a.byName || '', a.type === 'period_close' ? 'بستن دوره' : a.type, a.itemsCount || 0, a.note || '']; });
          filename = 'alus-adjustments-' + ymd();
        }
        if (kind === 'excel') exportExcel(filename, title, headers, rows);
        else if (kind === 'csv') exportCSV(filename, headers, rows);
        else if (kind === 'pdf') exportPDF(title, 'Alus · پنل مدیریت', headers, rows);
      });
    });
    $$('[data-adj]').forEach(function(b) {
      b.addEventListener('click', function() {
        var id = b.dataset.adj;
        var dbf = loadDB();
        var adj = (dbf.adjustments || []).filter(function(a) { return a.id === id; })[0];
        if (!adj) return;
        var snap = adj.snapshot || [];
        var body = '<div style="margin-bottom:12px" class="muted small">تعداد اقلام: ' + snap.length + ' · تعداد کل: ' + snap.reduce(function(a, s) { return a + s.quantity; }, 0).toLocaleString('fa-IR') + ' عدد</div>';
        body += '<div style="max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:14px"><table class="dt" style="min-width:auto"><thead><tr><th>کالا</th><th>انبار</th><th style="text-align:left">موجودی قبلی</th></tr></thead><tbody>';
        snap.forEach(function(s) {
          var p = getProd(dbf, s.productId); var w = getWh(dbf, s.warehouseId);
          if (!p || !w) return;
          body += '<tr><td>' + esc(p.name) + '</td><td>' + esc(w.name) + '</td><td class="num">' + s.quantity + '</td></tr>';
        });
        body += '</tbody></table></div>';
        openModal({ title: 'جزئیات تعدیل', desc: faDate(adj.at) + ' — ' + (adj.byName || '—'), body: body, actions: [{ label: 'بستن', cls: 'ghost', onClick: function(c) { c.remove(); } }] });
      });
    });
  }
  render();
}

function pageSettings(page) {
  var db = loadDB();
  var totalStock = db.stocks.reduce(function(a, s) { return a + s.quantity; }, 0);
  var nonZero = db.stocks.filter(function(s) { return s.quantity > 0 || (s.reservedQty || 0) > 0; });
  var dbSize = 0;
  try { dbSize = new Blob([JSON.stringify(db)]).size; } catch(e) {}
  page.innerHTML = '<div class="page-head"><div><h1>تنظیمات پیشرفته</h1><div class="sub">مدیریت سیستمی — دسترسی محدود به راهبر</div></div></div>' +
    '<div class="bento">' +
      '<div class="widget w-6"><div class="w-head"><div><div class="w-title"><div class="ic info">' + IC.info + '</div>وضعیت سیستم</div></div></div>' +
        '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">' +
          '<div class="dl-item"><div class="k">تعداد کالاها</div><div class="v">' + db.products.length.toLocaleString('fa-IR') + ' قلم</div></div>' +
          '<div class="dl-item"><div class="k">تعداد انبارها</div><div class="v">' + db.warehouses.filter(function(w) { return w.type !== 'customer'; }).length.toLocaleString('fa-IR') + ' انبار</div></div>' +
          '<div class="dl-item"><div class="k">کل اسناد انتقال</div><div class="v">' + db.transfers.length.toLocaleString('fa-IR') + ' سند</div></div>' +
          '<div class="dl-item"><div class="k">تعدیلات ثبت‌شده</div><div class="v">' + (db.adjustments || []).length.toLocaleString('fa-IR') + ' مورد</div></div>' +
          '<div class="dl-item"><div class="k">جمع کل موجودی</div><div class="v">' + totalStock.toLocaleString('fa-IR') + ' عدد</div></div>' +
          '<div class="dl-item"><div class="k">حجم داده‌ها</div><div class="v">' + (dbSize / 1024).toFixed(1) + ' KB</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="widget w-6"><div class="w-head"><div><div class="w-title danger"><div class="ic danger">' + IC.alert + '</div>صفر کردن موجودی</div><div class="w-sub">با حفظ کامل تاریخچه</div></div></div>' +
        '<p style="font-size:12.5px;color:var(--text-2);line-height:1.9;margin-bottom:14px">' +
          'این عملیات موجودی فعلی <b>' + nonZero.length.toLocaleString('fa-IR') + ' ردیف انبار</b> را صفر می‌کند اما اسناد جابه‌جایی و تاریخچه قبلی کاملاً حفظ می‌شود. یک snapshot از موجودی فعلی به‌عنوان «تعدیل دوره» ثبت می‌گردد.' +
        '</p>' +
        '<div style="padding:12px 14px;background:rgba(255,149,0,.1);border:1px solid rgba(255,149,0,.24);border-radius:14px;font-size:12px;color:#b45309;margin-bottom:14px">' + IC.alert + ' توصیه می‌شود قبل از انجام، از صفحه گزارش‌ها خروجی Excel تهیه کنید.</div>' +
        '<div class="row" style="justify-content:flex-end"><button class="btn danger" id="zero-btn">' + IC.refresh + ' صفر کردن موجودی همه انبارها</button></div>' +
      '</div>' +
      '<div class="widget w-12"><div class="w-head"><div><div class="w-title"><div class="ic">' + IC.download + '</div>پشتیبان‌گیری داده‌ها</div></div></div>' +
        '<p style="font-size:12.5px;color:var(--text-2);line-height:1.9;margin-bottom:14px">' + 'کل پایگاه داده (کاربران، کالاها، موجودی و اسناد) را به‌صورت فایل JSON دریافت کنید. برای بازیابی، فایل را در همین صفحه بارگذاری کنید.' + '</p>' +
        '<div class="row" style="justify-content:flex-end;gap:8px">' +
          '<button class="btn ghost" id="imp-btn">' + IC.download + ' بازیابی از فایل</button>' +
          '<button class="btn success" id="exp-btn">' + IC.download + ' دانلود پشتیبان (JSON)</button>' +
          '<input type="file" id="imp-file" accept=".json" style="display:none" />' +
        '</div>' +
      '</div>' +
    '</div>';
  var zb = $('#zero-btn'); if (zb) zb.addEventListener('click', openZeroOutModal);
  var eb = $('#exp-btn');
  if (eb) eb.addEventListener('click', function() {
    var fresh = loadDB();
    var blob = new Blob([JSON.stringify(fresh, null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'alus-backup-' + ymd() + '-' + Date.now() + '.json');
    celebrate('پشتیبان آماده شد', 'فایل JSON دانلود شد', 'success', 1800);
  });
  var ib = $('#imp-btn'); var ifile = $('#imp-file');
  if (ib && ifile) {
    ib.addEventListener('click', function() { ifile.click(); });
    ifile.addEventListener('change', function() {
      var f = ifile.files && ifile.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function() {
        try {
          var parsed = JSON.parse(rd.result);
          if (!parsed || !parsed.users || !parsed.warehouses) throw new Error('فایل نامعتبر است');
          openModal({
            title: 'بازیابی از پشتیبان', desc: 'کل داده‌های فعلی با محتوای فایل جایگزین می‌شود. این عمل قابل بازگشت نیست.',
            body: '<div style="padding:12px 14px;background:rgba(255,59,48,.1);border-radius:14px;font-size:12px;color:#b91c1c">' + IC.alert + ' پس از بازیابی، به‌صورت خودکار از حساب خارج می‌شوید.</div>',
            actions: [
              { label: 'انصراف', cls: 'ghost', onClick: function(c) { c.remove(); } },
              { label: IC.check + ' بازیابی', cls: 'danger', onClick: function(c) {
                try {
                  migrateDB(parsed); saveDB(parsed);
                  try { localStorage.removeItem(K_SES); } catch(e) {}
                  c.remove(); celebrate('بازیابی موفق', 'لطفاً مجدداً وارد شوید', 'success', 2200);
                  setTimeout(function() { App.user = null; render(); }, 700);
                } catch(err) { c.remove(); celebrate('خطا', err.message || '', 'error', 2200); }
              } }
            ]
          });
        } catch(err) { celebrate('فایل نامعتبر', err.message || '', 'error', 2200); }
        ifile.value = '';
      };
      rd.readAsText(f);
    });
  }
  attachRippleAll();
}

function openZeroOutModal() {
  var db = loadDB();
  var nonZero = db.stocks.filter(function(s) { return s.quantity > 0 || (s.reservedQty || 0) > 0; });
  var totalQ = nonZero.reduce(function(a, s) { return a + s.quantity; }, 0);
  openModal({
    title: 'تأیید صفر کردن موجودی', desc: 'این عملیات با ثبت snapshot تاریخی انجام می‌شود.',
    body:
      '<div class="field"><label>یادداشت (اختیاری)</label><input id="zo-note" placeholder="مثلاً: بستن سال ۱۴۰۳" /></div>' +
      '<div style="margin-top:14px;padding:14px;background:var(--g1);border-radius:16px;font-size:12.5px;line-height:1.9">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>ردیف‌های تحت تأثیر:</span><b>' + nonZero.length.toLocaleString('fa-IR') + ' ردیف</b></div>' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>جمع موجودی فعلی:</span><b>' + totalQ.toLocaleString('fa-IR') + ' عدد</b></div>' +
        '<div style="display:flex;justify-content:space-between"><span>اسناد انتقال که حفظ می‌شوند:</span><b>' + db.transfers.length.toLocaleString('fa-IR') + ' سند</b></div>' +
      '</div>' +
      '<div style="margin-top:12px;padding:12px 14px;background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.24);border-radius:14px;font-size:12px;color:#047857">' + IC.check + ' تاریخچه کامل حفظ می‌شود. عملیات فقط مقادیر جاری را صفر می‌کند.</div>',
    actions: [
      { label: 'انصراف', cls: 'ghost', onClick: function(c) { c.remove(); } },
      { label: IC.refresh + ' تأیید و صفر کردن', cls: 'danger', onClick: function(c) {
        var btn = c.querySelector('button.danger'); if (btn) btn.classList.add('loading');
        var noteBox = c.querySelector('#zo-note'); var note = noteBox ? noteBox.value.trim() : '';
        setTimeout(function() {
          try {
            var fresh = loadDB();
            var snap = fresh.stocks.filter(function(s) { return s.quantity > 0 || (s.reservedQty || 0) > 0; }).map(function(s) { return { productId: s.productId, warehouseId: s.warehouseId, quantity: s.quantity, reservedQty: s.reservedQty || 0 }; });
            if (!snap.length) { c.remove(); celebrate('موجودی صفر است', 'چیزی برای صفر کردن نیست', 'info', 1800); return; }
            fresh.adjustments = fresh.adjustments || [];
            fresh.adjustments.push({ id: uid(), at: new Date().toISOString(), by: App.user.id, byName: App.user.name, type: 'period_close', note: note, itemsCount: snap.length, snapshot: snap });
            fresh.stocks.forEach(function(s) { s.quantity = 0; s.reservedQty = 0; s.updatedAt = new Date().toISOString(); });
            saveDB(fresh);
            c.remove();
            celebrate('موجودی صفر شد', snap.length + ' ردیف · snapshot ثبت شد', 'success', 2400);
            requestAnimationFrame(function() { requestAnimationFrame(function() { render(); }); });
          } catch(err) { try { c.remove(); } catch(e) {} celebrate('خطا', err.message || '', 'error', 2200); }
        }, 400);
      } }
    ]
  });
}

document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
  if (e.key === 'Escape') {
    closeCmd(); closeDrawer(); closeNotif(); closeSheet(); hideKitPop();
    var pdfM = document.querySelector('.pdf-modal'); if (pdfM) pdfM.remove();
    var m = document.querySelector('.modal-bd'); if (m) m.remove();
    var um = document.querySelector('.userm'); if (um) um.remove();
    $$('.celebrate').forEach(function(el) { el.remove(); });
  }
  if (!e.target.matches('input,textarea,select') && !e.metaKey && !e.ctrlKey && App.user) {
    var map = { '1': 'dashboard', '2': 'stock', '3': 'transfers', '4': 'inbounds' };
    if (map[e.key] && NAV.filter(function(n) { return n.key === map[e.key] && n.roles.indexOf(App.user.role) >= 0; }).length) go(map[e.key]);
  }
});

try {
  showSplash();
  try { PWA.init(); } catch(e) {}
  App.user = currentUser();
  if (App.user) App.route = restoreRoute();
  else App.route = { name: 'dashboard', params: {} };
  render();
} catch(err) {
  var ee = document.getElementById('err');
  if (ee) { ee.style.display = 'block'; ee.textContent = 'BOOT ERROR: ' + (err.message || err) + '\n' + (err.stack || ''); }
}
})();
</script>
</body>
</html>
