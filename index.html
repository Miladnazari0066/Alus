          '<button class="user-btn" id="user-menu"><div class="who-text"><b>' + esc(user.name) + '</b><span>' + ROLES[user.role] + '</span></div><div class="avatar">' + esc(initials(user.name)) + '</div></button>' +
        '</div>' +
      '</nav></div>' +
      '<div class="page" id="page"></div>' +
      '<div class="bottom-tabs">' + tabsHTML + '</div>';

    $$('[data-nav]').forEach(function (el) {
      el.addEventListener('click', function () { go(el.dataset.nav); });
    });
    $$('.tab-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.tab;
        if (k === '__more') openSheet();
        else go(k);
      });
    });
    var sb = $('#search-btn');
    if (sb) sb.addEventListener('click', openCmd);
    var shb = $('#shortcuts-btn');
    if (shb) shb.addEventListener('click', openShortcutsHelp);
    var tb = $('#theme-btn');
    if (tb) tb.addEventListener('click', toggleTheme);
    var nb = $('#notif-btn');
    if (nb) nb.addEventListener('click', openNotif);
    var um = $('#user-menu');
    if (um) {
      um.addEventListener('click', function (e) {
        e.stopPropagation();
        if (window.innerWidth <= 900) openSheet();
        else openUserMenu(um);
      });
    }
    renderPage();
    attachRippleAll();
  }

  function renderPage() {
    var page = $('#page');
    if (!page) return;
    var fns = {
      dashboard: pageDashboard,
      stock: pageStock,
      stockInit: pageStockInit,
      transfers: pageTransfers,
      inbounds: pageInbounds,
      reports: pageReports,
      newTransfer: pageNewTransfer,
      newInbound: pageNewInbound,
      directCustomer: pageDirectCustomer,
      products: pageProducts,
      users: pageUsers,
      settings: pageSettings
    };
    (fns[App.route.name] || pageDashboard)(page);
    attachRippleAll();
  }

  /* ============================================================
     PAGE: DASHBOARD
     ============================================================ */
  function pageDashboard(page) {
    var db = loadDB();
    function totalOf(t) {
      var ids = db.warehouses.filter(function (w) { return w.type === t; }).map(function (w) { return w.id; });
      if (!ids.length) return 0;
      return db.stocks.filter(function (s) { return ids.indexOf(s.warehouseId) >= 0; }).reduce(function (a, s) { return a + s.quantity; }, 0);
    }
    function totalAvail(t) {
      var ids = db.warehouses.filter(function (w) { return w.type === t; }).map(function (w) { return w.id; });
      if (!ids.length) return 0;
      return db.stocks.filter(function (s) { return ids.indexOf(s.warehouseId) >= 0; }).reduce(function (a, s) { return a + (s.quantity - (s.reservedQty || 0)); }, 0);
    }

    var pending = db.transfers.filter(function (t) { return t.status.indexOf('pending') === 0; }).length;
    var lowStock = lowStockItems(db);
    var totalItems = ['central', 'paint_in', 'paint_out', 'upholstery', 'store', 'showroom_khalij', 'showroom_alus', 'sold'].reduce(function (a, t) { return a + totalOf(t); }, 0);
    var approvedWeek = (function () {
      var t0 = new Date();
      t0.setDate(t0.getDate() - 7);
      t0.setHours(0, 0, 0, 0);
      return db.transfers.filter(function (t) { return t.status === 'approved' && new Date(t.completedAt || t.createdAt) >= t0; }).length;
    })();
    var hour = new Date().getHours();
    var greet = hour < 12 ? 'صبح بخیر' : hour < 17 ? 'ظهر بخیر' : hour < 20 ? 'عصر بخیر' : 'شب بخیر';
    var feed = db.transfers.slice(0, 6);
    var pendingW = db.transfers.filter(function (t) { return t.status === 'pending_warehouse'; }).length;
    var pendingA = db.transfers.filter(function (t) { return t.status === 'pending_accountant'; }).length;
    var pendingM = db.transfers.filter(function (t) { return t.status === 'pending_manager'; }).length;
    var approvedN = db.transfers.filter(function (t) { return t.status === 'approved'; }).length;
    var maxPipe = Math.max(pendingW, pendingA, pendingM, approvedN, 1);

    // Weekly transfer counts (last 7 days)
    var weekValues = [0, 0, 0, 0, 0, 0, 0];
    var weekLabels = ['شنبه', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'جمعه'];
    var now = new Date();
    db.transfers.forEach(function (t) {
      if (t.status !== 'approved') return;
      var d = new Date(t.completedAt || t.createdAt);
      var diff = Math.floor((now - d) / 86400000);
      if (diff >= 0 && diff < 7) {
        var idx = 6 - diff;
        weekValues[idx] += 1;
      }
    });

    function statCard(type, label, icon, accent) {
      var v = totalOf(type);
      var av = totalAvail(type);
      var sp = sparklineData(db, type, 7);
      var color = WH_COLOR[type] || '#007AFF';
      return '<div class="stat w-3">' +
        '<div class="stat-head"><div class="stat-title"><div class="stat-ic" style="background:' + accent + '">' + icon + '</div><span>' + esc(label) + '</span></div></div>' +
        '<div class="stat-body"><div class="stat-value" data-count="' + v + '">0</div><div class="stat-spark">' + sparklineSVG(sp, color, 80, 34) + '</div></div>' +
        '<div class="stat-foot">' + IC.trend + ' قابل استفاده: ' + av.toLocaleString('fa-IR') + ' · ۷ روز اخیر</div>' +
      '</div>';
    }

    page.innerHTML = '<div class="bento">' +
      '<div class="hero w-8">' +
        '<h2>' + greet + ' ' + esc((App.user.name || '').split(' ')[0]) + '</h2>' +
        '<p>' + (pending ? 'شما ' + pending + ' درخواست در انتظار تأیید دارید.' : 'همه‌چیز مرتب است.') + (lowStock.length ? ' · ' + lowStock.length + ' قلم در آستانه اتمام' : '') + '</p>' +
        '<div class="hero-stats">' +
          '<div class="hero-stat"><div class="k">کل اقلام</div><div class="v"><span data-count="' + totalItems + '">0</span> <small>عدد</small></div></div>' +
          '<div class="hero-stat"><div class="k">در انتظار</div><div class="v"><span data-count="' + pending + '">0</span> <small>درخواست</small></div></div>' +
          '<div class="hero-stat"><div class="k">تأییدشده (۷ روز)</div><div class="v"><span data-count="' + approvedWeek + '">0</span> <small>سند</small></div></div>' +
        '</div>' +
        (canCreate(App.user) ?
          '<div class="hero-quick">' +
            '<button data-action="newTransfer">' + IC.plus + ' درخواست جدید</button>' +
            '<button data-action="newInbound">' + IC.factory + ' ثبت ورود</button>' +
            '<button data-action="directCustomer">' + IC.truck + ' ارسال به مشتری</button>' +
          '</div>' : '') +
      '</div>' +

      '<div class="widget w-4">' +
        '<div class="w-head"><div><div class="w-title"><div class="ic">' + IC.zap + '</div>دسترسی سریع</div></div></div>' +
        '<div class="qa">' +
          '<button class="qa-btn" data-action="newTransfer"><div class="ic">' + IC.plus + '</div><b>درخواست انتقال</b><span>ثبت جابه‌جایی</span></button>' +
          '<button class="qa-btn alt-1" data-action="newInbound"><div class="ic">' + IC.factory + '</div><b>ورود کالا</b><span>از تأمین‌کننده</span></button>' +
          '<button class="qa-btn alt-2" data-action="stockInit"><div class="ic">' + IC.sparkle + '</div><b>مقداردهی</b><span>ثبت موجودی</span></button>' +
          '<button class="qa-btn alt-3" data-action="reports"><div class="ic">' + IC.chart + '</div><b>گزارش‌ها</b><span>خروجی Excel/PDF</span></button>' +
        '</div>' +
      '</div>' +

      (lowStock.length ?
        '<div class="widget w-12 low-stock-widget">' +
          '<div class="w-head"><div><div class="w-title warn"><div class="ic warn">' + IC.alert + '</div>هشدار موجودی کم</div><div class="w-sub">' + lowStock.length + ' قلم در آستانه اتمام است</div></div><button class="btn xs ghost" data-action="notif">مشاهده همه</button></div>' +
          '<div class="low-stock-list">' +
            lowStock.slice(0, 3).map(function (it) {
              return '<div class="low-stock-item"><div class="lsi-name">' + esc(it.product.name) + '</div><div class="lsi-wh">' + esc(it.warehouse.name) + '</div><div class="lsi-qty">' + it.stock.quantity + ' ' + esc(it.product.unit || '') + '</div></div>';
            }).join('') +
          '</div>' +
        '</div>' : '') +

      '<div class="wh-section"><span class="wh-section-title">انبارها</span><span class="wh-section-line"></span><span class="wh-section-count">۴ انبار</span></div>' +
      statCard('central', 'انبار مرکزی', IC.package, 'linear-gradient(135deg,#007AFF,#5856D6)') +
      statCard('paint_in', 'رنگ‌کاری داخلی', IC.palette, 'linear-gradient(135deg,#FF9500,#E67E00)') +
      statCard('paint_out', 'رنگ‌کاری بیرون', IC.palette, 'linear-gradient(135deg,#EA580C,#C2410C)') +
      statCard('upholstery', 'رویه‌کوبی', IC.hammer, 'linear-gradient(135deg,#5AC8FA,#0EA5E9)') +

      '<div class="wh-section"><span class="wh-section-title">نمایشگاه و فروش</span><span class="wh-section-line"></span><span class="wh-section-count">۴ مکان</span></div>' +
      statCard('store', 'فروشگاه', IC.store, 'linear-gradient(135deg,#34C759,#00A14B)') +
      statCard('showroom_khalij', 'نمایشگاه خلیج فارس', IC.store, 'linear-gradient(135deg,#AF52DE,#7c3aed)') +
      statCard('showroom_alus', 'نمایشگاه الوس', IC.store, 'linear-gradient(135deg,#9333EA,#6b21a8)') +
      statCard('sold', 'کالای فروش‌رفته', IC.receipt, 'linear-gradient(135deg,#FF3B30,#D70015)') +

      '<div class="widget w-6">' +
        '<div class="w-head"><div><div class="w-title"><div class="ic info">' + IC.shield + '</div>خط تأیید</div><div class="w-sub">' + pending + ' در انتظار · ' + approvedN + ' تکمیل‌شده</div></div></div>' +
        '<div class="pipe">' +
          '<div class="pipe-step active"><div class="pipe-num">۱</div><div class="lbl">تأیید انباردار<small>انباردار</small><div class="pipe-bar"><div class="pipe-bar-fill" style="width:' + Math.round(pendingW / maxPipe * 100) + '%"></div></div></div><div class="pipe-count">' + pendingW + '</div></div>' +
          '<div class="pipe-step ' + (pendingA > 0 ? 'active' : '') + '"><div class="pipe-num">۲</div><div class="lbl">تأیید حسابدار<small>حسابداری</small><div class="pipe-bar"><div class="pipe-bar-fill" style="width:' + Math.round(pendingA / maxPipe * 100) + '%"></div></div></div><div class="pipe-count">' + pendingA + '</div></div>' +
          '<div class="pipe-step ' + (pendingM > 0 ? 'active' : '') + '"><div class="pipe-num">۳</div><div class="lbl">تأیید مدیر<small>مدیر</small><div class="pipe-bar"><div class="pipe-bar-fill" style="width:' + Math.round(pendingM / maxPipe * 100) + '%"></div></div></div><div class="pipe-count">' + pendingM + '</div></div>' +
          '<div class="pipe-step done"><div class="pipe-num">✓</div><div class="lbl">تکمیل‌شده<small>نهایی</small><div class="pipe-bar"><div class="pipe-bar-fill" style="width:' + Math.round(approvedN / maxPipe * 100) + '%"></div></div></div><div class="pipe-count">' + approvedN + '</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="widget w-6">' +
        '<div class="w-head"><div><div class="w-title"><div class="ic">' + IC.fire + '</div>آخرین فعالیت‌ها</div></div><button class="btn xs ghost" data-action="transfers">مشاهده</button></div>' +
        '<div class="feed">' +
          (feed.length ?
            feed.map(function (t) {
              var p = getProd(db, t.productId);
              var isIn = t.type === 'inbound';
              var avTone = t.status === 'approved' ? (isIn ? 'info' : 'success') : t.status === 'rejected' ? 'danger' : 'warn';
              var title = isIn ?
                '<b>' + esc(t.createdByName || '') + '</b> ورود <span class="tag">' + esc((p && p.name) || '') + '</span>' :
                '<b>' + esc(t.createdByName || '') + '</b> انتقال <span class="tag">' + esc((p && p.name) || '') + '</span>';
              return '<div class="feed-item" data-tid="' + t.id + '"><div class="feed-av ' + avTone + '">' + esc(initials(t.createdByName || 'SY')) + '</div><div class="feed-body"><div class="feed-title">' + title + '</div><div class="feed-meta">' + IC.clock + ' ' + relTime(t.createdAt) + '</div></div></div>';
            }).join('') :
            emptyState('فعالیتی ثبت نشده')) +
        '</div>' +
      '</div>' +

      '<div class="widget w-12">' +
        '<div class="w-head"><div><div class="w-title"><div class="ic">' + IC.chart + '</div>آخرین ۷ روز</div><div class="w-sub">تعداد اسناد تأییدشده روزانه</div></div></div>' +
        '<div class="chart-bar-wrap" style="background:transparent;border:none;padding:12px 0">' + renderBarChartSVG(weekValues, weekLabels, '#007AFF') + '</div>' +
      '</div>' +

      '<div class="widget w-5">' +
        '<div class="w-head"><div><div class="w-title"><div class="ic">' + IC.users + '</div>تیم</div></div>' +
          (canManageUsers(App.user) ? '<button class="btn xs ghost" data-action="users">مدیریت</button>' : '') +
        '</div>' +
        '<div class="team">' +
          db.users.slice(0, 5).map(function (u) {
            return '<div class="team-row"><div class="avatar" style="width:36px;height:36px;font-size:12px">' + esc(initials(u.name)) + '</div><div class="team-info"><b>' + esc(u.name) + '</b><span>' + (u.isActive ? 'فعال' : 'غیرفعال') + '</span></div><span class="role-badge ' + u.role + '">' + ROLES[u.role] + '</span></div>';
          }).join('') +
        '</div>' +
      '</div>' +

      '<div class="widget w-7">' +
        '<div class="w-head"><div><div class="w-title"><div class="ic danger">' + IC.clock + '</div>در انتظار تأیید</div><div class="w-sub">' + pending + ' درخواست</div></div><button class="btn xs ghost" data-action="notif">اعلان‌ها</button></div>' +
        (pending ?
          '<div class="t-list">' + db.transfers.filter(function (t) { return t.status.indexOf('pending') === 0; }).slice(0, 3).map(function (t) { return transferItemHTML(db, t); }).join('') + '</div>' :
          emptyState('همه‌چیز تأیید شده')) +
      '</div>' +
    '</div>';

    $$('[data-action]', page).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.action;
        if (a === 'newTransfer') go('newTransfer');
        else if (a === 'newInbound') go('newInbound');
        else if (a === 'directCustomer') go('directCustomer');
        else if (a === 'stockInit') go('stockInit');
        else if (a === 'transfers') go('transfers');
        else if (a === 'users') go('users');
        else if (a === 'reports') go('reports');
        else if (a === 'notif') openNotif();
      });
    });
    $$('[data-tid]', page).forEach(function (el) {
      el.addEventListener('click', function () { openTransfer(el.dataset.tid); });
    });
    $$('[data-count]', page).forEach(function (el) { countUp(el, +el.dataset.count); });
  }

  /* ============================================================
     SHARED HELPERS USED BY PAGES
     ============================================================ */
  function countUp(el, target, dur) {
    dur = dur || 800;
    var t0 = performance.now();
    function tick(now) {
      var p = Math.min((now - t0) / dur, 1);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e).toLocaleString('fa-IR');
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function emptyState(title, desc, actionHTML) {
    return '<div class="empty"><div class="empty-art"><div class="empty-circle">' + IC.inbox + '</div></div>' +
      '<b>' + esc(title) + '</b>' +
      (desc ? '<p>' + esc(desc) + '</p>' : '') +
      (actionHTML || '') +
    '</div>';
  }

  function transferItemHTML(db, t) {
    var st = stOf(t);
    var isIn = t.type === 'inbound';
    var p = getProd(db, t.productId);
    var src = getWh(db, t.sourceWarehouseId);
    var dst = getWh(db, t.destinationWarehouseId);
    var stepsHTML = '';
    for (var i = 1; i <= 4; i++) {
      var cls = '';
      if (t.status === 'approved') {
        cls = 'done';
      } else if (t.status === 'rejected') {
        var rMap = { warehouse: 1, accountant: 2, manager: 3 };
        var rS = t.rejection ? rMap[t.rejection.stage] : 0;
        if (i < rS) cls = 'done';
        else if (i === rS) cls = 'rejected';
      } else {
        if (i < st.step) cls = 'done';
        else if (i === st.step) cls = 'active';
      }
      stepsHTML += '<div class="t-step ' + cls + '"></div>';
    }
    var route = isIn ?
      '<div class="t-route" style="color:#0369a1">' + IC.factory + ' ' + esc(t.supplierName || '—') + ' ' + IC.arrowL + ' ' + esc((dst && dst.name) || '—') + '</div>' :
      '<div class="t-route">' + esc((src && src.name) || '—') + ' ' + IC.arrowL + ' ' + esc((dst && dst.name) || '—') + '</div>';
    return '<div class="t-item" data-tid="' + t.id + '">' +
      '<div class="t-row1"><span class="t-code">' + esc(t.code) + '</span>' +
        '<span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span>' +
        (isIn ? '<span class="badge inbound">' + IC.inbound + ' ورود</span>' : '') +
        '<span class="small muted" style="margin-right:auto">' + relTime(t.createdAt) + '</span>' +
      '</div>' +
      '<div class="t-row2">' + route +
        '<span>' + esc((p && p.name) || '') + '</span>' +
        '<span class="t-qty">' + t.quantity + ' ' + esc((p && p.unit) || '') + '</span>' +
        '<div class="t-progress">' + stepsHTML + '</div>' +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     PAGE: STOCK
     ============================================================ */
  function pageStock(page) {
    var db = loadDB();
    var state = { wh: '', q: '', sort: null, dir: null };

    page.innerHTML = '<div class="page-head"><div><h1>موجودی انبارها</h1><div class="sub">نمای کلی موجودی همه انبارها و نمایشگاه‌ها</div></div></div>' +
      '<div class="table-card">' +
        '<div class="table-toolbar">' +
          '<div class="search-input">' + IC.search + '<input id="s-q" placeholder="جستجو..." /></div>' +
          '<select class="chip" id="s-wh" style="height:40px;padding:0 36px 0 16px;appearance:none;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2364748b\' stroke-width=\'2.5\'><polyline points=\'6 9 12 15 18 9\'/></svg>&quot;);background-repeat:no-repeat;background-position:left 14px center;background-size:12px;border-radius:100px"><option value="">همه انبارها</option>' +
            db.warehouses.filter(function (w) { return w.type !== 'customer'; }).map(function (w) {
              return '<option value="' + w.id + '">' + esc(w.name) + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        '<div class="table-scroll" id="s-table"></div>' +
      '</div>';

    function buildRows() {
      return db.stocks.filter(function (s) {
        if (state.wh && s.warehouseId !== state.wh) return false;
        if (state.q) {
          var p = getProd(db, s.productId);
          if (!p) return false;
          var q = state.q.toLowerCase();
          if (p.name.toLowerCase().indexOf(q) < 0 && (p.code || '').toLowerCase().indexOf(q) < 0) return false;
        }
        return true;
      }).map(function (s) {
        return { s: s, p: getProd(db, s.productId), w: getWh(db, s.warehouseId) };
      }).filter(function (r) { return r.p && r.w && r.w.type !== 'customer'; });
    }

    function draw() {
      var rows = buildRows();
      if (state.sort && state.dir) {
        rows = sortRows(rows, state.sort, state.dir, function (r, k) {
          if (k === 'name') return r.p.name;
          if (k === 'wh') return r.w.name;
          if (k === 'qty') return r.s.quantity;
          if (k === 'reserved') return r.s.reservedQty || 0;
          if (k === 'avail') return r.s.quantity - (r.s.reservedQty || 0);
          if (k === 'updated') return r.s.updatedAt || '';
          return '';
        });
      }
      var tbl = $('#s-table');
      if (!rows.length) {
        tbl.innerHTML = emptyState('موردی یافت نشد', 'فیلترها را تغییر دهید یا کالای جدیدی اضافه کنید');
        return;
      }
      var sortAttrs = function (key) {
        var cls = 'data-sort="' + key + '"';
        if (state.sort === key) cls += ' class="' + (state.dir === 'asc' ? 'sort-asc' : 'sort-desc') + '"';
        return cls;
      };
      var ind = function (key) {
        return '<span class="sort-ind">' + (state.sort === key ? (state.dir === 'asc' ? '▲' : '▼') : '⇅') + '</span>';
      };
      tbl.innerHTML = '<table class="dt"><thead><tr>' +
        '<th ' + sortAttrs('name') + '>کالا ' + ind('name') + '</th>' +
        '<th ' + sortAttrs('wh') + '>انبار ' + ind('wh') + '</th>' +
        '<th ' + sortAttrs('qty') + ' style="text-align:left">موجودی ' + ind('qty') + '</th>' +
        '<th ' + sortAttrs('reserved') + ' style="text-align:left">رزرو ' + ind('reserved') + '</th>' +
        '<th ' + sortAttrs('avail') + ' style="text-align:left">قابل استفاده ' + ind('avail') + '</th>' +
        '<th class="col-sm-hide" ' + sortAttrs('updated') + '>به‌روزرسانی ' + ind('updated') + '</th>' +
        '</tr></thead><tbody>' +
        rows.map(function (r) {
          var hasComp = r.p.components && r.p.components.length;
          var kitChip = hasComp ? '<span class="kit-chip" data-pid="' + r.p.id + '">' + IC.grid + ' ' + r.p.components.length + ' قلم</span>' : '';
          var minQ = r.s.minQuantity || 5;
          var isLow = r.s.quantity > 0 && r.s.quantity <= minQ;
          var rowCls = isLow ? ' class="row-low"' : '';
          var lowBadge = isLow ? ' <span class="low-stock-badge">' + IC.alert + ' کم</span>' : '';
          var imgHTML = r.p.image ? '<img class="img-thumb" src="' + r.p.image + '" alt="">' : '<div class="img-thumb-placeholder">' + IC.package + '</div>';
          return '<tr' + rowCls + '><td><div class="cell-product"><div class="img-wrap">' + imgHTML + '<div class="info"><b>' + esc(r.p.name) + '</b><div style="display:flex;gap:4px;margin-top:2px">' + (r.p.code ? '<span class="code-chip">' + esc(r.p.code) + '</span>' : '') + '<span class="unit-chip">' + esc(r.p.unit || '') + '</span>' + kitChip + '</div></div></div></div></td>' +
            '<td><div class="wh-cell"><span class="wh-dot" style="background:' + (WH_COLOR[r.w.type] || '#94a3b8') + '"></span>' + esc(r.w.name) + '</div></td>' +
            '<td class="num">' + r.s.quantity + ' <span class="unit">' + esc(r.p.unit || '') + '</span>' + lowBadge + '</td>' +
            '<td class="num muted">' + (r.s.reservedQty || 0) + '</td>' +
            '<td class="num"><span class="qty-hl">' + (r.s.quantity - (r.s.reservedQty || 0)) + '</span></td>' +
            '<td class="date-cell col-sm-hide">' + relTime(r.s.updatedAt) + '</td></tr>';
        }).join('') + '</tbody></table>';
      $$('th[data-sort]', tbl).forEach(function (th) {
        th.addEventListener('click', function () {
          var k = th.dataset.sort;
          if (state.sort !== k) { state.sort = k; state.dir = 'asc'; }
          else if (state.dir === 'asc') { state.dir = 'desc'; }
          else { state.sort = null; state.dir = null; }
          draw();
        });
      });
    }

    $('#s-q').addEventListener('input', function (e) { state.q = e.target.value.trim(); draw(); });
    $('#s-wh').addEventListener('change', function (e) { state.wh = e.target.value; draw(); });
    draw();
  }

  /* ============================================================
     PAGE: STOCK INIT (setup quantities + images + kit components)
     ============================================================ */
  function pageStockInit(page) {
    var db = loadDB();
    var stockable = db.warehouses.filter(function (w) { return w.type !== 'customer'; });
    var comps = [];
    var currentProductId = null;
    var currentImage = '';

    var datalist = '<datalist id="prod-suggest">' +
      db.products.map(function (p) {
        return '<option value="' + esc(p.name) + '">' + (p.code ? esc(p.code) : '') + (p.unit ? ' · ' + esc(p.unit) : '') + '</option>';
      }).join('') + '</datalist>';

    page.innerHTML = '<div class="page-head"><div><h1>مقداردهی اولیه</h1><div class="sub">نام کالا را تایپ کنید، واحد شمارش را انتخاب کنید و موجودی را ثبت کنید</div></div></div>' +
      '<div class="widget" style="max-width:860px">' + datalist +
        '<form id="if" class="form-grid" autocomplete="off">' +
          '<div class="field full">' +
            '<label>نام کالا <span class="req">*</span></label>' +
            '<input id="ip" list="prod-suggest" required placeholder="مثلاً: مبل مدل A" autocomplete="off" spellcheck="false" />' +
            '<div class="hint">' + IC.info + ' اگر کالا در لیست باشد به‌روزرسانی می‌شود، در غیر این صورت کالای جدید ساخته می‌شود.</div>' +
            '<div id="prod-status"></div>' +
          '</div>' +
          '<div class="field"><label>واحد شمارش <span class="req">*</span></label><select id="iu" required>' +
            UNITS.map(function (u) { return '<option value="' + u + '"' + (u === 'دست' ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>انبار <span class="req">*</span></label><select id="iw" required><option value="">انتخاب...</option>' +
            stockable.map(function (w) { return '<option value="' + w.id + '">' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>تعداد <span class="req">*</span></label><input id="iq" type="number" min="0" required placeholder="0" /></div>' +
          '<div class="field"><label>حد هشدار (کم‌موجودی)</label><input id="imin" type="number" min="0" value="5" placeholder="5" /><div class="hint">' + IC.info + ' وقتی به این تعداد یا کمتر رسید، هشدار داده می‌شود</div></div>' +
          '<div class="field full">' +
            '<label>تصویر کالا</label>' +
            '<div class="img-upload-box">' +
              '<div class="img-upload-preview" id="img-preview">' + IC.image + '</div>' +
              '<div class="img-upload-info">' +
                '<label for="img-input">انتخاب یا تغییر تصویر</label>' +
                '<small>فرمت JPG/PNG · تصویر خودکار فشرده می‌شود (حداکثر ۴۰۰×۴۰۰ پیکسل)</small>' +
                '<div class="img-upload-actions">' +
                  '<button type="button" class="btn ghost sm" id="img-btn">' + IC.upload + ' انتخاب فایل</button>' +
                  '<button type="button" class="btn ghost sm" id="img-clear" style="display:none">' + IC.trash + ' حذف</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<input type="file" id="img-input" accept="image/*" style="display:none" />' +
          '</div>' +
          '<div class="full" id="kit-wrap" style="display:none">' +
            '<div class="kit-box">' +
              '<div class="kit-head">' +
                '<div class="kit-head-title"><div class="kit-ic">' + IC.grid + '</div><div>اقلام تشکیل‌دهنده یک <span class="kit-unit-name" id="kit-unit-name">دست</span> کامل<small>مشخص کنید یک <span id="kit-unit-name-2">دست</span> از چه اقلامی ساخته می‌شود</small></div></div>' +
                '<button type="button" class="btn xs primary" id="kit-add">' + IC.plus + ' افزودن قلم</button>' +
              '</div>' +
              '<div class="kit-list" id="kit-list"></div>' +
              '<div class="kit-total" id="kit-total" style="display:none"></div>' +
              '<div class="kit-hint">' + IC.info + ' هر تعداد که ثبت کنید، برابر است با همین بسته‌ی اقلام.</div>' +
            '</div>' +
          '</div>' +
          '<div class="full" id="iq-hint"></div>' +
          '<div class="full row" style="justify-content:flex-end;margin-top:6px"><button class="btn primary" type="submit" id="if-submit">' + IC.check + ' ثبت موجودی</button></div>' +
        '</form>' +
      '</div>';

    var pInput = $('#ip');
    var unitSel = $('#iu');
    var wSel = $('#iw');
    var qtyInput = $('#iq');
    var minInput = $('#imin');
    var statusBox = $('#prod-status');

    function updateImagePreview() {
      var box = $('#img-preview');
      var clr = $('#img-clear');
      if (currentImage) {
        box.innerHTML = '<img src="' + currentImage + '" alt="">';
        if (clr) clr.style.display = '';
      } else {
        box.innerHTML = IC.image;
        if (clr) clr.style.display = 'none';
      }
    }

    $('#img-btn').addEventListener('click', function () { $('#img-input').click(); });
    $('#img-input').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      if (f.size > 4 * 1024 * 1024) { toast('حجم زیاد', 'حداکثر ۴ مگابایت', 'error'); return; }
      compressImage(f, 400, 0.75).then(function (dataUrl) {
        currentImage = dataUrl;
        updateImagePreview();
        toast('تصویر آماده شد', '', 'success');
      }).catch(function (err) { toast('خطا', err.message || '', 'error'); });
      e.target.value = '';
    });
    $('#img-clear').addEventListener('click', function () { currentImage = ''; updateImagePreview(); });

    function renderKit() {
      var u = unitSel.value;
      var isKit = isKitUnit(u);
      $('#kit-wrap').style.display = isKit ? '' : 'none';
      $('#kit-unit-name').textContent = u;
      $('#kit-unit-name-2').textContent = u;
      if (!isKit) return;
      var list = $('#kit-list');
      if (!comps.length) {
        list.innerHTML = '<div class="kit-empty"><b>هنوز قلمی اضافه نشده</b>روی «افزودن قلم» بزنید</div>';
        $('#kit-total').style.display = 'none';
        return;
      }
      list.innerHTML = comps.map(function (c, i) {
        return '<div class="kit-row"><input class="kit-name" data-i="' + i + '" value="' + esc(c.name) + '" placeholder="نام قلم" /><input class="kit-qty" data-i="' + i + '" type="number" min="1" value="' + (c.qty || 1) + '" placeholder="تعداد" /><button type="button" class="kit-del" data-i="' + i + '" title="حذف">' + IC.trash + '</button></div>';
      }).join('');
      var total = comps.reduce(function (a, c) { return a + (parseInt(c.qty, 10) || 0); }, 0);
      $('#kit-total').style.display = '';
      $('#kit-total').innerHTML = IC.grid + ' جمع اقلام در هر ' + esc(u) + ': <b>' + total.toLocaleString('fa-IR') + '</b> عدد';
      $$('.kit-name', list).forEach(function (inp) {
        inp.addEventListener('input', function () { comps[+inp.dataset.i].name = inp.value; });
      });
      $$('.kit-qty', list).forEach(function (inp) {
        inp.addEventListener('input', function () {
          comps[+inp.dataset.i].qty = Math.max(1, parseInt(inp.value, 10) || 1);
          var total = comps.reduce(function (a, c) { return a + (parseInt(c.qty, 10) || 0); }, 0);
          $('#kit-total').innerHTML = IC.grid + ' جمع اقلام: <b>' + total.toLocaleString('fa-IR') + '</b> عدد';
        });
      });
      $$('.kit-del', list).forEach(function (b) {
        b.addEventListener('click', function () {
          var i = +b.dataset.i;
          var row = b.closest('.kit-row');
          if (row) row.style.animation = 'fadeOut .18s forwards';
          setTimeout(function () { comps.splice(i, 1); renderKit(); }, 180);
        });
      });
    }

    function updateProductStatus() {
      var val = pInput.value.trim();
      if (!val) { statusBox.innerHTML = ''; currentProductId = null; return; }
      var fresh = loadDB();
      var match = findProductByName(fresh, val);
      if (match) {
        currentProductId = match.id;
        currentImage = match.image || '';
        updateImagePreview();
        var stockList = fresh.stocks.filter(function (s) { return s.productId === match.id && s.quantity > 0; });
        var totalQ = stockList.reduce(function (a, s) { return a + s.quantity; }, 0);
        var compCount = (match.components || []).length;
        statusBox.innerHTML = '<div style="margin-top:8px;padding:12px 14px;background:rgba(52,199,89,.10);border:1px solid rgba(52,199,89,.22);border-radius:16px;font-size:12.5px;color:#047857;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' + IC.check + ' کالای موجود: <b>' + esc(match.name) + '</b> <span class="unit-chip">' + esc(match.unit || '—') + '</span>' + (compCount ? ' <span class="kit-chip" style="cursor:default">' + IC.grid + ' ' + compCount + ' قلم</span>' : '') + (totalQ > 0 ? ' <span style="opacity:.8">(موجودی فعلی: ' + totalQ + ')</span>' : '') + '</div>';
        if (match.unit && match.unit !== unitSel.value) {
          var found = false;
          for (var k = 0; k < UNITS.length; k++) if (UNITS[k] === match.unit) { found = true; break; }
          unitSel.value = found ? match.unit : 'عدد';
        }
        comps = (match.components || []).map(function (c) { return { id: c.id || uid(), name: c.name || '', qty: c.qty || 1 }; });
        renderKit();
      } else {
        currentProductId = null;
        currentImage = '';
        updateImagePreview();
        if (comps.length) { comps = []; renderKit(); }
        statusBox.innerHTML = '<div style="margin-top:8px;padding:12px 14px;background:rgba(0,122,255,.10);border:1px solid rgba(0,122,255,.22);border-radius:16px;font-size:12.5px;color:var(--blue);display:flex;align-items:center;gap:8px">' + IC.plus + ' کالای جدید ساخته می‌شود: <b>' + esc(val) + '</b></div>';
      }
    }

    function updReservedHint() {
      var box = $('#iq-hint');
      var name = pInput.value.trim();
      var wid = wSel.value;
      if (!name || !wid) { box.innerHTML = ''; return; }
      var tmp = loadDB();
      var m = findProductByName(tmp, name);
      if (!m) { box.innerHTML = ''; return; }
      var s = findStock(tmp, m.id, wid);
      var rq = s ? (s.reservedQty || 0) : 0;
      if (rq > 0) box.innerHTML = '<div style="padding:12px 16px;background:rgba(255,149,0,.1);border-radius:16px;font-size:12.5px;color:#b45309">' + IC.alert + ' این کالا ' + rq + ' ' + esc(m.unit || '') + ' رزرو دارد. مقدار جدید نباید کمتر از ' + rq + ' باشد.</div>';
      else box.innerHTML = '';
    }

    pInput.addEventListener('input', function () { updateProductStatus(); updReservedHint(); });
    pInput.addEventListener('change', function () { updateProductStatus(); updReservedHint(); });
    wSel.addEventListener('change', updReservedHint);
    unitSel.addEventListener('change', renderKit);
    $('#kit-add').addEventListener('click', function () {
      comps.push({ id: uid(), name: '', qty: 1 });
      renderKit();
      var list = $('#kit-list');
      var rows = $$('.kit-row', list);
      if (rows.length) {
        var last = rows[rows.length - 1];
        var ni = last.querySelector('.kit-name');
        if (ni) ni.focus();
      }
    });

    $('#if').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = pInput.value.trim();
      var unit = unitSel.value;
      var wid = wSel.value;
      var qty = parseInt(qtyInput.value, 10);
      var minQ = parseInt(minInput.value, 10);
      if (!name || !wid || isNaN(qty) || qty < 0) { toast('اطلاعات ناقص', 'نام، انبار و تعداد الزامی است', 'error'); return; }
      if (name.length < 2) { toast('نام کوتاه است', '', 'warn'); return; }
      if (isKitUnit(unit)) {
        var cleanComps = comps.map(function (c) {
          return { id: c.id || uid(), name: (c.name || '').trim(), qty: Math.max(1, parseInt(c.qty, 10) || 1) };
        }).filter(function (c) { return c.name.length > 0; });
        if (!cleanComps.length) { toast('اقلام خالی است', 'حداقل یک قلم وارد کنید', 'warn'); return; }
        comps = cleanComps;
      }
      var btn = $('#if-submit');
      if (btn) btn.classList.add('loading');
      setTimeout(function () {
        try {
          var fresh = loadDB();
          var product = findProductByName(fresh, name);
          var created = false;
          if (!product) {
            product = { id: uid(), name: name, code: '', unit: unit, image: currentImage || '', components: isKitUnit(unit) ? comps.slice() : [], createdAt: new Date().toISOString() };
            fresh.products.push(product);
            created = true;
          } else {
            product.unit = unit;
            product.image = currentImage || '';
            product.components = isKitUnit(unit) ? comps.slice() : [];
          }
          var s = findStock(fresh, product.id, wid);
          var rq = s ? (s.reservedQty || 0) : 0;
          if (qty < rq) { if (btn) btn.classList.remove('loading'); toast('کمتر از رزرو', 'حداقل ' + rq + ' باشد', 'error'); return; }
          if (s) {
            s.quantity = qty;
            s.minQuantity = isNaN(minQ) ? 5 : minQ;
            s.updatedAt = new Date().toISOString();
          } else {
            fresh.stocks.push({ id: uid(), productId: product.id, warehouseId: wid, quantity: qty, reservedQty: 0, minQuantity: isNaN(minQ) ? 5 : minQ, updatedAt: new Date().toISOString() });
          }
          saveDB(fresh);
          if (created) toast('کالا و موجودی ثبت شد', product.name, 'success');
          else toast('موجودی به‌روزرسانی شد', product.name, 'success');
          go('stock');
        } catch (err) {
          if (btn) btn.classList.remove('loading');
          toast('خطا', err.message || '', 'error');
        }
      }, 350);
    });
    renderKit();
    setTimeout(function () { pInput.focus(); }, 100);
    attachRippleAll();
  }

  /* ============================================================
     PAGE: TRANSFERS (with bulk select)
     ============================================================ */
  var bulkSelection = {}; // id -> true

  function pageTransfers(page) {
    var db = loadDB();
    var filter = 'all';
    var q = '';
    var list = db.transfers.filter(function (t) { return t.type !== 'inbound'; });

    function cnt(f) { return list.filter(function (t) { return t.status === f; }).length; }

    page.innerHTML = '<div class="page-head"><div><h1>جابه‌جایی‌ها</h1></div>' +
      (canCreate(App.user) ?
        '<div class="page-actions">' +
          '<button class="btn ghost" id="select-btn">' + IC.check + ' انتخاب چندتایی</button>' +
          '<button class="btn ghost" id="d-btn">' + IC.truck + ' ارسال به مشتری</button>' +
          '<button class="btn primary" id="n-btn">' + IC.plus + ' درخواست جدید</button>' +
        '</div>' : '') +
      '</div>' +
      '<div class="widget">' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">' +
          '<button class="chip ' + (filter === 'all' ? 'active' : '') + '" data-f="all">همه <span class="count">' + list.length + '</span></button>' +
          '<button class="chip ' + (filter === 'pending_warehouse' ? 'active' : '') + '" data-f="pending_warehouse">انبار <span class="count">' + cnt('pending_warehouse') + '</span></button>' +
          '<button class="chip ' + (filter === 'pending_accountant' ? 'active' : '') + '" data-f="pending_accountant">حسابداری <span class="count">' + cnt('pending_accountant') + '</span></button>' +
          '<button class="chip ' + (filter === 'pending_manager' ? 'active' : '') + '" data-f="pending_manager">مدیر <span class="count">' + cnt('pending_manager') + '</span></button>' +
          '<button class="chip ' + (filter === 'approved' ? 'active' : '') + '" data-f="approved">تکمیل‌شده <span class="count">' + cnt('approved') + '</span></button>' +
          '<button class="chip ' + (filter === 'rejected' ? 'active' : '') + '" data-f="rejected">ردشده <span class="count">' + cnt('rejected') + '</span></button>' +
          '<div class="search-input" style="margin-right:auto">' + IC.search + '<input id="t-q" placeholder="جستجو..." /></div>' +
        '</div>' +
        '<div id="t-list"></div>' +
      '</div>' +
      '<div class="bulk-bar" id="bulk-bar">' +
        '<span class="bulk-count"><b id="bulk-n">0</b> مورد انتخاب شد</span>' +
        '<button class="btn success sm" id="bulk-approve">' + IC.check + ' تأیید همه</button>' +
        '<button class="btn danger sm" id="bulk-reject">' + IC.x + ' رد همه</button>' +
        '<button class="btn ghost sm" id="bulk-clear">لغو</button>' +
      '</div>';

    var selectMode = false;

    function updateBulkBar() {
      var n = Object.keys(bulkSelection).filter(function (k) { return bulkSelection[k]; }).length;
      var bar = $('#bulk-bar');
      if (!bar) return;
      $('#bulk-n').textContent = n;
      if (n > 0) bar.classList.add('show');
      else bar.classList.remove('show');
    }

    function draw() {
      var l = list.slice();
      if (filter !== 'all') l = l.filter(function (t) { return t.status === filter; });
      if (q) {
        var s = q.toLowerCase();
        l = l.filter(function (t) {
          var p = getProd(db, t.productId);
          return t.code.toLowerCase().indexOf(s) >= 0 || ((p && p.name) || '').toLowerCase().indexOf(s) >= 0;
        });
      }
      var el = $('#t-list');
      if (!l.length) {
        el.innerHTML = emptyState('موردی یافت نشد', 'فیلتر را تغییر دهید یا درخواست جدید ثبت کنید');
        updateBulkBar();
        return;
      }
      el.innerHTML = '<div class="t-list">' + l.map(function (t) {
        var item = transferItemHTML(db, t);
        if (selectMode) {
          var selCls = bulkSelection[t.id] ? ' selected' : '';
          item = item.replace('class="t-item"', 'class="t-item selectable' + selCls + '"');
          item = item.replace('<div class="t-row1">', '<div class="t-check" data-check="' + t.id + '">' + IC.check + '</div><div class="t-row1">');
        }
        return item;
      }).join('') + '</div>';
      $$('[data-tid]', el).forEach(function (x) {
        x.addEventListener('click', function (e) {
          if (selectMode && (e.target.closest('.t-check') || e.target.closest('.t-item'))) {
            var id = x.dataset.tid;
            bulkSelection[id] = !bulkSelection[id];
            updateBulkBar();
            draw();
            return;
          }
          if (!selectMode) openTransfer(x.dataset.tid);
        });
      });
      updateBulkBar();
    }

    $$('.chip[data-f]').forEach(function (b) {
      b.addEventListener('click', function () {
        filter = b.dataset.f;
        $$('.chip[data-f]').forEach(function (x) { x.classList.toggle('active', x.dataset.f === filter); });
        draw();
      });
    });
    $('#t-q').addEventListener('input', function (e) { q = e.target.value.trim(); draw(); });
    var nb = $('#n-btn');
    if (nb) nb.addEventListener('click', function () { go('newTransfer'); });
    var dbtn = $('#d-btn');
    if (dbtn) dbtn.addEventListener('click', function () { go('directCustomer'); });
    var selBtn = $('#select-btn');
    if (selBtn) {
      selBtn.addEventListener('click', function () {
        selectMode = !selectMode;
        if (!selectMode) bulkSelection = {};
        toast(selectMode ? 'حالت انتخاب' : 'خروج از انتخاب', '', 'info');
        draw();
      });
    }

    $('#bulk-clear').addEventListener('click', function () {
      bulkSelection = {};
      selectMode = false;
      draw();
    });

    $('#bulk-approve').addEventListener('click', function () {
      var ids = Object.keys(bulkSelection).filter(function (k) { return bulkSelection[k]; });
      if (!ids.length) return;
      var succeeded = 0, skipped = 0;
      ids.forEach(function (id) {
        var fresh = loadDB();
        var t = null;
        for (var i = 0; i < fresh.transfers.length; i++) if (fresh.transfers[i].id === id) { t = fresh.transfers[i]; break; }
        if (!t || !canApprove(App.user, t)) { skipped++; return; }
        var step = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), note: 'تأیید گروهی' };
        if (t.status === 'pending_warehouse') {
          t.warehouseApproval = step;
          t.status = 'pending_accountant';
          succeeded++;
        } else if (t.status === 'pending_accountant') {
          t.accountantApproval = step;
          t.status = 'pending_manager';
          succeeded++;
        } else if (t.status === 'pending_manager') {
          if (t.type === 'inbound') {
            t.managerApproval = step;
            var ds = findStock(fresh, t.productId, t.destinationWarehouseId);
            if (!ds) {
              ds = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, minQuantity: 5, updatedAt: new Date().toISOString() };
              fresh.stocks.push(ds);
            }
            ds.quantity = (ds.quantity || 0) + t.quantity;
            ds.updatedAt = new Date().toISOString();
            t.status = 'approved';
            t.completedAt = new Date().toISOString();
            succeeded++;
          } else {
            var srcS = findStock(fresh, t.productId, t.sourceWarehouseId);
            if (srcS && srcS.quantity >= t.quantity) {
              srcS.quantity -= t.quantity;
              srcS.reservedQty = Math.max(0, (srcS.reservedQty || 0) - t.quantity);
              srcS.updatedAt = new Date().toISOString();
              var dw = getWh(fresh, t.destinationWarehouseId);
              if (dw && dw.type !== 'customer') {
                var ds2 = findStock(fresh, t.productId, t.destinationWarehouseId);
                if (!ds2) {
                  ds2 = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, minQuantity: 5, updatedAt: new Date().toISOString() };
                  fresh.stocks.push(ds2);
                }
                ds2.quantity = (ds2.quantity || 0) + t.quantity;
                ds2.updatedAt = new Date().toISOString();
              }
              t.managerApproval = step;
              t.status = 'approved';
              t.completedAt = new Date().toISOString();
              succeeded++;
            } else {
              skipped++;
            }
          }
        } else {
          skipped++;
        }
        saveDB(fresh);
      });
      bulkSelection = {};
      selectMode = false;
      toast('تأیید گروهی', succeeded + ' تأیید · ' + skipped + ' رد شد', succeeded ? 'success' : 'warn');
      render();
    });

    $('#bulk-reject').addEventListener('click', function () {
      var ids = Object.keys(bulkSelection).filter(function (k) { return bulkSelection[k]; });
      if (!ids.length) return;
      openModal({
        title: 'رد گروهی',
        desc: ids.length + ' درخواست انتخاب شده — دلیل رد را وارد کنید',
        body: '<div class="field"><label>دلیل <span class="req">*</span></label><textarea id="bulk-rj-reason"></textarea></div>',
        actions: [
          { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
          {
            label: IC.x + ' ثبت رد',
            cls: 'danger',
            onClick: function (c) {
              var reasonBox = c.querySelector('#bulk-rj-reason');
              var reason = reasonBox ? reasonBox.value.trim() : '';
              if (!reason) { toast('دلیل الزامی', '', 'warn'); return; }
              var fresh = loadDB();
              var ok = 0, skip = 0;
              ids.forEach(function (id) {
                var t = null;
                for (var i = 0; i < fresh.transfers.length; i++) if (fresh.transfers[i].id === id) { t = fresh.transfers[i]; break; }
                if (!t || !canApprove(App.user, t)) { skip++; return; }
                var stageMap = { pending_warehouse: 'warehouse', pending_accountant: 'accountant', pending_manager: 'manager' };
                if (t.type !== 'inbound') {
                  var ss = findStock(fresh, t.productId, t.sourceWarehouseId);
                  if (ss) {
                    ss.reservedQty = Math.max(0, (ss.reservedQty || 0) - t.quantity);
                    ss.updatedAt = new Date().toISOString();
                  }
                }
                t.rejection = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), reason: reason, stage: stageMap[t.status] };
                t.status = 'rejected';
                ok++;
              });
              saveDB(fresh);
              bulkSelection = {};
              selectMode = false;
              c.remove();
              toast('رد گروهی', ok + ' رد · ' + skip + ' ناموفق', ok ? 'success' : 'warn');
              render();
            }
          }
        ]
      });
    });

    draw();
  }

  /* ============================================================
     PAGE: INBOUNDS
     ============================================================ */
  function pageInbounds(page) {
    var db = loadDB();
    var filter = 'all';
    var list = db.transfers.filter(function (t) { return t.type === 'inbound'; });

    function cnt(f) { return list.filter(function (t) { return t.status === f; }).length; }

    page.innerHTML = '<div class="page-head"><div><h1>ورود کالا از تأمین‌کننده</h1></div>' +
      (canCreate(App.user) ? '<div class="page-actions"><button class="btn primary" id="ni-btn">' + IC.factory + ' ثبت ورود جدید</button></div>' : '') +
      '</div>' +
      '<div class="widget">' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">' +
          '<button class="chip ' + (filter === 'all' ? 'active' : '') + '" data-f="all">همه <span class="count">' + list.length + '</span></button>' +
          '<button class="chip ' + (filter === 'pending_warehouse' ? 'active' : '') + '" data-f="pending_warehouse">انبار <span class="count">' + cnt('pending_warehouse') + '</span></button>' +
          '<button class="chip ' + (filter === 'pending_accountant' ? 'active' : '') + '" data-f="pending_accountant">حسابداری <span class="count">' + cnt('pending_accountant') + '</span></button>' +
          '<button class="chip ' + (filter === 'pending_manager' ? 'active' : '') + '" data-f="pending_manager">مدیر <span class="count">' + cnt('pending_manager') + '</span></button>' +
          '<button class="chip ' + (filter === 'approved' ? 'active' : '') + '" data-f="approved">تأییدشده <span class="count">' + cnt('approved') + '</span></button>' +
          '<button class="chip ' + (filter === 'rejected' ? 'active' : '') + '" data-f="rejected">ردشده <span class="count">' + cnt('rejected') + '</span></button>' +
        '</div>' +
        '<div id="i-list"></div>' +
      '</div>';

    function draw() {
      var l = list.slice();
      if (filter !== 'all') l = l.filter(function (t) { return t.status === filter; });
      var el = $('#i-list');
      if (!l.length) { el.innerHTML = emptyState('موردی یافت نشد', 'ورود جدیدی ثبت کنید'); return; }
      el.innerHTML = '<div class="t-list">' + l.map(function (t) { return transferItemHTML(db, t); }).join('') + '</div>';
      $$('[data-tid]', el).forEach(function (x) {
        x.addEventListener('click', function () { openTransfer(x.dataset.tid); });
      });
    }

    $$('.chip[data-f]').forEach(function (b) {
      b.addEventListener('click', function () {
        filter = b.dataset.f;
        $$('.chip[data-f]').forEach(function (x) { x.classList.toggle('active', x.dataset.f === filter); });
        draw();
      });
    });
    var nb = $('#ni-btn');
    if (nb) nb.addEventListener('click', function () { go('newInbound'); });
    draw();
  }

  /* ============================================================
     TRANSFER DETAIL DRAWER
     ============================================================ */
  function openTransfer(id) {
    var db = loadDB();
    var t = null;
    for (var i = 0; i < db.transfers.length; i++) {
      if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
    }
    if (!t) { toast('یافت نشد', '', 'error'); return; }
    var st = stOf(t);
    var isIn = t.type === 'inbound';
    var p = getProd(db, t.productId);
    var src = getWh(db, t.sourceWarehouseId);
    var dst = getWh(db, t.destinationWarehouseId);

    var steps = [
      { title: 'ثبت درخواست', done: true, at: t.createdAt, user: t.createdByName, icon: IC.plus },
      { title: 'تأیید انباردار', step: t.warehouseApproval, icon: IC.package },
      { title: 'تأیید حسابدار', step: t.accountantApproval, icon: IC.shield },
      { title: 'تأیید مدیر', step: t.managerApproval, icon: IC.users },
      { title: isIn ? 'ورود قطعی' : 'انتقال قطعی', done: !!t.completedAt, at: t.completedAt, icon: IC.check }
    ];
    var rMap = { warehouse: 1, accountant: 2, manager: 3 };
    var rStep = t.rejection ? rMap[t.rejection.stage] : -1;
    var tlHTML = steps.map(function (s, i) {
      var cls = '';
      if (i === 0 || i === 4) {
        cls = s.done ? 'done' : '';
      } else {
        if (s.step) cls = 'done';
        else if (i === rStep) cls = 'rejected';
        else if (i === st.step) cls = 'active';
      }
      var meta = [];
      if (s.at) meta.push('<b>' + esc(s.user || '') + '</b> · ' + faDate(s.at));
      if (s.step) meta.push('<b>' + esc(s.step.userName) + '</b> · ' + faDate(s.step.at));
      if (i === rStep && t.rejection) {
        meta.push('<span style="color:#FF3B30">رد توسط <b>' + esc(t.rejection.userName) + '</b><br>دلیل: ' + esc(t.rejection.reason) + '</span>');
      }
      var icon = cls === 'done' ? IC.check : cls === 'rejected' ? IC.x : cls === 'active' ? IC.clock : s.icon;
      return '<li class="' + cls + '"><div class="tl-node">' + icon + '</div><div class="tl-title">' + s.title + '</div>' + (meta.length ? '<div class="tl-meta">' + meta.join('<br>') + '</div>' : '') + '</li>';
    }).join('');

    // Product-specific history (last 8 transfers for this product)
    var prodHistory = db.transfers.filter(function (tt) { return tt.productId === t.productId; })
      .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); })
      .slice(0, 8);
    var historyHTML = '<div style="margin-top:16px"><div style="font-weight:700;margin-bottom:12px">تاریخچه این کالا</div><div class="prod-timeline">' +
      prodHistory.map(function (ph) {
        var phSt = stOf(ph);
        var isPHin = ph.type === 'inbound';
        var cls = ph.status === 'approved' ? 'done' : ph.status === 'rejected' ? 'rejected' : 'active';
        var icon = ph.status === 'approved' ? IC.check : ph.status === 'rejected' ? IC.x : IC.clock;
        var desc = isPHin ? 'ورود از ' + (ph.supplierName || '—') : 'انتقال ' + ph.quantity + ' عدد';
        return '<div class="pt-item ' + cls + '"><div class="pt-node">' + icon + '</div><div class="pt-title">' + esc(ph.code) + ' · ' + esc(desc) + '</div><div class="pt-meta">' + esc(phSt.label) + ' · ' + relTime(ph.createdAt) + '</div></div>';
      }).join('') +
    '</div></div>';

    var kitBlock = '';
    if (p && p.components && p.components.length && isKitUnit(p.unit)) {
      kitBlock = '<div style="margin-top:16px"><div style="font-weight:700;margin-bottom:10px">اقلام یک ' + esc(p.unit) + ' کامل</div><div class="kit-list">' +
        p.components.map(function (c) {
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;font-size:13px"><b>' + esc(c.name) + '</b><span class="notif-qty">×' + c.qty + '</span></div>';
        }).join('') +
      '</div></div>';
    }

    var imgBlock = '';
    if (p && p.image) {
      imgBlock = '<div style="text-align:center;margin-bottom:14px"><img src="' + p.image + '" alt="" style="max-width:100%;max-height:200px;border-radius:16px;border:1px solid var(--border)"></div>';
    }

    var body = imgBlock +
      '<div class="dl" style="grid-template-columns:repeat(2,1fr);display:grid;gap:1px;margin-bottom:16px">' +
        '<div class="dl-item"><div class="k">وضعیت</div><div class="v"><span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span></div></div>' +
        '<div class="dl-item"><div class="k">نوع</div><div class="v">' + (isIn ? 'ورود' : (t.type === 'direct-customer' ? 'ارسال به مشتری' : 'انتقال')) + '</div></div>' +
        (isIn ?
          '<div class="dl-item"><div class="k">تأمین‌کننده</div><div class="v">' + esc(t.supplierName || '—') + '</div></div>' :
          '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((src && src.name) || '—') + '</div></div>') +
        '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dst && dst.name) || '—') + '</div></div>' +
        '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p && p.name) || '—') + '</div></div>' +
        '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + t.quantity + ' ' + esc((p && p.unit) || '') + '</div></div>' +
        (isIn && t.invoiceNumber ? '<div class="dl-item" style="grid-column:1/-1"><div class="k">شماره فاکتور</div><div class="v" style="font-family:monospace">' + esc(t.invoiceNumber) + '</div></div>' : '') +
        (t.customerName ? '<div class="dl-item"><div class="k">مشتری</div><div class="v">' + esc(t.customerName) + '</div></div><div class="dl-item"><div class="k">تماس</div><div class="v">' + esc(t.customerPhone || '—') + '</div></div>' : '') +
        (t.description ? '<div class="dl-item" style="grid-column:1/-1"><div class="k">توضیحات</div><div class="v" style="font-weight:400">' + esc(t.description) + '</div></div>' : '') +
      '</div>' +
      kitBlock +
      '<div style="font-weight:700;margin:16px 0 14px">مراحل تأیید</div>' +
      '<ul class="tl">' + tlHTML + '</ul>' +
      historyHTML;

    var foot = '';
    if (canApprove(App.user, t)) {
      foot = '<button class="btn success" id="d-approve" style="flex:1">' + IC.check + ' تأیید</button><button class="btn danger" id="d-reject">' + IC.x + ' رد</button>';
    } else {
      foot = '<div class="muted small" style="text-align:center;width:100%">اقدامی برای شما در دسترس نیست</div>';
    }

    openDrawer({
      title: '<span style="font-family:monospace;font-size:13px;color:var(--muted)">' + esc(t.code) + '</span>',
      body: body,
      foot: foot
    });
    var ap = $('#d-approve');
    if (ap) ap.addEventListener('click', function () { closeDrawer(); doApprove(t.id); });
    var rj = $('#d-reject');
    if (rj) rj.addEventListener('click', function () { closeDrawer(); doReject(t.id); });
  }

  /* ============================================================
     PAGE: NEW TRANSFER (wizard)
     ============================================================ */
  function pageNewTransfer(page) {
    var db = loadDB();
    var sources = db.warehouses.filter(function (w) { return allowedSourceTypes().indexOf(w.type) >= 0; });
    if (!sources.length) {
      page.innerHTML = '<div class="page-head"><div><h1>درخواست جابه‌جایی</h1></div></div><div class="widget">' + emptyState('انباری برای مبدأ یافت نشد') + '</div>';
      return;
    }
    var state = { step: 1, src: '', dst: '', pid: '', qty: 0, desc: '', customerName: '', customerPhone: '' };
    page.innerHTML = '<div class="page-head"><div><h1>درخواست جابه‌جایی</h1></div></div>' +
      '<div class="widget" style="max-width:760px;margin:0 auto">' +
        '<div class="wiz-steps"><div class="wiz-line"><div class="wiz-fill" id="wiz-fill"></div></div>' +
          '<div class="wiz-step active" data-step="1"><div class="num">۱</div><div class="lbl">مسیر</div></div>' +
          '<div class="wiz-step" data-step="2"><div class="num">۲</div><div class="lbl">کالا</div></div>' +
          '<div class="wiz-step" data-step="3"><div class="num">۳</div><div class="lbl">تأیید</div></div>' +
        '</div>' +
        '<div id="wiz-body"></div>' +
        '<div style="display:flex;gap:10px;margin-top:22px;justify-content:space-between">' +
          '<button class="btn ghost" id="wiz-back">قبلی</button>' +
          '<button class="btn primary" id="wiz-next">بعدی</button>' +
        '</div>' +
      '</div>';

    function updateSteps() {
      $$('.wiz-step').forEach(function (el) {
        var s = +el.dataset.step;
        el.classList.toggle('active', s === state.step);
        el.classList.toggle('done', s < state.step);
      });
      $('#wiz-fill').style.width = ((state.step - 1) / 2 * 100) + '%';
    }

    function draw() {
      updateSteps();
      var body = $('#wiz-body');
      var back = $('#wiz-back');
      var next = $('#wiz-next');
      back.style.visibility = state.step === 1 ? 'hidden' : 'visible';
      next.innerHTML = state.step === 3 ? (IC.check + ' ثبت نهایی') : ('بعدی ' + IC.arrowL);

      if (state.step === 1) {
        var srcW = null;
        for (var i = 0; i < sources.length; i++) {
          if (sources[i].id === state.src) { srcW = sources[i]; break; }
        }
        var allowed = state.src ? allowedDest(srcW && srcW.type) : [];
        var dests = db.warehouses.filter(function (w) { return allowed.indexOf(w.type) >= 0; });
        body.innerHTML = '<div class="form-grid">' +
          '<div class="field"><label>انبار مبدأ <span class="req">*</span></label><select id="w-src"><option value="">انتخاب...</option>' +
            sources.map(function (w) { return '<option value="' + w.id + '" ' + (state.src === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>انبار مقصد <span class="req">*</span></label><select id="w-dst" ' + (!state.src ? 'disabled' : '') + '><option value="">' + (state.src ? 'انتخاب...' : 'ابتدا مبدأ') + '</option>' +
            dests.map(function (w) { return '<option value="' + w.id + '" ' + (state.dst === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
        '</div>' +
        '<div style="margin-top:16px" class="muted small">مسیر مجاز خودکار محدود می‌شود.</div>';
        $('#w-src').addEventListener('change', function (e) { state.src = e.target.value; state.dst = ''; draw(); });
        $('#w-dst').addEventListener('change', function (e) { state.dst = e.target.value; draw(); });
      } else if (state.step === 2) {
        var stock = findStock(db, state.pid, state.src);
        var avail = stock ? stock.quantity - (stock.reservedQty || 0) : 0;
        body.innerHTML = '<div class="form-grid">' +
          '<div class="field"><label>کالا <span class="req">*</span></label><select id="w-pid"><option value="">انتخاب...</option>' +
            db.products.map(function (p) { return '<option value="' + p.id + '" ' + (state.pid === p.id ? 'selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>تعداد <span class="req">*</span></label><input id="w-qty" type="number" min="1" value="' + (state.qty || '') + '" /></div>' +
          '<div class="full field"><label>توضیحات</label><textarea id="w-desc">' + esc(state.desc) + '</textarea></div>' +
          (state.pid && state.src ? '<div class="full"><div style="padding:14px 18px;background:var(--grad-soft);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:#007AFF;font-size:16px">' + avail + '</b></div></div>' : '') +
        '</div>';
        $('#w-pid').addEventListener('change', function (e) { state.pid = e.target.value; state.qty = 0; draw(); });
        $('#w-qty').addEventListener('input', function (e) { state.qty = +e.target.value; });
        $('#w-desc').addEventListener('input', function (e) { state.desc = e.target.value; });
      } else {
        var srcW2 = getWh(db, state.src);
        var dstW = getWh(db, state.dst);
        var p2 = getProd(db, state.pid);
        var kitMini = '';
        if (p2 && p2.components && p2.components.length && isKitUnit(p2.unit)) {
          kitMini = '<div style="margin-top:12px;padding:12px 14px;background:var(--surface-2);border-radius:16px;font-size:12px;color:var(--text-2)">' + IC.grid + ' اقلام: ' + p2.components.map(function (c) { return esc(c.name) + ' ×' + c.qty; }).join(' + ') + '</div>';
        }
        var customerBlock = '';
        if (dstW && dstW.type === 'sold') {
          customerBlock = '<div class="full form-grid" style="margin-top:8px;padding-top:14px;border-top:1px dashed var(--border)">' +
            '<div class="field"><label>نام مشتری</label><input id="w-cname" value="' + esc(state.customerName) + '" placeholder="اختیاری" /></div>' +
            '<div class="field"><label>شماره تماس</label><input id="w-cphone" value="' + esc(state.customerPhone) + '" placeholder="اختیاری" /></div>' +
          '</div>';
        }
        body.innerHTML = '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">' +
          '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((srcW2 && srcW2.name) || '') + '</div></div>' +
          '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dstW && dstW.name) || '') + '</div></div>' +
          '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p2 && p2.name) || '') + '</div></div>' +
          '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + state.qty + ' ' + esc((p2 && p2.unit) || '') + '</div></div>' +
        '</div>' + kitMini +
        (dstW && dstW.type === 'sold' ? '<div style="margin-top:14px;padding:12px 14px;background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.2);border-radius:14px;font-size:12px;color:#b91c1c">' + IC.alert + ' انتقال به «کالای فروش‌رفته»</div>' : '') +
        customerBlock +
        '<div style="margin-top:16px" class="muted small">' + IC.info + ' پس از ثبت، در انتظار تأیید انباردار</div>';
        if (dstW && dstW.type === 'sold') {
          var c1 = $('#w-cname');
          if (c1) c1.addEventListener('input', function (e) { state.customerName = e.target.value; });
          var c2 = $('#w-cphone');
          if (c2) c2.addEventListener('input', function (e) { state.customerPhone = e.target.value; });
        }
      }
    }

    $('#wiz-back').addEventListener('click', function () {
      if (state.step > 1) { state.step--; draw(); }
    });

    $('#wiz-next').addEventListener('click', function () {
      if (state.step === 1) {
        if (!state.src || !state.dst) { toast('اطلاعات ناقص', 'مبدأ و مقصد', 'warn'); return; }
        state.step = 2;
        draw();
      } else if (state.step === 2) {

              productId: state.pid,
              quantity: state.qty,
              description: state.desc,
              customerName: state.customerName || '',
              customerPhone: state.customerPhone || '',
              status: 'pending_warehouse',
              createdBy: App.user.id,
              createdByName: App.user.name,
              createdAt: new Date().toISOString()
            };
            fresh.transfers.unshift(t);

            btn.classList.remove('loading');
            toast('خطا', err.message || '', 'error');
          }
        }, 400);
      }
    });

  }
