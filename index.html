  /* ============================================================
     EXPORT HELPERS
     ============================================================ */
  function downloadBlob(blob, filename) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        if (a.parentNode) a.remove();
      }, 500);
    } catch (e) { toast('خطا در دانلود', e.message || '', 'error'); }
  }

  function exportCSV(filename, headers, rows) {
    function e2(v) {
      var s = String(v == null ? '' : v);
      if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var csv = '\ufeff' + headers.map(e2).join(',') + '\n' + rows.map(function (r) { return r.map(e2).join(','); }).join('\n');
    downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), filename + '.csv');
  }

  function exportExcel(filename, title, headers, rows) {
    var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 10px;text-align:right;font-family:Tahoma}th{background:#eef2f9;font-weight:bold;color:#334155}</style></head><body>';
    html += '<h3 style="font-family:Tahoma;color:#007AFF">' + title + '</h3>';
    html += '<p style="font-family:Tahoma;font-size:11px;color:#666">تاریخ: ' + faDate(new Date().toISOString()) + '</p>';
    html += '<table><thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr>' + r.map(function (c) { return '<td>' + (c == null ? '' : String(c)) + '</td>'; }).join('') + '</tr>';
    });
    html += '</tbody></table></body></html>';
    downloadBlob(new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8' }), filename + '.xls');
  }

  function buildPdfHtml(title, subtitle, headers, rows, autoPrint) {
    var html = '<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8"><title>' + title + '</title>';
    html += '<style>body{font-family:Tahoma,"Vazirmatn",sans-serif;padding:20px;color:#1e293b;margin:0}h1{font-size:20px;margin:0 0 6px;color:#007AFF}h2{font-size:12px;font-weight:500;color:#64748b;margin:0 0 18px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #cbd5e1;padding:6px 8px;text-align:right;vertical-align:middle}th{background:#eef2f9;font-weight:bold;color:#334155}tr:nth-child(even) td{background:#f8fafc}.empty{padding:40px;text-align:center;color:#94a3b8}@media print{@page{size:A4 landscape;margin:10mm}body{padding:0}h1{font-size:16px}}</style>';
    html += '</head><body>';
    html += '<h1>' + esc(title) + '</h1>';
    html += '<h2>' + esc(subtitle || '') + ' — تاریخ: ' + faDate(new Date().toISOString()) + '</h2>';
    if (!rows || !rows.length) {
      html += '<div class="empty">موردی برای نمایش نیست</div>';
    } else {
      html += '<table><thead><tr>' + headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>' + r.map(function (c) { return '<td>' + esc(c == null ? '' : String(c)) + '</td>'; }).join('') + '</tr>';
      });
      html += '</tbody></table>';
    }
    if (autoPrint) html += '<scr' + 'ipt>setTimeout(function(){try{window.focus();window.print();}catch(e){}},500);</scr' + 'ipt>';
    html += '</body></html>';
    return html;
  }

  function exportPDF(title, subtitle, headers, rows) {
    try {
      var old = document.querySelector('.pdf-modal');
      if (old) old.remove();
      var inlineHtml = buildPdfHtml(title, subtitle, headers, rows, false);
      var printableHtml = buildPdfHtml(title, subtitle, headers, rows, true);
      var m = document.createElement('div');
      m.className = 'pdf-modal';
      m.innerHTML =
        '<div class="pdf-toolbar">' +
          '<button type="button" class="btn ghost sm" id="pdf-close" title="بستن">' + IC.chevR + ' <span class="lbl">بستن</span></button>' +
          '<div class="pdf-title">' + esc(title) + '</div>' +
          '<button type="button" class="btn ghost sm" id="pdf-newwin" title="تب جدید">' + IC.file + ' <span class="lbl">تب جدید</span></button>' +
          '<button type="button" class="btn primary sm" id="pdf-print" title="چاپ">' + IC.print + ' <span class="lbl">چاپ</span></button>' +
        '</div>' +
        '<div class="pdf-frame-wrap"><iframe id="pdf-frame" sandbox="allow-same-origin allow-modals allow-popups allow-scripts"></iframe></div>';
      document.body.appendChild(m);
      var frame = m.querySelector('#pdf-frame');
      try {
        frame.srcdoc = inlineHtml;
      } catch (e) {
        try {
          frame.contentDocument.open();
          frame.contentDocument.write(inlineHtml);
          frame.contentDocument.close();
        } catch (e2) {}
      }
      function closePdf() { try { m.remove(); } catch (e) {} }
      m.querySelector('#pdf-close').addEventListener('click', closePdf);
      m.querySelector('#pdf-print').addEventListener('click', function () {
        try {
          var win = frame.contentWindow;
          if (!win) throw new Error('iframe');
          win.focus();
          win.print();
        } catch (e) {
          try {
            var w = window.open('', '_blank');
            if (!w) { toast('پاپ‌آپ مسدود', '', 'warn'); return; }
            w.document.open();
            w.document.write(printableHtml);
            w.document.close();
          } catch (err) { toast('خطا', err.message || '', 'error'); }
        }
      });
      m.querySelector('#pdf-newwin').addEventListener('click', function () {
        try {
          var w = window.open('', '_blank');
          if (!w) { toast('پاپ‌آپ مسدود', '', 'warn'); return; }
          w.document.open();
          w.document.write(printableHtml);
          w.document.close();
        } catch (e) { toast('خطا', e.message || '', 'error'); }
      });
      attachRippleAll(m);
    } catch (e) { toast('خطا', e.message || '', 'error'); }
  }

  /* ============================================================
     PAGE: REPORTS
     ============================================================ */
  function pageReports(page) {
    var tab = 'inventory';
    var filterWh = '';
    var fromDate = '';
    var toDate = '';
    var statusFilter = '';
    var sortState = { key: null, dir: null };

    function exportMenuHTML() {
      return '<div class="exp-dd" id="exp-dd">' +
        '<button class="btn ghost xs" id="exp-toggle">' + IC.download + ' خروجی ' + IC.chevD + '</button>' +
        '<div class="exp-dd-menu">' +
          '<button data-exp="excel">' + IC.download + ' Excel</button>' +
          '<button data-exp="csv">' + IC.file + ' CSV</button>' +
          '<button data-exp="pdf">' + IC.print + ' PDF</button>' +
        '</div>' +
      '</div>';
    }

    function render() {
      var db = loadDB();
      var whs = db.warehouses.filter(function (w) { return w.type !== 'customer'; });
      page.innerHTML = '<div class="page-head"><div><h1>گزارش‌ها</h1><div class="sub">خروجی Excel، CSV و PDF</div></div></div>' +
        '<div class="rep-tabs">' +
          '<button class="rep-tab ' + (tab === 'inventory' ? 'active' : '') + '" data-t="inventory">' + IC.layers + ' موجودی</button>' +
          '<button class="rep-tab ' + (tab === 'showrooms' ? 'active' : '') + '" data-t="showrooms">' + IC.store + ' نمایشگاه‌ها</button>' +
          '<button class="rep-tab ' + (tab === 'sold' ? 'active' : '') + '" data-t="sold">' + IC.receipt + ' فروش‌رفته</button>' +
          '<button class="rep-tab ' + (tab === 'paint' ? 'active' : '') + '" data-t="paint">' + IC.palette + ' رنگ‌کاری</button>' +
          '<button class="rep-tab ' + (tab === 'transfers' ? 'active' : '') + '" data-t="transfers">' + IC.swap + ' جابه‌جایی‌ها</button>' +
          '<button class="rep-tab ' + (tab === 'adjustments' ? 'active' : '') + '" data-t="adjustments">' + IC.refresh + ' تعدیلات</button>' +
        '</div>' +
        '<div class="table-card"><div id="rep-body"></div></div>';
      $$('.rep-tab').forEach(function (b) {
        b.addEventListener('click', function () { tab = b.dataset.t; render(); });
      });
      var body = $('#rep-body');
      if (tab === 'inventory') body.innerHTML = renderInventory(db, whs, filterWh, true);
      else if (tab === 'showrooms') body.innerHTML = renderInventory(db, whs.filter(function (w) { return ['showroom_khalij', 'showroom_alus'].indexOf(w.type) >= 0; }), '', false);
      else if (tab === 'sold') body.innerHTML = renderInventory(db, whs.filter(function (w) { return w.type === 'sold'; }), '', false);
      else if (tab === 'paint') body.innerHTML = renderInventory(db, whs.filter(function (w) { return ['paint_in', 'paint_out'].indexOf(w.type) >= 0; }), '', false);
      else if (tab === 'transfers') body.innerHTML = renderTransfers(db);
      else if (tab === 'adjustments') body.innerHTML = renderAdj(db);
      bindActions(db, whs);
    }

    function renderInventory(db, whs, whFilter, showFilter) {
      var effective = whFilter ? whs.filter(function (w) { return w.id === whFilter; }) : whs;
      var rows = inventoryRows(db, effective);
      if (sortState.key && sortState.dir) {
        rows = sortRows(rows, sortState.key, sortState.dir, function (r, k) {
          if (k === 'name') return r.product.name;
          if (k === 'wh') return r.warehouse.name;
          if (k === 'qty') return r.stock.quantity;
          if (k === 'avail') return r.avail;
          return '';
        });
      }
      var stats = '<div class="rep-stat-grid">';
      effective.forEach(function (w) {
        var total = rows.filter(function (r) { return r.warehouse.id === w.id; }).reduce(function (a, r) { return a + r.stock.quantity; }, 0);
        stats += '<div class="rep-stat"><div class="k"><span class="wh-dot" style="background:' + (WH_COLOR[w.type] || '#94a3b8') + '"></span>' + esc(w.name) + '</div><div class="v">' + total.toLocaleString('fa-IR') + ' <small>عدد</small></div></div>';
      });
      stats += '</div>';

      // Donut chart for warehouse distribution
      var segments = effective.map(function (w) {
        var total = rows.filter(function (r) { return r.warehouse.id === w.id; }).reduce(function (a, r) { return a + r.stock.quantity; }, 0);
        return { name: w.name, value: total, color: WH_COLOR[w.type] || '#94a3b8' };
      }).filter(function (s) { return s.value > 0; });
      var donutHTML = '';
      if (segments.length) {
        donutHTML = '<div class="chart-donut-wrap">' +
          renderDonutSVG(segments, 130) +
          '<div class="chart-donut-legend">' +
            segments.map(function (s) {
              var total = segments.reduce(function (a, x) { return a + x.value; }, 0);
              var pct = Math.round(s.value / total * 100);
              return '<div class="chart-legend-item"><span class="chart-legend-dot" style="background:' + s.color + '"></span><span class="chart-legend-name">' + esc(s.name) + '</span><span class="chart-legend-value">' + s.value.toLocaleString('fa-IR') + '</span><span class="chart-legend-pct">' + pct + '%</span></div>';
            }).join('') +
          '</div>' +
        '</div>';
      }

      var filters = '<div class="rep-filters">' +
        (showFilter ?
          '<div class="field"><label>انبار:</label><select id="rep-wh"><option value="">همه</option>' +
            whs.map(function (w) { return '<option value="' + w.id + '" ' + (whFilter === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') +
          '</select></div>' : '') +
        '<div class="rep-actions">' + exportMenuHTML() + '</div>' +
      '</div>';

      var ind = function (key) {
        return '<span class="sort-ind">' + (sortState.key === key ? (sortState.dir === 'asc' ? '▲' : '▼') : '⇅') + '</span>';
      };
      var sa = function (key) {
        var c = 'data-sort="' + key + '"';
        if (sortState.key === key) c += ' class="' + (sortState.dir === 'asc' ? 'sort-asc' : 'sort-desc') + '"';
        return c;
      };
      var table = '<div class="table-scroll">';
      if (!rows.length) {
        table += emptyState('موردی نیست', 'گزارشی برای این فیلتر وجود ندارد');
      } else {
        table += '<table class="dt"><thead><tr>' +
          '<th ' + sa('name') + '>کالا ' + ind('name') + '</th>' +
          '<th>کد</th><th>واحد</th>' +
          '<th ' + sa('wh') + '>انبار ' + ind('wh') + '</th>' +
          '<th ' + sa('qty') + ' style="text-align:left">موجودی ' + ind('qty') + '</th>' +
          '<th style="text-align:left">رزرو</th>' +
          '<th ' + sa('avail') + ' style="text-align:left">قابل استفاده ' + ind('avail') + '</th>' +
          '<th class="col-sm-hide">به‌روزرسانی</th>' +
        '</tr></thead><tbody>';
        rows.forEach(function (r) {
          table += '<tr><td><b style="color:var(--text)">' + esc(r.product.name) + '</b></td><td>' + (r.product.code ? '<span class="code-chip">' + esc(r.product.code) + '</span>' : '—') + '</td><td>' + esc(r.product.unit || '—') + '</td>' +
            '<td><div class="wh-cell"><span class="wh-dot" style="background:' + (WH_COLOR[r.warehouse.type] || '#94a3b8') + '"></span>' + esc(r.warehouse.name) + '</div></td>' +
            '<td class="num">' + r.stock.quantity + '</td><td class="num muted">' + (r.stock.reservedQty || 0) + '</td><td class="num"><span class="qty-hl">' + r.avail + '</span></td>' +
            '<td class="date-cell col-sm-hide">' + faDateShort(r.stock.updatedAt) + '</td></tr>';
        });
        table += '</tbody></table>';
      }
      table += '</div>';
      return stats + donutHTML + filters + table;
    }

    function renderTransfers(db) {
      var list = db.transfers.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      if (fromDate) list = list.filter(function (t) { return new Date(t.createdAt) >= new Date(fromDate); });
      if (toDate) {
        var td = new Date(toDate);
        td.setDate(td.getDate() + 1);
        list = list.filter(function (t) { return new Date(t.createdAt) < td; });
      }
      if (statusFilter) list = list.filter(function (t) { return t.status === statusFilter; });
      var rows = list.map(function (t) {
        return { t: t, p: getProd(db, t.productId), src: getWh(db, t.sourceWarehouseId), dst: getWh(db, t.destinationWarehouseId), st: stOf(t) };
      });
      var filters = '<div class="rep-filters">' +
        '<div class="field"><label>از تاریخ:</label><input type="date" id="rep-from" value="' + fromDate + '" /></div>' +
        '<div class="field"><label>تا تاریخ:</label><input type="date" id="rep-to" value="' + toDate + '" /></div>' +
        '<div class="field"><label>وضعیت:</label><select id="rep-status"><option value="">همه</option>' +
          '<option value="pending_warehouse" ' + (statusFilter === 'pending_warehouse' ? 'selected' : '') + '>در انتظار انبار</option>' +
          '<option value="pending_accountant" ' + (statusFilter === 'pending_accountant' ? 'selected' : '') + '>در انتظار حسابدار</option>' +
          '<option value="pending_manager" ' + (statusFilter === 'pending_manager' ? 'selected' : '') + '>در انتظار مدیر</option>' +
          '<option value="approved" ' + (statusFilter === 'approved' ? 'selected' : '') + '>تأییدشده</option>' +
          '<option value="rejected" ' + (statusFilter === 'rejected' ? 'selected' : '') + '>ردشده</option>' +
        '</select></div>' +
        '<div class="rep-actions">' + exportMenuHTML() + '</div>' +
      '</div>';
      var table = '<div class="table-scroll">';
      if (!rows.length) {
        table += emptyState('موردی نیست', 'در این بازه گزارشی وجود ندارد');
      } else {
        table += '<table class="dt"><thead><tr><th>کد</th><th>تاریخ</th><th>نوع</th><th>مبدأ</th><th>مقصد</th><th>کالا</th><th style="text-align:left">تعداد</th><th>وضعیت</th><th class="col-sm-hide">ایجادکننده</th></tr></thead><tbody>';
        rows.forEach(function (r) {
          var typeLabel = r.t.type === 'inbound' ? 'ورود' : (r.t.type === 'direct-customer' ? 'ارسال' : 'انتقال');
          var srcLabel = r.t.type === 'inbound' ? ('تأمین‌کننده: ' + (r.t.supplierName || '')) : ((r.src && r.src.name) || '—');
          table += '<tr><td><span class="t-code">' + esc(r.t.code) + '</span></td><td class="date-cell">' + faDateShort(r.t.createdAt) + '</td><td>' + typeLabel + '</td><td>' + esc(srcLabel) + '</td><td>' + esc((r.dst && r.dst.name) || '—') + '</td><td>' + esc((r.p && r.p.name) || '—') + '</td><td class="num">' + r.t.quantity + ' <span class="unit">' + esc((r.p && r.p.unit) || '') + '</span></td><td><span class="badge ' + r.st.tone + '">' + r.st.label + '</span></td><td class="muted small col-sm-hide">' + esc(r.t.createdByName || '—') + '</td></tr>';
        });
        table += '</tbody></table>';
      }
      table += '</div>';
      return filters + table;
    }

    function renderAdj(db) {
      var list = (db.adjustments || []).slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
      var table = '<div class="table-scroll">';
      if (!list.length) {
        table += emptyState('تعدیلی ثبت نشده', 'صفر کردن موجودی تاریخچه می‌سازد');
      } else {
        table += '<table class="dt"><thead><tr><th>#</th><th>تاریخ</th><th>کاربر</th><th>نوع</th><th class="col-sm-hide">اقلام</th><th>یادداشت</th><th></th></tr></thead><tbody>';
        list.forEach(function (a, i) {
          table += '<tr><td><span class="row-num">' + (i + 1) + '</span></td><td class="date-cell">' + faDate(a.at) + '</td><td>' + esc(a.byName || '—') + '</td><td>' + (a.type === 'period_close' ? 'بستن دوره' : esc(a.type)) + '</td><td class="col-sm-hide">' + (a.itemsCount || 0) + ' قلم</td><td class="muted small">' + esc(a.note || '—') + '</td><td class="actions-cell"><button class="btn ghost xs" data-adj="' + a.id + '">جزئیات</button></td></tr>';
        });
        table += '</tbody></table>';
      }
      table += '</div>';
      return table;
    }

    function inventoryRows(db, whs) {
      var whIds = whs.map(function (w) { return w.id; });
      return db.stocks.filter(function (s) {
        if (whIds.indexOf(s.warehouseId) < 0) return false;
        if (s.quantity === 0 && (s.reservedQty || 0) === 0) return false;
        return true;
      }).map(function (s) {
        var p = getProd(db, s.productId);
        var w = getWh(db, s.warehouseId);
        if (!p || !w) return null;
        return { product: p, warehouse: w, stock: s, avail: s.quantity - (s.reservedQty || 0) };
      }).filter(Boolean).sort(function (a, b) {
        if (a.warehouse.name !== b.warehouse.name) return a.warehouse.name.localeCompare(b.warehouse.name, 'fa');
        return a.product.name.localeCompare(b.product.name, 'fa');
      });
    }

    function bindActions(db, whs) {
      var whSel = $('#rep-wh');
      if (whSel) whSel.addEventListener('change', function (e) { filterWh = e.target.value; render(); });
      var fromInp = $('#rep-from');
      if (fromInp) fromInp.addEventListener('change', function (e) { fromDate = e.target.value; render(); });
      var toInp = $('#rep-to');
      if (toInp) toInp.addEventListener('change', function (e) { toDate = e.target.value; render(); });
      var stSel = $('#rep-status');
      if (stSel) stSel.addEventListener('change', function (e) { statusFilter = e.target.value; render(); });

      var expDD = $('#exp-dd');
      if (expToggle) {
        expToggle.addEventListener('click', function (e) {

        });
      }
      document.addEventListener('click', function () {
        var dd = document.getElementById('exp-dd');
        if (dd) dd.classList.remove('open');
      });

      $$('[data-sort]').forEach(function (th) {
        th.addEventListener('click', function () {
          var k = th.dataset.sort;
          if (sortState.key !== k) { sortState.key = k; sortState.dir = 'asc'; }
          else if (sortState.dir === 'asc') { sortState.dir = 'desc'; }
          else { sortState.key = null; sortState.dir = null; }
          render();
        });

      $$('[data-exp]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {

          var kind = btn.dataset.exp;
          var dbf = loadDB();
          var title = '', headers = [], rows = [], filename = 'alus-' + ymd();

            var whs2 = dbf.warehouses.filter(function (w) { return w.type !== 'customer'; });
            if (tab === 'showrooms') whs2 = whs2.filter(function (w) { return ['showroom_khalij', 'showroom_alus'].indexOf(w.type) >= 0; });
            if (tab === 'sold') whs2 = whs2.filter(function (w) { return w.type === 'sold'; });
            if (tab === 'paint') whs2 = whs2.filter(function (w) { return ['paint_in', 'paint_out'].indexOf(w.type) >= 0; });
            if (tab === 'inventory' && filterWh) whs2 = whs2.filter(function (w) { return w.id === filterWh; });
            var r2 = inventoryRows(dbf, whs2);
            title = (tab === 'inventory' ? 'موجودی انبارها' : tab === 'showrooms' ? 'موجودی نمایشگاه‌ها' : tab === 'sold' ? 'فروش‌رفته' : 'رنگ‌کاری');
            headers = ['کالا', 'کد', 'واحد', 'انبار', 'موجودی', 'رزرو', 'قابل استفاده', 'به‌روزرسانی'];
            rows = r2.map(function (r) {
              return [r.product.name, r.product.code || '', r.product.unit || '', r.warehouse.name, r.stock.quantity, r.stock.reservedQty || 0, r.avail, faDateShort(r.stock.updatedAt)];
            });
          } else if (tab === 'transfers') {
            var list = dbf.transfers.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
            if (fromDate) list = list.filter(function (t) { return new Date(t.createdAt) >= new Date(fromDate); });
            if (toDate) {
              var td = new Date(toDate);
              td.setDate(td.getDate() + 1);
              list = list.filter(function (t) { return new Date(t.createdAt) < td; });
            }
            if (statusFilter) list = list.filter(function (t) { return t.status === statusFilter; });
            title = 'جابه‌جایی‌ها';
            headers = ['کد', 'تاریخ', 'نوع', 'مبدأ', 'مقصد', 'کالا', 'تعداد', 'واحد', 'وضعیت', 'ایجادکننده'];
            rows = list.map(function (t) {
              var p = getProd(dbf, t.productId);
              var src = getWh(dbf, t.sourceWarehouseId);
              var dst = getWh(dbf, t.destinationWarehouseId);
              var st = stOf(t);
              return [
                t.code, faDate(t.createdAt),
                t.type === 'inbound' ? 'ورود' : t.type === 'direct-customer' ? 'ارسال' : 'انتقال',
                t.type === 'inbound' ? ('تأمین‌کننده: ' + (t.supplierName || '')) : ((src && src.name) || ''),
                (dst && dst.name) || '', (p && p.name) || '', t.quantity, (p && p.unit) || '', st.label, t.createdByName || ''
              ];
            });
          } else if (tab === 'adjustments') {
            var adj = (dbf.adjustments || []).slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
            title = 'تعدیلات موجودی';
            headers = ['تاریخ', 'کاربر', 'نوع', 'تعداد اقلام', 'یادداشت'];
            rows = adj.map(function (a) { return [faDate(a.at), a.byName || '', a.type === 'period_close' ? 'بستن دوره' : a.type, a.itemsCount || 0, a.note || '']; });
          }
          if (kind === 'excel') exportExcel(filename, title, headers, rows);
          else if (kind === 'csv') exportCSV(filename, headers, rows);
          else if (kind === 'pdf') exportPDF(title, 'Alus · پنل مدیریت', headers, rows);
        });
      });

      $$('[data-adj]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.dataset.adj;
          var dbf = loadDB();
          var adj = (dbf.adjustments || []).filter(function (a) { return a.id === id; })[0];
          if (!adj) return;
          var snap = adj.snapshot || [];
          var body = '<div style="margin-bottom:12px" class="muted small">' + snap.length + ' قلم · جمع: ' + snap.reduce(function (a, s) { return a + s.quantity; }, 0) + ' عدد</div>' +
            '<div style="max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:14px">' +
              '<table class="dt" style="min-width:auto"><thead><tr><th>کالا</th><th>انبار</th><th style="text-align:left">موجودی قبلی</th></tr></thead><tbody>';
          snap.forEach(function (s) {
            var p = getProd(dbf, s.productId);
            var w = getWh(dbf, s.warehouseId);
            if (!p || !w) return;
            body += '<tr><td>' + esc(p.name) + '</td><td>' + esc(w.name) + '</td><td class="num">' + s.quantity + '</td></tr>';
          });
          body += '</tbody></table></div>';
          openModal({
            title: 'جزئیات تعدیل',
            desc: faDate(adj.at) + ' — ' + (adj.byName || '—'),
            body: body,
            actions: [{ label: 'بستن', cls: 'ghost', onClick: function (c) { c.remove(); } }]
          });
        });
      });
    }

    render();
  }

  /* ============================================================
     PAGE: SETTINGS
     ============================================================ */
  function pageSettings(page) {
    var db = loadDB();
    var totalStock = db.stocks.reduce(function (a, s) { return a + s.quantity; }, 0);
    var nonZero = db.stocks.filter(function (s) { return s.quantity > 0 || (s.reservedQty || 0) > 0; });
    var dbSize = 0;
    try { dbSize = new Blob([JSON.stringify(db)]).size; } catch (e) {}
    var notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';

    page.innerHTML = '<div class="page-head"><div><h1>تنظیمات</h1><div class="sub">مدیریت سیستمی — فقط راهبر</div></div></div>' +
      '<div class="bento">' +
        '<div class="widget w-6">' +
          '<div class="w-head"><div><div class="w-title info"><div class="ic info">' + IC.info + '</div>وضعیت</div></div></div>' +
          '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">' +
            '<div class="dl-item"><div class="k">کالاها</div><div class="v">' + db.products.length + '</div></div>' +
            '<div class="dl-item"><div class="k">انبارها</div><div class="v">' + db.warehouses.filter(function (w) { return w.type !== 'customer'; }).length + '</div></div>' +
            '<div class="dl-item"><div class="k">اسناد</div><div class="v">' + db.transfers.length + '</div></div>' +
            '<div class="dl-item"><div class="k">تعدیلات</div><div class="v">' + (db.adjustments || []).length + '</div></div>' +
            '<div class="dl-item"><div class="k">جمع موجودی</div><div class="v">' + totalStock.toLocaleString('fa-IR') + ' عدد</div></div>' +
            '<div class="dl-item"><div class="k">حجم داده‌ها</div><div class="v">' + (dbSize / 1024).toFixed(1) + ' KB</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="widget w-6">' +
          '<div class="w-head"><div><div class="w-title warn"><div class="ic warn">' + IC.bellRing + '</div>اعلان مرورگر</div></div></div>' +
          '<p style="font-size:12.5px;line-height:1.9;margin-bottom:14px">اعلان‌های مرورگر برای اطلاع سریع از تغییرات مهم (تأیید نهایی، ورود کالا).</p>' +
          (notifPerm === 'granted' ?
            '<div style="padding:12px 14px;background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.24);border-radius:14px;font-size:12.5px;color:#047857">' + IC.check + ' فعال است</div>' :
            notifPerm === 'denied' ?
            '<div style="padding:12px 14px;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.24);border-radius:14px;font-size:12.5px;color:#b91c1c">' + IC.x + ' مسدود شده — از تنظیمات مرورگر فعال کنید</div>' :
            '<div class="row" style="justify-content:flex-end"><button class="btn primary" id="req-notif">' + IC.bellRing + ' فعال‌سازی</button></div>') +
        '</div>' +
        '<div class="widget w-6">' +
          '<div class="w-head"><div><div class="w-title danger"><div class="ic danger">' + IC.alert + '</div>صفر کردن موجودی</div></div></div>' +
          '<p style="font-size:12.5px;line-height:1.9;margin-bottom:14px"><b>' + nonZero.length + ' ردیف</b> صفر می‌شود — تاریخچه حفظ می‌شود.</p>' +
          '<div class="row" style="justify-content:flex-end"><button class="btn danger" id="zero-btn">' + IC.refresh + ' صفر کردن</button></div>' +
        '</div>' +
        '<div class="widget w-12">' +
          '<div class="w-head"><div><div class="w-title"><div class="ic">' + IC.download + '</div>پشتیبان‌گیری</div></div></div>' +
          '<div class="row" style="justify-content:flex-end;gap:8px">' +
            '<button class="btn ghost" id="imp-btn">' + IC.upload + ' بازیابی</button>' +
            '<button class="btn success" id="exp-btn">' + IC.download + ' دانلود JSON</button>' +
            '<input type="file" id="imp-file" accept=".json" style="display:none" />' +
          '</div>' +
        '</div>' +
      '</div>';

    var reqBtn = $('#req-notif');
    if (reqBtn) {
      reqBtn.addEventListener('click', function () {
        requestNotifPermission();
        setTimeout(render, 500);
      });
    }
    $('#zero-btn').addEventListener('click', openZeroOutModal);
    $('#exp-btn').addEventListener('click', function () {
      var fresh = loadDB();
      var blob = new Blob([JSON.stringify(fresh, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'alus-backup-' + ymd() + '.json');
      celebrate('پشتیبان', 'فایل دانلود شد', 'success', 1800);
    });
    $('#imp-btn').addEventListener('click', function () { $('#imp-file').click(); });
    $('#imp-file').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var parsed = JSON.parse(rd.result);
          if (!parsed || !parsed.users || !parsed.warehouses) throw new Error('نامعتبر');
          openModal({
            title: 'بازیابی',
            desc: 'کل داده جایگزین می‌شود',
            body: '<div style="padding:12px 14px;background:rgba(255,59,48,.1);border-radius:14px;font-size:12px;color:#b91c1c">' + IC.alert + ' از حساب خارج می‌شوید</div>',
            actions: [
              { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
              {
                label: IC.check + ' بازیابی',
                cls: 'danger',
                onClick: function (c) {
                  try {
                    migrateDB(parsed);
                    saveDB(parsed);
                    try { localStorage.removeItem(K_SES); } catch (e) {}
                    c.remove();
                    celebrate('بازیابی', 'دوباره وارد شوید', 'success', 2200);
                    setTimeout(function () { App.user = null; render(); }, 700);
                  } catch (err) { c.remove(); toast('خطا', err.message || '', 'error'); }
                }
              }
            ]
          });
        } catch (err) { toast('نامعتبر', err.message || '', 'error'); }
      };
      rd.readAsText(f);
    });
    attachRippleAll();
  }

  function openZeroOutModal() {
    var db = loadDB();
    var nonZero = db.stocks.filter(function (s) { return s.quantity > 0 || (s.reservedQty || 0) > 0; });
    var totalQ = nonZero.reduce(function (a, s) { return a + s.quantity; }, 0);
    openModal({
      title: 'صفر کردن موجودی',
      desc: 'با ثبت snapshot تاریخی',
      body: '<div class="field"><label>یادداشت</label><input id="zo-note" placeholder="مثلاً: بستن سال" /></div>' +
        '<div style="margin-top:14px;padding:14px;background:var(--surface-2);border-radius:16px;font-size:12.5px;line-height:1.9">' +
          '<div style="display:flex;justify-content:space-between"><span>ردیف‌ها:</span><b>' + nonZero.length + '</b></div>' +
          '<div style="display:flex;justify-content:space-between"><span>جمع:</span><b>' + totalQ + ' عدد</b></div>' +
          '<div style="display:flex;justify-content:space-between"><span>اسناد حفظ‌شده:</span><b>' + db.transfers.length + '</b></div>' +
        '</div>',
      actions: [
        { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
        {
          label: IC.refresh + ' تأیید',
          cls: 'danger',
          onClick: function (c) {
            var btn = c.querySelector('button.danger');
            if (btn) btn.classList.add('loading');
            var note = (c.querySelector('#zo-note') || {}).value || '';
            setTimeout(function () {
              try {
                var fresh = loadDB();
                var snap = fresh.stocks.filter(function (s) { return s.quantity > 0 || (s.reservedQty || 0) > 0; })
                  .map(function (s) { return { productId: s.productId, warehouseId: s.warehouseId, quantity: s.quantity, reservedQty: s.reservedQty || 0 }; });
                if (!snap.length) { c.remove(); toast('صفر است', '', 'info'); return; }
                fresh.adjustments = fresh.adjustments || [];
                var adjId = uid();
                fresh.adjustments.push({
                  id: adjId, at: new Date().toISOString(), by: App.user.id, byName: App.user.name,
                  type: 'period_close', note: note, itemsCount: snap.length, snapshot: snap
                });
                fresh.stocks.forEach(function (s) { s.quantity = 0; s.reservedQty = 0; s.updatedAt = new Date().toISOString(); });
                saveDB(fresh);
                c.remove();

                // Undo restores both snapshot data and removes the adjustment entry
                showUndoToast('موجودی صفر شد (' + snap.length + ' ردیف)', function () {
                  try {
                    var f2 = loadDB();
                    f2.adjustments = (f2.adjustments || []).filter(function (a) { return a.id !== adjId; });
                    snap.forEach(function (old) {
                      var s = findStock(f2, old.productId, old.warehouseId);
                      if (s) {
                        s.quantity = old.quantity;
                        s.reservedQty = old.reservedQty;
                        s.updatedAt = new Date().toISOString();
                      }
                    });
                    saveDB(f2);
                    toast('بازگردانی شد', '', 'success');
                    render();
                  } catch (e) {}
                }, 6000);
                requestAnimationFrame(function () { requestAnimationFrame(function () { render(); }); });
              } catch (err) {
                try { c.remove(); } catch (e) {}
                toast('خطا', err.message || '', 'error');
              }
            }, 400);
          }
        }
      ]
    });
  }

  /* ============================================================
     GLOBAL KEYBOARD SHORTCUTS
     ============================================================ */
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openCmd();
    }
    if (e.key === 'Escape') {
      closeCmd();
      closeDrawer();
      closeNotif();
      closeSheet();
      hideKitPop();
      var pdfM = document.querySelector('.pdf-modal');
      if (pdfM) pdfM.remove();
      var m = document.querySelector('.modal-bd');
      if (m) m.remove();
      var um = document.querySelector('.userm');
      if (um) um.remove();
      $$('.celebrate').forEach(function (el) { el.remove(); });
    }
    if (!e.target.matches('input,textarea,select') && !e.metaKey && !e.ctrlKey && App.user) {
      if (e.key === '?') { e.preventDefault(); openShortcutsHelp(); return; }
      var map = { '1': 'dashboard', '2': 'stock', '3': 'transfers', '4': 'inbounds' };
      if (map[e.key] && NAV.filter(function (n) { return n.key === map[e.key] && n.roles.indexOf(App.user.role) >= 0; }).length) {
        go(map[e.key]);
      }
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  try {
    showSplash();
    try { PWA.init(); } catch (e) {}
    App.user = currentUser();
    if (App.user) App.route = restoreRoute();
    else App.route = { name: 'dashboard', params: {} };
    render();
  } catch (err) {
    var ee = document.getElementById('err');
    if (ee) {
      ee.style.display = 'block';
      ee.textContent = 'BOOT ERROR: ' + (err.message || err) + '\n' + (err.stack || '');
    }
  }
})();
</script>
</body>
</html>
