<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alus · پنل مدیریت</title>
<meta name="application-name" content="Alus">
<meta name="theme-color" content="#007AFF">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alus">
<meta name="description" content="Alus — مدیریت هوشمند موجودی و جابه‌جایی مبلمان">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" crossorigin="anonymous">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--purple:#AF52DE;--teal:#5AC8FA;
  --grad:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  --grad-2:linear-gradient(135deg,#007AFF,#5856D6);
  --grad-success:linear-gradient(135deg,#34C759,#00A14B);
  --grad-warn:linear-gradient(135deg,#FF9500,#E67E00);
  --grad-danger:linear-gradient(135deg,#FF3B30,#D70015);
  --grad-info:linear-gradient(135deg,#5AC8FA,#0EA5E9);
  --grad-soft:linear-gradient(135deg,rgba(0,122,255,.15),rgba(175,82,222,.10));
  --g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.78);--g3:rgba(255,255,255,.92);
  --gb:rgba(255,255,255,.7);
  --ghl:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);
  --gs:0 8px 32px -8px rgba(15,23,42,.12),0 2px 8px -2px rgba(15,23,42,.06);
  --bg:#eef2f9;--surface:#fff;--surface-2:#f6f8fc;--surface-3:#eef1f8;
  --border:rgba(15,23,42,.08);--border-2:rgba(15,23,42,.14);
  --text:#0a1220;--text-2:#334155;--muted:#64748b;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --g1:rgba(30,35,50,.55);--g2:rgba(30,35,50,.75);--g3:rgba(30,35,50,.9);
  --gb:rgba(255,255,255,.09);
  --ghl:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.3);
  --bg:#06070d;--surface:#0f1420;--surface-2:#161d2c;--surface-3:#1e2739;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);
  --text:#eef2f8;--text-2:#cbd5e1;--muted:#94a3b8;
}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.25);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.alus-wm{display:inline-block;font-weight:900;letter-spacing:-.7px;line-height:1;color:var(--blue);font-feature-settings:"ss01"}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .alus-wm{background:linear-gradient(120deg,#007AFF 0%,#5856D6 55%,#AF52DE 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  [data-theme="dark"] .alus-wm{background:linear-gradient(120deg,#60a5fa 0%,#818cf8 55%,#c084fc 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
}
.alus-wm.lg{font-size:22px;letter-spacing:-1px}
.alus-wm.xl{font-size:30px;letter-spacing:-1.5px}
.alus-mark{display:inline-grid;place-items:center;background:var(--grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7)}
.alus-mark svg{stroke:currentColor}
.splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);animation:splashFade 2.2s ease-in forwards}
.splash::before{content:'';position:absolute;inset:0;background:radial-gradient(700px 500px at 50% 45%,rgba(255,255,255,.28),transparent 65%),radial-gradient(400px 400px at 90% 10%,rgba(255,255,255,.14),transparent 60%),radial-gradient(500px 500px at 10% 90%,rgba(255,255,255,.10),transparent 60%);pointer-events:none}
.splash-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;transform-origin:center center;animation:splashIn 2.2s cubic-bezier(.55,0,.35,1) forwards}
.splash-ring{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.35);pointer-events:none;animation:splashRing 2.2s ease-out forwards}
.splash-ring.r2{animation-delay:.15s}
.splash-logo{position:relative;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.28),rgba(255,255,255,.08) 60%);border:2px solid rgba(255,255,255,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 30px 60px -20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.splash-logo svg{width:64px;height:64px;stroke-width:2.4;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.splash-wm{font-size:46px;font-weight:900;letter-spacing:-2.2px;color:#fff;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.splash-tag{font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:-4px}
.splash-dots{display:flex;gap:6px;margin-top:14px}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);animation:splashDot 1.4s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.15s}
.splash-dots span:nth-child(3){animation-delay:.3s}
@keyframes splashIn{0%{transform:scale(.82);opacity:0;filter:blur(6px)}18%{transform:scale(1);opacity:1;filter:blur(0)}60%{transform:scale(1.02);opacity:1;filter:blur(0)}100%{transform:scale(9);opacity:0;filter:blur(2px)}}
@keyframes splashFade{0%,62%{opacity:1}100%{opacity:0}}
@keyframes splashRing{0%{transform:translateX(-50%) scale(.5);opacity:0}25%{transform:translateX(-50%) scale(1);opacity:.7}55%{transform:translateX(-50%) scale(1.3);opacity:.25}100%{transform:translateX(-50%) scale(2.5);opacity:0}}
@keyframes splashDot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes spinner{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes confetti{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}
@keyframes circleIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes celebrateOut{to{opacity:0;transform:scale(1.15)}}
@keyframes ripple{to{transform:scale(3);opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes notifIn{from{opacity:0;transform:translateX(-100%)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(-100%)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:100px;font-size:13.5px;font-weight:600;background:var(--g2);color:var(--text);border:1px solid var(--gb);box-shadow:var(--ghl),0 4px 14px -6px rgba(15,23,42,.14);transition:all .28s var(--ease);position:relative;overflow:hidden;white-space:nowrap;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:var(--ghl),0 12px 28px -10px rgba(15,23,42,.24);background:var(--g3)}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.sm svg{width:13px;height:13px}
.btn.xs{height:28px;padding:0 11px;font-size:11.5px}
.btn.xs svg{width:12px;height:12px}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -8px rgba(0,122,255,.65)}
.btn.success{background:var(--grad-success);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(52,199,89,.65)}
.btn.danger{background:var(--grad-danger);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,59,48,.65)}
.btn.warn{background:var(--grad-warn);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,149,0,.65)}
.btn.ghost{background:transparent;border:1px solid var(--border-2);box-shadow:none}
.btn.ghost:hover{background:var(--g1)}
.btn.block{width:100%}
.btn .rip{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 70%);transform:scale(0);pointer-events:none;animation:ripple .7s ease-out}
.btn:not(.primary):not(.success):not(.danger):not(.warn) .rip{background:radial-gradient(circle,rgba(0,122,255,.35),transparent 70%)}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:'';position:absolute;top:50%;left:50%;margin:-8px 0 0 -8px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spinner .7s linear infinite}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--g1);border:1px solid var(--gb);box-shadow:var(--ghl);transition:all .25s var(--ease);cursor:pointer;position:relative}
.icon-btn:hover{background:var(--g2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .pulse{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.icon-btn .pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--red);animation:ping 1.8s ease-out infinite}
.nav-wrap{position:sticky;top:0;z-index:50;padding:12px 20px 0}
.navbar{height:64px;max-width:1560px;margin:0 auto;background:var(--g2);backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--gb);border-radius:100px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;box-shadow:var(--ghl),var(--gs)}
.nav-brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding-left:6px}
.brand-logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7)}
.brand-logo svg{width:22px;height:22px}
.brand-text{font-weight:700;line-height:1.1}
.brand-text .wm{font-size:19px}
.brand-text small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);margin-top:2px}
.nav-pills{display:flex;align-items:center;gap:3px;background:var(--g1);border:1px solid var(--gb);border-radius:100px;padding:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.nav-pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:100px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex-shrink:0;cursor:pointer;transition:all .3s var(--ease)}
.nav-pill svg{width:15px;height:15px;opacity:.8}
.nav-pill.active{background:var(--grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px rgba(0,122,255,.65)}
.nav-pill.active svg{opacity:1}
.nav-pill .kbd{font-size:10px;padding:1px 6px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.nav-pill.active .kbd{background:rgba(255,255,255,.25);color:#fff}
.nav-pill .nbadge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:#fff;color:var(--red)}
.nav-pill.active .nbadge{background:rgba(255,255,255,.95)}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-btn{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;background:var(--g1);border:1px solid var(--gb);border-radius:100px;color:var(--muted);font-size:12.5px;min-width:220px;cursor:pointer}
.search-btn svg{width:14px;height:14px}
.search-btn kbd{margin-right:auto;font-size:10.5px;padding:2px 7px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.user-btn{display:flex;align-items:center;gap:9px;height:44px;padding:3px 12px 3px 4px;border-radius:100px;background:var(--g1);border:1px solid var(--gb);cursor:pointer;box-shadow:var(--ghl);transition:transform .25s var(--ease)}
.user-btn:hover{transform:translateY(-1px)}
.user-btn .who-text b{display:block;font-size:12.5px;font-weight:700;line-height:1.2}
.user-btn .who-text span{display:block;font-size:10.5px;color:var(--muted)}
.user-btn svg{width:13px;height:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--grad-2);flex-shrink:0;position:relative}
.avatar::after{content:'';position:absolute;bottom:0;left:0;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
@media (max-width:900px){
  .nav-wrap{padding:10px 12px 0}
  .navbar{justify-content:space-between;padding:0 8px 0 12px;height:58px;gap:0}
  .nav-pills{display:none!important}
  .nav-right{margin-right:0!important;margin-left:0!important;gap:6px}
  .search-btn{min-width:38px!important;width:38px!important;padding:0!important;justify-content:center!important}
  .search-btn span,.search-btn kbd{display:none!important}
  .icon-btn{width:38px;height:38px}
  .user-btn{padding:3px;height:40px}
  .user-btn .who-text,.user-btn > svg{display:none}
  .user-btn .avatar{width:34px;height:34px}
  .brand-text .wm{font-size:17px}
  .brand-text small{font-size:9.5px}
  .splash-logo{width:110px;height:110px}
  .splash-logo svg{width:54px;height:54px}
  .splash-wm{font-size:38px}
  .splash-ring{width:110px;height:110px}
}
@media (min-width:901px){.user-btn .who-text{display:block}}
.page{max-width:1560px;margin:0 auto;padding:26px 20px 60px}
@media (max-width:900px){.page{padding:18px 14px 130px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-5{grid-column:span 5}
.w-6{grid-column:span 6}.w-7{grid-column:span 7}.w-8{grid-column:span 8}
.w-12{grid-column:span 12}
@media (max-width:1100px){.w-3{grid-column:span 6}.w-4,.w-5,.w-6,.w-7,.w-8{grid-column:span 12}}
@media (max-width:640px){.bento>*{grid-column:span 12!important}}
.widget{background:var(--g2);border:1px solid var(--gb);border-radius:22px;padding:18px;box-shadow:var(--ghl),var(--gs)}
.w-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.w-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.w-title .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.w-title .ic svg{width:14px;height:14px}
.w-title.success .ic{background:var(--grad-success)}
.w-title.warn .ic{background:var(--grad-warn)}
.w-title.danger .ic{background:var(--grad-danger)}
.w-title.info .ic{background:var(--grad-info)}
.w-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.hero{background:var(--grad);border-radius:28px;padding:28px;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px -18px rgba(0,122,255,.6)}
.hero::before{content:'';position:absolute;top:-60%;right:-10%;width:70%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:24px;font-weight:800;margin-bottom:8px}
.hero p{opacity:.92;font-size:13.5px;line-height:1.9;max-width:480px}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero-stat .k{font-size:11.5px;opacity:.8;margin-bottom:3px}
.hero-stat .v{font-size:22px;font-weight:800}
.hero-stat .v small{font-size:11px;font-weight:500;opacity:.8;margin-right:3px}
.hero-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-quick button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:100px;background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.3);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:background .25s var(--ease)}
.hero-quick button:hover{background:rgba(255,255,255,.3)}
.hero-quick button svg{width:14px;height:14px}
.stat{display:flex;flex-direction:column;padding:18px;background:var(--g2);border:1px solid var(--gb);border-radius:22px}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.stat-ic svg{width:17px;height:17px}
.stat.success .stat-ic{background:var(--grad-success)}
.stat.warn .stat-ic{background:var(--grad-warn)}
.stat.info .stat-ic{background:var(--grad-info)}
.stat-value{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:15px;border-radius:18px;background:var(--g1);border:1px solid var(--gb);text-align:right;cursor:pointer;transition:all .3s var(--ease)}
.qa-btn:hover{transform:translateY(-3px)}
.qa-btn .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.qa-btn .ic svg{width:18px;height:18px}
.qa-btn.alt-1 .ic{background:var(--grad-success)}
.qa-btn.alt-2 .ic{background:var(--grad-warn)}
.qa-btn.alt-3 .ic{background:var(--grad-info)}
.qa-btn b{font-size:12.5px;font-weight:700}
.qa-btn span{font-size:11px;color:var(--muted)}
.pipe{display:flex;flex-direction:column;gap:8px}
.pipe-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--g1);border:1px solid var(--gb)}
.pipe-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.pipe-step.active .pipe-num{background:var(--grad);color:#fff;border-color:transparent}
.pipe-step.done .pipe-num{background:var(--grad-success);color:#fff;border-color:transparent}
.pipe-step .lbl{flex:1;font-size:12.5px;font-weight:600}
.pipe-step .lbl small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.pipe-count{font-size:13px;font-weight:800;padding:4px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--border)}
.feed{display:flex;flex-direction:column;gap:2px}
.feed-item{display:flex;gap:12px;padding:11px;border-radius:14px;cursor:pointer;transition:background .2s var(--ease)}
.feed-item:hover{background:var(--g1)}
.feed-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:var(--grad-2);flex-shrink:0}
.feed-av.success{background:var(--grad-success)}
.feed-av.warn{background:var(--grad-warn)}
.feed-av.danger{background:var(--grad-danger)}
.feed-av.info{background:var(--grad-info)}
.feed-body{flex:1;min-width:0}
.feed-title{font-size:13px;font-weight:600;line-height:1.55}
.feed-title b{color:var(--blue);font-weight:700}
.feed-title .tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:700;margin:0 3px;background:var(--surface-3);color:var(--text-2)}
.feed-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.feed-meta svg{width:11px;height:11px;vertical-align:middle}
.team{display:flex;flex-direction:column;gap:2px}
.team-row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px}
.team-info{flex:1;min-width:0}
.team-info b{display:block;font-size:12.5px;font-weight:700}
.team-info span{display:block;font-size:11px;color:var(--muted)}
.role-badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--g1);color:var(--text-2);border:1px solid var(--gb)}
.role-badge.manager{background:rgba(175,82,222,.14);color:#7c3aed;border-color:rgba(175,82,222,.24)}
.role-badge.admin{background:rgba(0,122,255,.14);color:var(--blue);border-color:rgba(0,122,255,.24)}
.role-badge.warehouse_officer{background:rgba(255,149,0,.14);color:#b45309;border-color:rgba(255,149,0,.24)}
.role-badge.accountant{background:rgba(90,200,250,.14);color:#0369a1;border-color:rgba(90,200,250,.24)}
[data-theme="dark"] .role-badge.manager{color:#c4b5fd}
[data-theme="dark"] .role-badge.admin{color:#7dd3fc}
[data-theme="dark"] .role-badge.warehouse_officer{color:#fbbf24}
[data-theme="dark"] .role-badge.accountant{color:#38bdf8}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge.pending_warehouse{background:rgba(255,149,0,.16);color:#b45309;border:1px solid rgba(255,149,0,.24)}
.badge.pending_accountant{background:rgba(90,200,250,.16);color:#0369a1;border:1px solid rgba(90,200,250,.24)}
.badge.pending_manager{background:rgba(175,82,222,.16);color:#6d28d9;border:1px solid rgba(175,82,222,.24)}
.badge.approved{background:rgba(52,199,89,.16);color:#047857;border:1px solid rgba(52,199,89,.24)}
.badge.rejected{background:rgba(255,59,48,.16);color:#b91c1c;border:1px solid rgba(255,59,48,.24)}
.badge.inbound{background:rgba(14,165,233,.16);color:#0369a1;border:1px solid rgba(14,165,233,.24)}
.badge.pending_warehouse .dot,.badge.pending_accountant .dot,.badge.pending_manager .dot{animation:pulse 1.6s ease-in-out infinite}
[data-theme="dark"] .badge.pending_warehouse{color:#fbbf24}
[data-theme="dark"] .badge.pending_accountant{color:#38bdf8}
[data-theme="dark"] .badge.pending_manager{color:#c4b5fd}
[data-theme="dark"] .badge.approved{color:#34d399}
[data-theme="dark"] .badge.rejected{color:#f87171}
.t-list{display:flex;flex-direction:column;gap:10px}
.t-item{background:var(--g1);border:1px solid var(--gb);border-radius:18px;padding:14px 16px;cursor:pointer;transition:all .3s var(--ease)}
.t-item:hover{border-color:var(--border-2);box-shadow:0 14px 32px -14px rgba(0,122,255,.4);transform:translateY(-2px);background:var(--g2)}
.t-row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.t-code{font-family:monospace;font-size:12px;color:var(--muted);font-weight:600}
.t-row2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.t-route{display:flex;align-items:center;gap:8px;color:var(--text-2);font-weight:500}
.t-route svg{width:13px;height:13px;color:var(--muted)}
.t-qty{font-weight:800;background:rgba(0,122,255,.12);color:var(--blue);padding:3px 10px;border-radius:100px;font-size:12px}
.t-progress{display:flex;align-items:center;gap:6px;margin-right:auto}
.t-steps{display:flex;gap:4px}
.t-step{width:22px;height:5px;border-radius:100px;background:var(--surface-3)}
.t-step.done{background:var(--grad-success)}
.t-step.active{background:var(--grad);animation:pulse 1.6s ease-in-out infinite}
.t-step.rejected{background:var(--grad-danger)}
.table-card{background:var(--g2);border:1px solid var(--gb);border-radius:22px;overflow:hidden}
.table-toolbar{padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.table-scroll{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:13px;min-width:800px}
.dt thead th{padding:14px 18px;text-align:right;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--border);background:var(--surface-2)}
.dt tbody td{padding:14px 18px;border-bottom:1px solid var(--border);color:var(--text-2);white-space:nowrap;vertical-align:middle}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr:hover{background:var(--g1)}
.cell-product{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cell-product b{color:var(--text);font-weight:700;font-size:13.5px}
.code-chip{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--surface-3);font-family:monospace;font-size:10.5px;color:var(--muted);font-weight:700}
.unit-chip{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--grad-soft);color:var(--blue);font-size:10.5px;font-weight:700}
.kit-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;background:rgba(175,82,222,.12);color:#7c3aed;font-size:10.5px;font-weight:700;cursor:help}
.kit-chip svg{width:10px;height:10px}
[data-theme="dark"] .kit-chip{color:#c4b5fd}
.wh-cell{display:flex;align-items:center;gap:8px}
.wh-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.num{text-align:left;direction:rtl;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.num.muted{color:var(--muted);font-weight:600}
.num .unit{font-size:10.5px;color:var(--muted);font-weight:500;margin-right:4px}
.qty-hl{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:4px 10px;border-radius:100px;background:rgba(0,122,255,.12);color:var(--blue);font-weight:800;font-size:12.5px}
.date-cell{color:var(--muted);font-size:12px;font-weight:500}
.actions-cell{text-align:left;width:1%;padding-left:12px}
.row-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--muted)}
.dt tr:nth-child(1) .row-num{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border-color:transparent}
.dt tr:nth-child(2) .row-num{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff;border-color:transparent}
.dt tr:nth-child(3) .row-num{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;border-color:transparent}
.avatar-sm{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11.5px;background:var(--grad-2);flex-shrink:0}
.user-cell{display:flex;align-items:center;gap:10px}
.user-cell .info b{color:var(--text);font-weight:700;font-size:13.5px;display:block;line-height:1.3}
.user-cell .info span{font-size:11px;color:var(--muted);display:block}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:700}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.status-pill.on{background:rgba(52,199,89,.14);color:#047857}
.status-pill.off{background:rgba(255,59,48,.14);color:#b91c1c}
[data-theme="dark"] .status-pill.on{color:#34d399}
[data-theme="dark"] .status-pill.off{color:#f87171}
.role-select{height:34px;padding:0 30px 0 12px;border-radius:100px;background:var(--g1);border:1px solid var(--gb);font-size:12px;font-weight:600;color:var(--text-2);appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:left 10px center;background-size:11px;cursor:pointer}
.role-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.14)}
.table-empty{padding:60px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.table-empty svg{width:56px;height:56px;opacity:.3}
.table-empty b{font-size:15px;font-weight:700;color:var(--text)}
@media (max-width:640px){.dt{min-width:600px}.dt thead th,.dt tbody td{padding:12px 14px}.col-sm-hide{display:none}}
.form-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.field label .req{color:var(--red);font-size:14px}
.field input,.field select,.field textarea{width:100%;height:44px;padding:0 16px;background:var(--g1);border:1px solid var(--gb);border-radius:100px;font-size:13.5px;color:var(--text);transition:all .28s var(--ease)}
.field textarea{height:auto;min-height:90px;padding:12px 18px;resize:vertical;font-family:inherit;line-height:1.7;border-radius:22px}
.field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:left 16px center;background-size:13px;padding-left:42px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.24);background:var(--g2)}
.field input:disabled,.field select:disabled{opacity:.6;cursor:not-allowed}
.field .hint{font-size:11.5px;color:var(--muted);padding:0 6px;line-height:1.7;margin-top:-2px}
.field .hint svg{width:11px;height:11px;vertical-align:-1px;margin-left:4px}
.kit-box{background:linear-gradient(135deg,rgba(0,122,255,.06),rgba(175,82,222,.05));border:1px solid rgba(0,122,255,.22);border-radius:20px;padding:16px;position:relative;overflow:hidden}
.kit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.kit-head-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--text)}
.kit-head-title .kit-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.kit-head-title .kit-ic svg{width:16px;height:16px}
.kit-head-title small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:1px}
.kit-unit-name{display:inline-block;padding:1px 8px;border-radius:8px;background:rgba(0,122,255,.14);color:var(--blue);font-weight:800;font-size:11px}
.kit-list{display:flex;flex-direction:column;gap:8px}
.kit-row{display:grid;grid-template-columns:1fr 90px 38px;gap:8px;align-items:center;animation:slideUp .3s var(--ease)}
.kit-row input{height:40px;padding:0 14px;border-radius:100px;background:var(--g3);border:1px solid var(--gb);font-size:13px;color:var(--text);transition:all .25s var(--ease)}
.kit-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.kit-row .kit-qty{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.kit-del{width:38px;height:38px;border-radius:50%;background:rgba(255,59,48,.12);color:var(--red);display:grid;place-items:center;cursor:pointer;border:1px solid rgba(255,59,48,.2);transition:all .22s var(--ease);flex-shrink:0}
.kit-del:hover{background:rgba(255,59,48,.2);transform:scale(1.06)}
.kit-del svg{width:14px;height:14px}
.kit-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--g1);border:1px dashed var(--border-2);border-radius:14px;line-height:1.9}
.kit-empty b{display:block;color:var(--text-2);font-weight:700;font-size:13px;margin-bottom:4px}
.kit-hint{font-size:11.5px;color:var(--muted);padding:0 4px;line-height:1.9;margin-top:8px}
.kit-total{margin-top:10px;padding:10px 14px;background:var(--g3);border:1px dashed var(--border-2);border-radius:14px;font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.kit-total b{color:var(--blue);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.kit-total svg{width:14px;height:14px;color:var(--blue)}
@media (max-width:520px){.kit-row{grid-template-columns:1fr 72px 34px;gap:6px}.kit-row input{height:38px;padding:0 12px;font-size:12.5px}.kit-del{width:34px;height:34px}}
.kit-pop{position:fixed;z-index:1100;background:var(--g3);backdrop-filter:blur(24px) saturate(1.9);border:1px solid var(--gb);border-radius:18px;box-shadow:0 24px 50px -14px rgba(0,0,0,.35);padding:14px;min-width:230px;max-width:300px;animation:popIn .25s var(--spring)}
.kit-pop .kit-pop-title{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.kit-pop .kit-pop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px}
.kit-pop .kit-pop-row b{color:var(--text);font-weight:600}
.kit-pop .kit-pop-qty{padding:1px 8px;border-radius:100px;background:rgba(0,122,255,.12);color:var(--blue);font-weight:800;font-size:11.5px}
.wiz-steps{display:flex;gap:0;margin-bottom:26px;position:relative}
.wiz-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.wiz-step .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--g1);color:var(--muted);font-weight:700;font-size:13px;border:1px solid var(--gb);transition:all .4s var(--ease)}
.wiz-step .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
.wiz-step.active .num{background:var(--grad);color:#fff;border-color:transparent;transform:scale(1.1)}
.wiz-step.active .lbl{color:var(--blue)}
.wiz-step.done .num{background:var(--grad-success);color:#fff;border-color:transparent}
.wiz-line{position:absolute;top:20px;right:0;left:0;height:3px;background:var(--surface-3);border-radius:100px;overflow:hidden}
.wiz-fill{position:absolute;top:0;right:0;height:100%;background:var(--grad);width:0;transition:width .6s var(--ease);border-radius:100px}
.drawer-bd{position:fixed;inset:0;z-index:200;background:rgba(10,15,25,.45);backdrop-filter:blur(8px);animation:fadeIn .25s var(--ease)}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:201;width:100%;max-width:540px;background:var(--g3);backdrop-filter:blur(34px) saturate(1.9);border-right:1px solid var(--gb);display:flex;flex-direction:column;animation:slideInLeft .45s var(--ease)}
@media (max-width:600px){.drawer{max-width:none}}
.drawer-head{padding:22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-head h3{font-size:15px;font-weight:800}
.drawer-body{padding:22px;overflow-y:auto;flex:1}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;background:var(--g1)}
.modal-bd{position:fixed;inset:0;z-index:300;background:rgba(10,15,25,.45);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;animation:fadeIn .22s var(--ease)}
.modal{width:100%;max-width:500px;max-height:88vh;overflow:auto;background:var(--g3);border:1px solid var(--gb);border-radius:28px;padding:26px;box-shadow:0 40px 90px -25px rgba(0,0,0,.5);animation:popIn .4s var(--spring)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:6px}
.modal .desc{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-start;flex-wrap:wrap}
.cmd-bd{position:fixed;inset:0;z-index:400;background:rgba(10,15,25,.5);backdrop-filter:blur(12px);display:grid;place-items:start center;padding:80px 16px 16px;animation:fadeIn .18s var(--ease)}
.cmd{width:100%;max-width:580px;background:var(--g3);border:1px solid var(--gb);border-radius:28px;overflow:hidden;box-shadow:0 40px 90px -25px rgba(0,0,0,.5);animation:popIn .35s var(--spring)}
.cmd input{width:100%;height:58px;padding:0 22px;font-size:15px;font-weight:500;border-bottom:1px solid var(--border)}
.cmd-list{max-height:380px;overflow-y:auto;padding:8px}
.cmd-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:100px;font-size:13.5px;cursor:pointer}
.cmd-item:hover,.cmd-item.sel{background:var(--g1)}
.cmd-item svg{width:16px;height:16px;color:var(--muted)}
.cmd-item b{font-weight:600;color:var(--text)}
.cmd-item .kbd{margin-right:auto;font-size:10.5px;color:var(--muted);padding:2px 8px;border-radius:100px;background:rgba(15,23,42,.08)}
.cmd-sec{font-size:10.5px;color:var(--muted);padding:10px 16px 4px;font-weight:700;text-transform:uppercase}
.cmd-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.notif-bd{position:fixed;inset:0;z-index:250;background:rgba(10,15,25,.4);backdrop-filter:blur(8px);animation:fadeIn .22s var(--ease)}
.notif-panel{position:fixed;top:0;bottom:0;left:0;z-index:251;width:100%;max-width:520px;background:var(--g3);backdrop-filter:blur(38px) saturate(1.9);border-right:1px solid var(--gb);display:flex;flex-direction:column;animation:notifIn .4s var(--ease)}

.notif-head{padding:20px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border)}
.notif-title{display:flex;align-items:center;gap:12px}
.notif-title-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--grad);position:relative}
.notif-title-icon svg{width:20px;height:20px}
.notif-title-icon .badge-dot{position:absolute;top:-2px;left:-2px;min-width:20px;height:20px;padding:0 6px;border-radius:100px;background:var(--grad-danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--g3)}
.notif-tabs{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.notif-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 12px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid transparent;cursor:pointer}
.notif-tab:hover{color:var(--text);background:var(--g1)}
.notif-tab.active{background:var(--g3);color:var(--text);border-color:var(--gb)}
.notif-tab.active[data-tab="pending"]{color:var(--orange)}
.notif-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:100px;font-size:10.5px;font-weight:800;background:var(--grad-danger);color:#fff}
.notif-tab[data-tab="activity"] .notif-count{background:var(--surface-3);color:var(--text-2)}
.notif-tab.active[data-tab="pending"] .notif-count{background:var(--grad-warn)}
.notif-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.notif-card{background:var(--g2);border:1px solid var(--gb);border-radius:18px;padding:14px 16px}
.notif-card.pending{border-right:3px solid var(--orange)}
.notif-card.pending.pending_accountant{border-right-color:var(--teal)}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function emptyDB() { return { users: [], warehouses: [], products: [], stocks: [], transfers: [], adjustments: [] }; }

function migrateDB(d) {
  var changed = false;
  if (!d.adjustments) { d.adjustments = []; changed = true; }
  if (!d.users) { d.users = []; changed = true; }
  if (!d.warehouses) { d.warehouses = []; changed = true; }
  if (!d.products) { d.products = []; changed = true; }
  if (!d.stocks) { d.stocks = []; changed = true; }
  if (!d.transfers) { d.transfers = []; changed = true; }
  for (var i = 0; i < d.products.length; i++) {
    if (!d.products[i].components) { d.products[i].components = []; changed = true; }
  }
  for (var j = 0; j < d.warehouses.length; j++) {
    var w = d.warehouses[j];
    if (w.type === 'paint') { w.type = 'paint_in'; if (!w.name || w.name === 'رنگ‌کاری') w.name = 'رنگ‌کاری داخلی'; changed = true; }
  }
  function ensure(type, name, order) {
    var found = false;
    for (var k = 0; k < d.warehouses.length; k++) if (d.warehouses[k].type === type) { found = true; break; }
    if (!found) { d.warehouses.push({ id: uid(), name: name, type: type, isActive: true, order: order || 0 }); changed = true; }
  }
  ensure('central', 'انبار مرکزی', 1);
  ensure('paint_in', 'رنگ‌کاری داخلی', 2);
  ensure('paint_out', 'رنگ‌کاری بیرون', 3);
  ensure('upholstery', 'رویه‌کوبی', 4);
  ensure('store', 'فروشگاه', 5);
  ensure('showroom_khalij', 'نمایشگاه خلیج فارس', 6);
  ensure('showroom_alus', 'نمایشگاه الوس', 7);
  ensure('sold', 'کالای فروش‌رفته', 8);
  ensure('customer', 'مشتری', 9);
  return changed;
}

function loadDB() {
  var raw = null;
  try { raw = localStorage.getItem(K_DB); } catch(e) {}
  if (!raw) return emptyDB();
  try {
    var d = JSON.parse(raw);
    var changed = migrateDB(d);
    if (changed) { try { localStorage.setItem(K_DB, JSON.stringify(d)); } catch(e) {} }
    return d;
  } catch(e) { return emptyDB(); }
}
function saveDB(db) { try { localStorage.setItem(K_DB, JSON.stringify(db)); } catch(e) {} }

function tcode(db) {
  var y = ymd(); var n = 1;
  for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].code && db.transfers[i].code.indexOf('TR-' + y) === 0) n++;

function doApprove(id) {
  openModal({
    title: 'تأیید مرحله', desc: 'آیا از تأیید این مرحله مطمئن هستید؟',
    body: '<div class="field"><label>یادداشت (اختیاری)</label><textarea id="ap-note"></textarea></div>',
    actions: [
      { label: 'انصراف', cls: 'ghost', onClick: function(c) { c.remove(); } },
      { label: IC.check + ' تأیید', cls: 'success', onClick: function(c) {
        var btn = c.querySelector('button.success'); if (btn) btn.classList.add('loading');
        var noteBox = c.querySelector('#ap-note'); var note = noteBox ? noteBox.value.trim() : '';
        setTimeout(function() {
          try {
            var db = loadDB();
            var t = null;
            for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
            if (!t) { c.remove(); return; }
            if (!canApprove(App.user, t)) { c.remove(); celebrate('دسترسی ندارید', '', 'error', 1800); return; }
            var step = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), note: note };
            var finalized = false;
            if (t.type === 'inbound') {
              if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
              else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
              else if (t.status === 'pending_manager') {
                t.managerApproval = step;
                var ds = findStock(db, t.productId, t.destinationWarehouseId);
                if (!ds) { ds = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, updatedAt: new Date().toISOString() }; db.stocks.push(ds); }
                ds.quantity = (ds.quantity || 0) + t.quantity;
                ds.updatedAt = new Date().toISOString();
                t.status = 'approved'; t.completedAt = new Date().toISOString(); finalized = true;
              }
            } else {
              if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
              else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
              else if (t.status === 'pending_manager') {
                t.managerApproval = step;
                var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
                if (!srcStock || srcStock.quantity < t.quantity) { c.remove(); celebrate('موجودی کافی نیست', '', 'error', 2000); return; }
                srcStock.quantity -= t.quantity;
                srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity);
                srcStock.updatedAt = new Date().toISOString();
                var dstW = getWh(db, t.destinationWarehouseId);
                if (dstW && dstW.type !== 'customer') {
                  var ds2 = findStock(db, t.productId, t.destinationWarehouseId);
                  if (!ds2) { ds2 = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, updatedAt: new Date().toISOString() }; db.stocks.push(ds2); }
                  ds2.quantity = (ds2.quantity || 0) + t.quantity;
                  ds2.updatedAt = new Date().toISOString();
                }
                t.status = 'approved'; t.completedAt = new Date().toISOString(); finalized = true;
              }
            }
            saveDB(db);
            try { c.remove(); } catch(e) {}
            closeNotif();
            if (finalized) celebrate(t.type === 'inbound' ? 'ورود کالا ثبت شد' : 'انتقال قطعی شد', '', 'success', 2000);
            else celebrate('تأیید شد', 'به مرحله بعد منتقل شد', 'success', 1600);
            requestAnimationFrame(function() { requestAnimationFrame(function() { render(); }); });
          } catch(err) {
            try { c.remove(); } catch(e) {}
            celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2200);
          }
        }, 400);
      } }
    ]
  });
}

function doReject(id) {
  openModal({
    title: 'رد درخواست', desc: 'دلیل رد را وارد کنید.',
    body: '<div class="field"><label>دلیل <span class="req">*</span></label><textarea id="rj-reason"></textarea></div>',
    actions: [
      { label: 'انصراف', cls: 'ghost', onClick: function(c) { c.remove(); } },
      { label: IC.x + ' ثبت رد', cls: 'danger', onClick: function(c) {
        var reasonBox = c.querySelector('#rj-reason'); var reason = reasonBox ? reasonBox.value.trim() : '';
        if (!reason) { celebrate('دلیل الزامی است', '', 'warn', 1600); return; }
        var btn = c.querySelector('button.danger'); if (btn) btn.classList.add('loading');
        setTimeout(function() {
          try {
            var db = loadDB();
            var t = null;
            for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
            if (!t) { c.remove(); return; }
            if (!canApprove(App.user, t)) { c.remove(); celebrate('دسترسی ندارید', '', 'error', 1800); return; }
            var stageMap = { pending_warehouse: 'warehouse', pending_accountant: 'accountant', pending_manager: 'manager' };
            var stage = stageMap[t.status];
            if (t.type !== 'inbound') {
              var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
              if (srcStock) { srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity); srcStock.updatedAt = new Date().toISOString(); }
            }
            t.rejection = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), reason: reason, stage: stage };
            t.status = 'rejected';
            saveDB(db);
            c.remove(); closeNotif();
            celebrate('درخواست رد شد', '', 'error', 1900);
            requestAnimationFrame(function() { requestAnimationFrame(function() { render(); }); });
          } catch(err) {
            try { c.remove(); } catch(e) {}
            celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2200);
          }
        }, 400);
      } }
    ]
  });
}

function openCmd() {
  if ($('#cmd-bd')) return;
  var bd = document.createElement('div'); bd.className = 'cmd-bd'; bd.id = 'cmd-bd';
  var items = NAV.filter(function(i) { return i.roles.indexOf(App.user.role) >= 0; });
  bd.innerHTML = '<div class="cmd"><input id="cmd-input" placeholder="جستجو یا اجرای دستور..." autocomplete="off" /><div class="cmd-list" id="cmd-list"></div></div>';
  document.body.appendChild(bd);
  var input = $('#cmd-input'); var list = $('#cmd-list'); var sel = 0;
  function build(q) {
    q = q || ''; var query = q.toLowerCase().trim();
    var navItems = items.map(function(i) { return { label: i.label, icon: i.icon, kbd: '↵', run: function() { go(i.key); }, sec: 'صفحه‌ها' }; });
    var acts = [
      { label: 'مرکز اعلان‌ها', icon: IC.bell, run: function() { openNotif(); }, sec: 'اقدامات' },
      { label: App.theme === 'light' ? 'حالت تاریک' : 'حالت روشن', icon: App.theme === 'light' ? IC.moon : IC.sun, run: toggleTheme, sec: 'تنظیمات' },
      { label: 'خروج از حساب', icon: IC.logout, run: doLogout, sec: 'تنظیمات' }
    ];
    var all = navItems.concat(acts);
    var f = query ? all.filter(function(c) { return c.label.toLowerCase().indexOf(query) >= 0; }) : all;
    if (!f.length) { list.innerHTML = '<div class="cmd-empty">موردی یافت نشد</div>'; list._f = []; return; }
    var html = ''; var lastSec = null;
    f.forEach(function(c, i) {
      if (c.sec && c.sec !== lastSec) { html += '<div class="cmd-sec">' + c.sec + '</div>'; lastSec = c.sec; }
      html += '<div class="cmd-item ' + (i === sel ? 'sel' : '') + '" data-i="' + i + '">' + c.icon + '<b>' + c.label + '</b>' + (c.kbd ? '<span class="kbd">' + c.kbd + '</span>' : '') + '</div>';
    });
    list.innerHTML = html; list._f = f;
    $$('.cmd-item', list).forEach(function(el) {
      el.addEventListener('click', function() { closeCmd(); f[+el.dataset.i].run(); });
      el.addEventListener('mouseenter', function() { sel = +el.dataset.i; $$('.cmd-item', list).forEach(function(x) { x.classList.toggle('sel', +x.dataset.i === sel); }); });
    });
  }
  build(''); input.focus();
  input.addEventListener('input', function() { sel = 0; build(input.value); });
  input.addEventListener('keydown', function(e) {
    var f = list._f || [];
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, f.length - 1); $$('.cmd-item', list).forEach(function(x) { x.classList.toggle('sel', +x.dataset.i === sel); }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); $$('.cmd-item', list).forEach(function(x) { x.classList.toggle('sel', +x.dataset.i === sel); }); }
    if (e.key === 'Enter') { e.preventDefault(); var c = f[sel]; if (c) { closeCmd(); c.run(); } }
    if (e.key === 'Escape') closeCmd();
  });
  bd.addEventListener('click', function(e) { if (e.target === bd) closeCmd(); });
}

function countUp(el, target, dur) {
  dur = dur || 800; var t0 = performance.now();
  function tick(now) {
    var p = Math.min((now - t0) / dur, 1);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString('fa-IR');
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

    $('#kit-total').style.display = ''; $('#kit-total').innerHTML = IC.grid + ' جمع اقلام در هر ' + esc(u) + ': <b>' + total.toLocaleString('fa-IR') + '</b> عدد';
    $$('.kit-name', list).forEach(function(inp) { inp.addEventListener('input', function() { comps[+inp.dataset.i].name = inp.value; }); });
    $$('.kit-qty', list).forEach(function(inp) { inp.addEventListener('input', function() { comps[+inp.dataset.i].qty = Math.max(1, parseInt(inp.value, 10) || 1); var total = comps.reduce(function(a, c) { return a + (parseInt(c.qty, 10) || 0); }, 0); $('#kit-total').innerHTML = IC.grid + ' جمع اقلام در هر ' + esc(unitSel.value) + ': <b>' + total.toLocaleString('fa-IR') + '</b> عدد'; }); });
    $$('.kit-del', list).forEach(function(b) { b.addEventListener('click', function() { var i = +b.dataset.i; var row = b.closest('.kit-row'); if (row) row.style.animation = 'fadeOut .18s forwards'; setTimeout(function() { comps.splice(i, 1); renderKit(); }, 180); }); });
  }

  function updateProductStatus() {
    var val = pInput.value.trim();
    if (!val) { statusBox.innerHTML = ''; currentProductId = null; return; }
    var fresh = loadDB();
    var match = findProductByName(fresh, val);
    if (match) {
      currentProductId = match.id;
      var stockList = fresh.stocks.filter(function(s) { return s.productId === match.id && s.quantity > 0; });
      var totalQ = stockList.reduce(function(a, s) { return a + s.quantity; }, 0);
      var whCount = stockList.length; var compCount = (match.components || []).length;
      statusBox.innerHTML = '<div style="margin-top:8px;padding:12px 14px;background:rgba(52,199,89,.10);border:1px solid rgba(52,199,89,.22);border-radius:16px;font-size:12.5px;color:#047857;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' + IC.check + ' کالای موجود: <b>' + esc(match.name) + '</b> <span class="unit-chip">' + esc(match.unit || '—') + '</span>' + (compCount ? ' <span class="kit-chip" style="cursor:default">' + IC.grid + ' ' + compCount + ' قلم</span>' : '') + (totalQ > 0 ? ' <span style="opacity:.8">(موجودی فعلی: ' + totalQ + ' در ' + whCount + ' انبار)</span>' : '') + '<span style="margin-right:auto;opacity:.75">' + IC.info + ' واحد و اقلام قابل ویرایش است</span></div>';
      if (match.unit && match.unit !== unitSel.value) { var found = false; for (var k = 0; k < UNITS.length; k++) if (UNITS[k] === match.unit) { found = true; break; } unitSel.value = found ? match.unit : 'عدد'; }
      comps = (match.components || []).map(function(c) { return { id: c.id || uid(), name: c.name || '', qty: c.qty || 1 }; });
      renderKit();
    } else {
      currentProductId = null;
      statusBox.innerHTML = '<div style="margin-top:8px;padding:12px 14px;background:rgba(0,122,255,.10);border:1px solid rgba(0,122,255,.22);border-radius:16px;font-size:12.5px;color:var(--blue);display:flex;align-items:center;gap:8px">' + IC.plus + ' کالای جدید ساخته می‌شود: <b>' + esc(val) + '</b></div>';
    }
  }

  function updReservedHint() {
    var box = $('#iq-hint'); var name = pInput.value.trim(); var wid = wSel.value;
    if (!name || !wid) { box.innerHTML = ''; return; }
    var tmp = loadDB(); var m = findProductByName(tmp, name);
    if (!m) { box.innerHTML = ''; return; }
    var s = findStock(tmp, m.id, wid); var rq = s ? (s.reservedQty || 0) : 0;
    if (rq > 0) box.innerHTML = '<div style="padding:12px 16px;background:rgba(255,149,0,.1);border-radius:16px;font-size:12.5px;color:#b45309">' + IC.alert + ' این کالا ' + rq + ' ' + esc(m.unit || '') + ' رزرو دارد. مقدار جدید نباید کمتر از ' + rq + ' باشد.</div>';
    else box.innerHTML = '';
  }

  pInput.addEventListener('input', function() { updateProductStatus(); updReservedHint(); });
  pInput.addEventListener('change', function() { updateProductStatus(); updReservedHint(); });
  wSel.addEventListener('change', updReservedHint);
  unitSel.addEventListener('change', renderKit);

  $('#kit-add').addEventListener('click', function() {
    comps.push({ id: uid(), name: '', qty: 1 }); renderKit();
    var list = $('#kit-list'); var rows = $$('.kit-row', list);
    if (rows.length) { var last = rows[rows.length - 1]; var nameInput = last.querySelector('.kit-name'); if (nameInput) nameInput.focus(); }
  });

  $('#if').addEventListener('submit', function(e) {
    e.preventDefault();
    var name = pInput.value.trim(); var unit = unitSel.value; var wid = wSel.value; var qty = parseInt(qtyInput.value, 10);
    if (!name || !wid || isNaN(qty) || qty < 0) { celebrate('اطلاعات ناقص', 'نام کالا، انبار و تعداد را وارد کنید', 'error', 1800); return; }
    if (name.length < 2) { celebrate('نام کوتاه است', '', 'warn', 1600); return; }
    if (isKitUnit(unit)) {
      var cleanComps = comps.map(function(c) { return { id: c.id || uid(), name: (c.name || '').trim(), qty: Math.max(1, parseInt(c.qty, 10) || 1) }; }).filter(function(c) { return c.name.length > 0; });
      if (!cleanComps.length) { celebrate('اقلام خالی است', 'برای واحد ' + unit + '، حداقل یک قلم وارد کنید', 'warn', 2000); return; }
      comps = cleanComps;
    }
    var btn = $('#if-submit'); if (btn) btn.classList.add('loading');
    setTimeout(function() {
      try {
        var fresh = loadDB();
        var product = findProductByName(fresh, name);
        var created = false;
        if (!product) { product = { id: uid(), name: name, code: '', unit: unit, components: isKitUnit(unit) ? comps.slice() : [], createdAt: new Date().toISOString() }; fresh.products.push(product); created = true; }
        else { product.unit = unit; product.components = isKitUnit(unit) ? comps.slice() : []; }
        var s = findStock(fresh, product.id, wid); var rq = s ? (s.reservedQty || 0) : 0;
        if (qty < rq) { if (btn) btn.classList.remove('loading'); celebrate('کمتر از رزرو', 'حداقل مقدار باید ' + rq + ' باشد', 'error', 2000); return; }
        if (s) { s.quantity = qty; s.updatedAt = new Date().toISOString(); }
        else { fresh.stocks.push({ id: uid(), productId: product.id, warehouseId: wid, quantity: qty, reservedQty: 0, updatedAt: new Date().toISOString() }); }
        saveDB(fresh);
        var suffix = isKitUnit(unit) && product.components.length ? ' — ' + qty + ' ' + unit + ' (' + product.components.length + ' قلم)' : ' — ' + qty + ' ' + unit;
        if (created) celebrate('کالا و موجودی ثبت شد', '«' + product.name + '»' + suffix, 'success', 2200);
        else celebrate('موجودی به‌روزرسانی شد', product.name + suffix, 'success', 2000);
        go('stock');
      } catch(err) { if (btn) btn.classList.remove('loading'); celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2200); }
    }, 350);
  });

  renderKit();
  setTimeout(function() { pInput.focus(); }, 100);
  attachRippleAll();
}

function openTransfer(id) {
  var db = loadDB();
  var t = null;
  for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
  if (!t) { celebrate('یافت نشد', '', 'error', 1600); return; }
  var st = stOf(t); var isIn = t.type === 'inbound';
  var p = getProd(db, t.productId);
  var src = getWh(db, t.sourceWarehouseId);
  var dst = getWh(db, t.destinationWarehouseId);

  var steps = [
    { title: 'ثبت درخواست', done: true, at: t.createdAt, user: t.createdByName, icon: IC.plus },
    { title: 'تأیید انباردار', step: t.warehouseApproval, icon: IC.package },
    { title: 'تأیید حسابدار', step: t.accountantApproval, icon: IC.shield },
    { title: 'تأیید مدیر', step: t.managerApproval, icon: IC.users },
    { title: isIn ? 'ورود قطعی' : 'انتقال قطعی', done: !!t.completedAt, at: t.completedAt, icon: IC.check }
  ];
  var rMap = { warehouse: 1, accountant: 2, manager: 3 };
  var rStep = t.rejection ? rMap[t.rejection.stage] : -1;
  var tlHTML = steps.map(function(s, i) {
    var cls = '';
    if (i === 0 || i === 4) cls = s.done ? 'done' : '';
    else { if (s.step) cls = 'done'; else if (i === rStep) cls = 'rejected'; else if (i === (st.step - 1)) cls = 'active'; }
    var meta = [];
    if (s.at) meta.push('<b>' + esc(s.user || '') + '</b> · ' + faDate(s.at));
    if (s.step) meta.push('<b>' + esc(s.step.userName) + '</b> · ' + faDate(s.step.at));
    if (i === rStep && t.rejection) meta.push('<span style="color:#FF3B30">رد توسط <b>' + esc(t.rejection.userName) + '</b><br>دلیل: ' + esc(t.rejection.reason) + '</span>');
    var icon = cls === 'done' ? IC.check : cls === 'rejected' ? IC.x : cls === 'active' ? IC.clock : s.icon;
    return '<li class="' + cls + '"><div class="tl-node">' + icon + '</div><div class="tl-title">' + s.title + '</div>' + (meta.length ? '<div class="tl-meta">' + meta.join('<br>') + '</div>' : '') + '</li>';
  }).join('');

  var kitBlock = '';
  if (p && p.components && p.components.length && isKitUnit(p.unit)) {
    kitBlock = '<div style="margin-top:16px"><div style="font-weight:700;margin-bottom:10px">اقلام یک ' + esc(p.unit) + ' کامل</div><div class="kit-list">' + p.components.map(function(c) { return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--g1);border:1px solid var(--gb);border-radius:14px;font-size:13px"><b>' + esc(c.name) + '</b><span class="notif-qty">×' + c.qty + '</span></div>'; }).join('') + '</div></div>';
  }

  var body = '<div class="dl" style="grid-template-columns:repeat(2,1fr);display:grid;gap:1px;margin-bottom:16px">' +
    '<div class="dl-item"><div class="k">وضعیت</div><div class="v"><span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span></div></div>' +
    '<div class="dl-item"><div class="k">نوع</div><div class="v">' + (isIn ? 'ورود از تأمین‌کننده' : (t.type === 'direct-customer' ? 'ارسال به مشتری' : 'انتقال بین انبارها')) + '</div></div>' +
    (isIn ? '<div class="dl-item"><div class="k">تأمین‌کننده</div><div class="v">' + esc(t.supplierName || '—') + '</div></div>' : '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((src && src.name) || '—') + '</div></div>') +
    '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dst && dst.name) || '—') + '</div></div>' +
    '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p && p.name) || '—') + '</div></div>' +
    '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + t.quantity + ' ' + esc((p && p.unit) || '') + '</div></div>' +
    (isIn && t.invoiceNumber ? '<div class="dl-item" style="grid-column:1/-1"><div class="k">شماره فاکتور</div><div class="v" style="font-family:monospace">' + esc(t.invoiceNumber) + '</div></div>' : '') +
    (t.customerName ? '<div class="dl-item"><div class="k">مشتری</div><div class="v">' + esc(t.customerName) + '</div></div><div class="dl-item"><div class="k">تماس</div><div class="v">' + esc(t.customerPhone || '—') + '</div></div>' : '') +
    (t.description ? '<div class="dl-item" style="grid-column:1/-1"><div class="k">توضیحات</div><div class="v" style="font-weight:400">' + esc(t.description) + '</div></div>' : '') +
  '</div>' + kitBlock + '<div style="font-weight:700;margin:16px 0 14px">مراحل تأیید</div><ul class="tl">' + tlHTML + '</ul>';

  var foot = '';
  if (canApprove(App.user, t)) foot = '<button class="btn success" id="d-approve" style="flex:1">' + IC.check + ' تأیید</button><button class="btn danger" id="d-reject">' + IC.x + ' رد</button>';
  else foot = '<div class="muted small" style="text-align:center;width:100%">اقدامی برای شما در دسترس نیست</div>';

  openDrawer({ title: '<span style="font-family:monospace;font-size:13px;color:var(--muted)">' + esc(t.code) + '</span>', body: body, foot: foot });
  var ap = $('#d-approve'); if (ap) ap.addEventListener('click', function() { closeDrawer(); doApprove(t.id); });
  var rj = $('#d-reject'); if (rj) rj.addEventListener('click', function() { closeDrawer(); doReject(t.id); });
}

  function updateSteps() {
    $$('.wiz-step').forEach(function(el) { var s = +el.dataset.step; el.classList.toggle('active', s === state.step); el.classList.toggle('done', s < state.step); });

    next.innerHTML = state.step === 3 ? (IC.check + ' ثبت نهایی') : ('بعدی ' + IC.arrowL);

        '<div class="field"><label>انبار مقصد <span class="req">*</span></label><select id="w-dst" ' + (!state.src ? 'disabled' : '') + '><option value="">' + (state.src ? 'انتخاب...' : 'ابتدا مبدأ') + '</option>' + dests.map(function(w) { return '<option value="' + w.id + '" ' + (state.dst === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
      '</div>' +

      $('#w-src').addEventListener('change', function(e) { state.src = e.target.value; state.dst = ''; draw(); });
      $('#w-dst').addEventListener('change', function(e) { state.dst = e.target.value; draw(); });
    } else if (state.step === 2) {
      var stock = findStock(db, state.pid, state.src);

      var customerBlock = '';

          '<div class="field"><label>نام مشتری</label><input id="w-cname" value="' + esc(state.customerName) + '" placeholder="اختیاری" /></div>' +
          '<div class="field"><label>شماره تماس</label><input id="w-cphone" value="' + esc(state.customerPhone) + '" placeholder="اختیاری" /></div>' +
        '</div>';
      }
      body.innerHTML = '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">' +
        '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((srcW2 && srcW2.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dstW && dstW.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p2 && p2.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + state.qty + ' ' + esc((p2 && p2.unit) || '') + '</div></div>' +
      '</div>' + kitMini +
      (dstW && dstW.type === 'sold' ? '<div style="margin-top:14px;padding:12px 14px;background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.2);border-radius:14px;font-size:12px;color:#b91c1c">' + IC.alert + ' این انتقال به «کالای فروش‌رفته» است. کالا فروخته شده اما هنوز تحویل مشتری نشده است. برای تحویل نهایی، از آن انبار به «مشتری» انتقال دهید.</div>' : '') +
      customerBlock +
      '<div style="margin-top:16px" class="muted small">' + IC.info + ' پس از ثبت، درخواست در انتظار تأیید انباردار قرار می‌گیرد.</div>';
      if (dstW && dstW.type === 'sold') {
        var c1 = $('#w-cname'); if (c1) c1.addEventListener('input', function(e) { state.customerName = e.target.value; });
        var c2 = $('#w-cphone'); if (c2) c2.addEventListener('input', function(e) { state.customerPhone = e.target.value; });

    }

    if (state.step === 1) {
      if (!state.src || !state.dst) { celebrate('اطلاعات ناقص', 'مبدأ و مقصد را انتخاب کنید', 'warn', 1600); return; }
      state.step = 2; draw();
    } else if (state.step === 2) {
      if (!state.pid || !state.qty || state.qty <= 0) { celebrate('اطلاعات ناقص', 'کالا و تعداد را وارد کنید', 'warn', 1600); return; }
      var stock = findStock(db, state.pid, state.src);
      var avail = stock ? stock.quantity - (stock.reservedQty || 0) : 0;
      if (state.qty > avail) { celebrate('موجودی کافی نیست', 'قابل استفاده: ' + avail, 'error', 1900); return; }
      state.step = 3; draw();
    } else {
      var btn = $('#wiz-next'); btn.classList.add('loading');
      setTimeout(function() {
        try {
          var fresh = loadDB();
          var srcStock = findStock(fresh, state.pid, state.src);
          if (!srcStock) { btn.classList.remove('loading'); celebrate('کالا یافت نشد', '', 'error', 1600); return; }
          var avail2 = srcStock.quantity - (srcStock.reservedQty || 0);
          if (state.qty > avail2) { btn.classList.remove('loading'); celebrate('موجودی کافی نیست', '', 'error', 1800); return; }
          srcStock.reservedQty = (srcStock.reservedQty || 0) + state.qty;
          srcStock.updatedAt = new Date().toISOString();
          var dstW = getWh(fresh, state.dst);
          var t = {
            id: uid(), code: tcode(fresh),
            type: dstW.type === 'customer' ? 'direct-customer' : 'warehouse',
            sourceWarehouseId: state.src, destinationWarehouseId: state.dst,
            productId: state.pid, quantity: state.qty, description: state.desc,
            customerName: state.customerName || '', customerPhone: state.customerPhone || '',
            status: 'pending_warehouse',
            createdBy: App.user.id, createdByName: App.user.name,
            createdAt: new Date().toISOString()
          };
          fresh.transfers.unshift(t);
          saveDB(fresh);
          celebrate('ثبت شد', 'در انتظار تأیید انباردار', 'success', 1900);
          go('transfers');
        } catch(err) { btn.classList.remove('loading'); celebrate('خطا', err.message || '', 'error', 2000); }
      }, 400);
    }
  });
  draw(); attachRippleAll();
}

          return '<tr><td><span class="row-num">' + (i + 1) + '</span></td><td><div class="user-cell"><div class="avatar-sm">' + esc(initials(u.name)) + '</div><div class="info"><b>' + esc(u.name) + '</b><span>' + (isSelf ? 'خودتان' : (u.isActive ? 'فعال' : 'غیرفعال')) + '</span></div></div></td><td><span class="code-chip">' + esc(u.username) + '</span></td><td>' + roleCell + '</td><td>' + (u.isActive ? '<span class="status-pill on"><span class="dot"></span>فعال</span>' : '<span class="status-pill off"><span class="dot"></span>غیرفعال</span>') + '</td><td class="actions-cell">' + actionCell + '</td></tr>';
        }).join('') +

      fresh.users.push({ id: uid(), name: name, username: username, password: password, role: role, isActive: true });
      saveDB(fresh); celebrate('افزوده شد', '«' + name + '» — ' + ROLES[role], 'success', 1800); render();
    });
  }
  $$('[data-tog]').forEach(function(b) {
    b.addEventListener('click', function() {
      var fresh = loadDB(); var u = fresh.users.filter(function(x) { return x.id === b.dataset.tog; })[0];
      if (!u) return;
      if (!canEditUser(u)) { celebrate('دسترسی ندارید', '', 'error', 1600); render(); return; }
      u.isActive = !u.isActive; saveDB(fresh); celebrate(u.isActive ? 'فعال شد' : 'غیرفعال شد', u.name, 'success', 1500); render();
    });
  });
  $$('[data-role]').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var fresh = loadDB(); var u = fresh.users.filter(function(x) { return x.id === sel.dataset.role; })[0];
      if (!u) return;
      if (!canEditUser(u)) { celebrate('دسترسی ندارید', '', 'error', 1600); render(); return; }
      var newRole = sel.value;
      if (!canAssignRole(newRole)) { celebrate('دسترسی ندارید', 'این نقش قابل تخصیص نیست', 'error', 1800); render(); return; }
      u.role = newRole; saveDB(fresh); celebrate('دسترسی تغییر کرد', u.name + ' → ' + ROLES[u.role], 'success', 1700); render();
    });
  });
  attachRippleAll();
}

/* ===== EXPORT HELPERS ===== */
function downloadBlob(blob, filename) {
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(url); if (a.parentNode) a.remove(); }, 500);
  } catch(e) { celebrate('خطا در دانلود', e.message || '', 'error', 2000); }
}
function exportCSV(filename, headers, rows) {
  function escCSV(v) {
    var s = String(v == null ? '' : v);
    if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  var csv = '\ufeff' + headers.map(escCSV).join(',') + '\n' + rows.map(function(r) { return r.map(escCSV).join(','); }).join('\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), filename + '.csv');
}
function exportExcel(filename, title, headers, rows) {
  var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 10px;text-align:right;font-family:Tahoma}th{background:#eef2f9;font-weight:bold;color:#334155}</style></head><body>';
  html += '<h3 style="font-family:Tahoma;color:#007AFF">' + title + '</h3>';
  html += '<p style="font-family:Tahoma;font-size:11px;color:#666">تاریخ: ' + faDate(new Date().toISOString()) + '</p>';
  html += '<table><thead><tr>' + headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(r) { html += '<tr>' + r.map(function(c) { return '<td>' + (c == null ? '' : String(c)) + '</td>'; }).join('') + '</tr>'; });
  html += '</tbody></table></body></html>';
  downloadBlob(new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8' }), filename + '.xls');
}
function buildPdfHtml(title, subtitle, headers, rows, autoPrint) {
  var html = '<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8"><title>' + title + '</title>';
  html += '<style>body{font-family:Tahoma,"Vazirmatn",sans-serif;padding:20px;color:#1e293b;margin:0}h1{font-size:20px;margin:0 0 6px;color:#007AFF}h2{font-size:12px;font-weight:500;color:#64748b;margin:0 0 18px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #cbd5e1;padding:6px 8px;text-align:right;vertical-align:middle}th{background:#eef2f9;font-weight:bold;color:#334155}tr:nth-child(even) td{background:#f8fafc}.empty{padding:40px;text-align:center;color:#94a3b8}@media print{@page{size:A4 landscape;margin:10mm}body{padding:0}h1{font-size:16px}}</style>';
  html += '</head><body>';
  html += '<h1>' + esc(title) + '</h1>';
  html += '<h2>' + esc(subtitle || '') + ' — تاریخ: ' + faDate(new Date().toISOString()) + '</h2>';
  if (!rows || !rows.length) html += '<div class="empty">موردی برای نمایش نیست</div>';
  else {
    html += '<table><thead><tr>' + headers.map(function(h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function(r) { html += '<tr>' + r.map(function(c) { return '<td>' + esc(c == null ? '' : String(c)) + '</td>'; }).join('') + '</tr>'; });
    html += '</tbody></table>';
  }
  if (autoPrint) html += '<scr' + 'ipt>setTimeout(function(){try{window.focus();window.print();}catch(e){}},500);</scr' + 'ipt>';
  html += '</body></html>';
  return html;
}
function exportPDF(title, subtitle, headers, rows) {
  try {
    var old = document.querySelector('.pdf-modal');
    if (old) old.remove();
    var inlineHtml = buildPdfHtml(title, subtitle, headers, rows, false);
    var printableHtml = buildPdfHtml(title, subtitle, headers, rows, true);
    var m = document.createElement('div');
    m.className = 'pdf-modal';
    m.innerHTML =
      '<div class="pdf-toolbar">' +
        '<button type="button" class="btn ghost sm" id="pdf-close" title="بستن">' + IC.chevR + ' <span class="lbl">بستن</span></button>' +
        '<div class="pdf-title">' + esc(title) + '</div>' +
        '<button type="button" class="btn ghost sm" id="pdf-newwin" title="باز در تب جدید">' + IC.file + ' <span class="lbl">تب جدید</span></button>' +
        '<button type="button" class="btn primary sm" id="pdf-print" title="چاپ">' + IC.print + ' <span class="lbl">چاپ</span></button>' +
      '</div>' +
      '<div class="pdf-frame-wrap"><iframe id="pdf-frame" sandbox="allow-same-origin allow-modals allow-popups allow-scripts"></iframe></div>';
    document.body.appendChild(m);
    var frame = m.querySelector('#pdf-frame');
    try { frame.srcdoc = inlineHtml; }
    catch(e) { try { frame.contentDocument.open(); frame.contentDocument.write(inlineHtml); frame.contentDocument.close(); } catch(e2) {} }
    function closePdf() { try { m.remove(); } catch(e) {} }
    m.querySelector('#pdf-close').addEventListener('click', closePdf);
    m.querySelector('#pdf-print').addEventListener('click', function() {
      try {
        var win = frame.contentWindow; if (!win) throw new Error('iframe در دسترس نیست');
        win.focus(); win.print();
      } catch(e) {
        try {
          var w = window.open('', '_blank');
          if (!w) { celebrate('پاپ‌آپ مسدود است', 'از «تب جدید» استفاده کنید', 'warn', 2200); return; }
          w.document.open(); w.document.write(printableHtml); w.document.close();
        } catch(err) { celebrate('خطا در چاپ', err.message || 'از «تب جدید» استفاده کنید', 'error', 2200); }
      }
    });
    m.querySelector('#pdf-newwin').addEventListener('click', function() {
      try {
        var w = window.open('', '_blank');
        if (!w) { celebrate('پاپ‌آپ مسدود شده', 'لطفاً اجازه پاپ‌آپ بدهید', 'warn', 2200); return; }
        w.document.open(); w.document.write(printableHtml); w.document.close();
      } catch(e) { celebrate('خطا', e.message || '', 'error', 2000); }
    });
    attachRippleAll(m);
  } catch(e) { celebrate('خطا در تولید PDF', e.message || '', 'error', 2200); }
}
