}

.notif-card-time {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  padding-top: 3px;
  flex-shrink: 0;
}

.notif-card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.notif-card-title b {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -.2px;
}

.notif-qty-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 100px;
  background: linear-gradient(135deg, rgba(0,122,255,.14), rgba(88,86,214,.10));
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.notif-qty-badge .notif-qty-unit {
  font-size: 10px;
  font-weight: 600;
  opacity: .7;
}

.notif-route {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  padding: 8px 10px;
  background: var(--surface-2);
  border-radius: 12px;
  flex-wrap: wrap;
}

.notif-route-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-2);
  padding: 3px 9px;
  background: var(--surface);
  border-radius: 100px;
  border: 1px solid var(--border);
  white-space: nowrap;
}

.notif-route-chip .notif-route-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.notif-route-arrow {
  color: var(--muted);
  flex-shrink: 0;
  display: inline-flex;
}

.notif-route-arrow svg {
  width: 13px;
  height: 13px;
  display: block;
}

.notif-steps {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}

.notif-step {
  flex: 1;
  height: 4px;
  border-radius: 100px;
  background: var(--surface-3);
  position: relative;
  overflow: hidden;
}

.notif-step.done {
  background: var(--grad-success);
}

.notif-step.active {
  background: var(--grad);
  animation: pulse 2s ease-in-out infinite;
}

.notif-step.done::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: notifShimmer 2s linear infinite;
}

.notif-meta-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--muted);
}

.notif-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.notif-meta-item svg {
  width: 12px;
  height: 12px;
  opacity: .7;
}

.notif-meta-item b {
  color: var(--text-2);
  font-weight: 600;
}

.notif-desc {
  margin-bottom: 12px;
  padding: 9px 12px;
  background: var(--surface-2);
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.7;
  border-right: 2px solid var(--border-2);
}

.notif-actions {
  display: flex;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
  flex-wrap: wrap;
  align-items: center;
}

.notif-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 34px;
  padding: 0 14px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .2s var(--ease);
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.notif-btn svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.notif-btn.approve {
  background: var(--grad-success);
  color: #fff;
  box-shadow: 0 6px 16px -6px rgba(52,199,89,.5);
}

.notif-btn.approve:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px -6px rgba(52,199,89,.6);
}

.notif-btn.reject {
  background: rgba(255,59,48,.08);
  color: var(--red);
  border-color: rgba(255,59,48,.2);
}

.notif-btn.reject:hover {
  background: rgba(255,59,48,.14);
}

.notif-btn.ghost {
  background: var(--surface-2);
  color: var(--text-2);
  border-color: var(--border-2);
}

.notif-btn.ghost:hover {
  background: var(--surface-3);
}

.notif-btn.detail {
  margin-right: auto;
}

.notif-no-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--surface-2);
}

.notif-no-action svg {
  width: 12px;
  height: 12px;
}

/* Activity card (timeline style) */
.notif-card.activity {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  padding: 12px 14px;
  position: relative;
}

.notif-card.activity::before {
  display: none;
}

.notif-card.activity:hover {
  border-color: var(--border-2);
  box-shadow: var(--card-shadow);
  transform: translateY(-1px);
}

.notif-timeline-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  align-self: stretch;
  flex-shrink: 0;
}

.notif-timeline-dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  box-shadow: 0 4px 12px -3px rgba(0,0,0,.2);
}

.notif-timeline-dot.ok { background: var(--grad-success); }
.notif-timeline-dot.no { background: var(--grad-danger); }
.notif-timeline-dot.in { background: var(--grad-info); }

.notif-timeline-dot svg {
  width: 15px;
  height: 15px;
  stroke-width: 2.5;
}

.notif-timeline-line {
  width: 2px;
  flex: 1;
  background: var(--border);
  margin: 4px 0;
  min-height: 12px;
}

.notif-card.activity:last-child .notif-timeline-line {
  display: none;
}

.notif-activity-body {
  flex: 1;
  min-width: 0;
  padding-top: 2px;
}

.notif-activity-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}

.notif-activity-title b {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
}

.notif-activity-action {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 10.5px;
  font-weight: 700;
}

.notif-activity-action.ok {
  background: rgba(52,199,89,.14);
  color: #047857;
}

.notif-activity-action.no {
  background: rgba(255,59,48,.14);
  color: #b91c1c;
}

.notif-activity-action.in {
  background: rgba(90,200,250,.14);
  color: #0369a1;
}

[data-theme="dark"] .notif-activity-action.ok { color: #34d399; }
[data-theme="dark"] .notif-activity-action.no { color: #f87171; }
[data-theme="dark"] .notif-activity-action.in { color: #38bdf8; }

.notif-activity-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--muted);
  flex-wrap: wrap;
  margin-top: 4px;
}

.notif-activity-meta .notif-meta-item b {
  color: var(--text-2);
  font-weight: 600;
}

.notif-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 60px 24px;
  text-align: center;
}

.notif-empty-art {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(52,199,89,.10), rgba(0,161,75,.06));
  display: grid;
  place-items: center;
  color: var(--green);
  border: 1px solid rgba(52,199,89,.2);
  position: relative;
}

.notif-empty-art svg {
  width: 36px;
  height: 36px;
  opacity: .7;
  stroke-width: 1.8;
}

.notif-empty b {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.notif-empty p {
  font-size: 12.5px;
  color: var(--muted);
  max-width: 260px;
  line-height: 1.9;
}

/* ============================================================
   CELEBRATE MODAL (rare, for major actions only)
   ============================================================ */
.celebrate {
  position: fixed;
  inset: 0;
  z-index: 1500;
  display: grid;
  place-items: center;
  background: rgba(10,15,25,.5);
  backdrop-filter: blur(20px);
  animation: fadeIn .25s var(--ease);
  overflow: hidden;
}

.celebrate.exit {
  animation: celebrateOut .5s var(--ease) forwards;
}

.celebrate-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding: 40px 50px;
  text-align: center;
}

.celebrate-icon {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  background: var(--grad);
  animation: circleIn .5s var(--ease);
  position: relative;
  box-shadow: 0 30px 60px -20px rgba(0,122,255,.7);
}

.celebrate.success .celebrate-icon {
  background: var(--grad-success);
  box-shadow: 0 30px 60px -20px rgba(52,199,89,.7);
}

.celebrate.error .celebrate-icon {
  background: var(--grad-danger);
  box-shadow: 0 30px 60px -20px rgba(255,59,48,.7);
}

.celebrate.warn .celebrate-icon {
  background: var(--grad-warn);
  box-shadow: 0 30px 60px -20px rgba(255,149,0,.7);
}

.celebrate.info .celebrate-icon {
  background: var(--grad-info);
  box-shadow: 0 30px 60px -20px rgba(90,200,250,.7);
}

.celebrate-icon svg {
  width: 70px;
  height: 70px;
  stroke-width: 3;
}

.celebrate-title {
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 10px;
  text-shadow: 0 4px 20px rgba(0,0,0,.35);
}

.celebrate-desc {
  font-size: 15px;
  color: rgba(255,255,255,.85);
  line-height: 1.9;
}

.celebrate-hint {
  margin-top: 8px;
  font-size: 12px;
  color: rgba(255,255,255,.55);
}

.confetti {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 14px;
  border-radius: 3px;
  pointer-events: none;
  animation: confetti linear forwards;
}

/* ============================================================
   LOGIN SCREEN
   ============================================================ */
.login {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
}

.login-left {
  background: var(--grad);
  color: #fff;
  padding: 56px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}

.login-left::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(600px 400px at 90% 10%, rgba(255,255,255,.2), transparent 60%),
    radial-gradient(500px 400px at 10% 90%, rgba(255,255,255,.14), transparent 60%);
}

.login-left > * {
  position: relative;
  z-index: 1;
}

.llogo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.llogo .badge-i {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.22);
  border: 1px solid rgba(255,255,255,.35);
  color: #fff;
  backdrop-filter: blur(10px);
}

.llogo .badge-i svg {
  width: 30px;
  height: 30px;
}

.llogo .wm {
  color: #fff !important;
  -webkit-text-fill-color: #fff !important;
  background: none !important;
  font-size: 28px;
  letter-spacing: -1px;
  direction: ltr;
  display: inline-block;
}

.llogo .tagline {
  font-size: 11.5px;
  opacity: .75;
  margin-top: 2px;
  letter-spacing: .5px;
  direction: ltr;
}

.ltag h2 {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 16px;
}

.ltag p {
  font-size: 15px;
  opacity: .9;
  line-height: 2;
  max-width: 420px;
}

.lfeat {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 34px;
}

.lfeat-item {
  display: flex;
  gap: 13px;
  align-items: center;
  font-size: 14px;
  opacity: .94;
}

.lfeat-item svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.login-right {
  display: grid;
  place-items: center;
  padding: 40px;
  background: var(--bg);
}

.login-card {
  width: 100%;
  max-width: 420px;
}

.login-card h1 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 6px;
}

.login-card .sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 28px;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.login-form .field input {
  height: 50px;
  font-size: 14.5px;
}

.login-form .field select {
  height: 50px;
  font-size: 14.5px;
  font-weight: 600;
}

/* ============================================================
   UTILITY CLASSES
   ============================================================ */
.muted { color: var(--muted); }
.small { font-size: 12px; }

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: 100px;
  background: var(--surface);
  border: 1px solid var(--border-2);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all .28s var(--ease);
}

.chip:hover {
  border-color: var(--border-2);
  background: var(--surface-2);
}

.chip.active {
  background: var(--grad);
  color: #fff;
  border-color: transparent;
}

.chip .count {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 100px;
  background: rgba(0,0,0,.08);
}

.chip.active .count {
  background: rgba(255,255,255,.3);
}

.search-input {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 340px;
}

.search-input input {
  width: 100%;
  height: 40px;
  padding: 0 40px 0 14px;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 100px;
  font-size: 13px;
  color: var(--text);
}

.search-input input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(0,122,255,.14);
}

.search-input svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--muted);
  pointer-events: none;
}

/* Definition list */
.dl {
  display: grid;
  gap: 1px;
  background: var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.dl-item {
  background: var(--surface);
  padding: 13px 15px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.dl-item .k {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}

.dl-item .v {
  font-size: 13.5px;
  font-weight: 700;
  word-break: break-word;
}

/* Timeline list (drawer) */
.tl {
  list-style: none;
  position: relative;
  padding-right: 32px;
}

.tl::before {
  content: '';
  position: absolute;
  right: 12px;
  top: 14px;
  bottom: 14px;
  width: 2px;
  background: var(--border);
}

.tl li {
  position: relative;
  padding: 0 0 24px;
}

.tl li:last-child {
  padding-bottom: 0;
}

.tl-node {
  position: absolute;
  right: -32px;
  top: 2px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border);
  display: grid;
  place-items: center;
  color: var(--muted);
}

.tl-node svg {
  width: 12px;
  height: 12px;
}

.tl li.done .tl-node {
  background: var(--grad-success);
  border-color: transparent;
  color: #fff;
}

.tl li.active .tl-node {
  background: var(--grad);
  border-color: transparent;
  color: #fff;
  animation: pulse 1.8s ease-in-out infinite;
}

.tl li.rejected .tl-node {
  background: var(--grad-danger);
  border-color: transparent;
  color: #fff;
}

.tl-title {
  font-weight: 700;
  font-size: 13.5px;
  margin-bottom: 3px;
}

.tl-meta {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.75;
}

.tl-meta b {
  color: var(--text-2);
  font-weight: 600;
}

/* Empty state */
.empty {
  padding: 44px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.empty-art {
  position: relative;
  width: 96px;
  height: 96px;
  margin-bottom: 2px;
}

.empty-circle {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0,122,255,.10), rgba(175,82,222,.06));
  display: grid;
  place-items: center;
  color: var(--blue);
  border: 1px solid rgba(0,122,255,.14);
}

.empty-circle svg {
  width: 40px;
  height: 40px;
  opacity: .65;
  stroke-width: 1.6;
}

.empty b {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.empty p {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.9;
  max-width: 320px;
  margin-top: -4px;
}

.empty .btn {
  margin-top: 6px;
}

/* ============================================================
   BOTTOM TABS (mobile)
   ============================================================ */
.bottom-tabs {
  display: none;
  position: fixed;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  background: var(--g2);
  backdrop-filter: blur(30px) saturate(1.9);
  -webkit-backdrop-filter: blur(30px) saturate(1.9);
  border: 1px solid var(--gb);
  border-radius: 100px;
  box-shadow: var(--ghl), 0 20px 50px -12px rgba(15,23,42,.35);
  padding: 5px;
  gap: 2px;
  max-width: calc(100vw - 24px);
  align-items: center;
}

.tab-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 58px;
  padding: 7px 9px;
  border-radius: 100px;
  color: var(--text-2);
  cursor: pointer;
  transition: all .28s var(--ease);
  background: transparent;
  border: 0;
  flex: 1;
}

.tab-btn svg {
  width: 22px;
  height: 22px;
  transition: transform .3s var(--spring);
}

.tab-btn span {
  font-size: 9.5px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}

.tab-btn:active {
  transform: scale(.94);
}

.tab-btn.active {
  background: var(--grad);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 10px 22px -8px rgba(0,122,255,.65);
}

.tab-btn.active svg {
  transform: scale(1.08);
}

.tab-btn .tab-badge {
  position: absolute;
  top: 2px;
  right: 50%;
  transform: translateX(12px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 100px;
  background: var(--grad-danger);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  display: grid;
  place-items: center;
  border: 2px solid var(--g3);
  line-height: 1;
}

.tab-btn.active .tab-badge {
  border-color: transparent;
}

/* ============================================================
   BOTTOM SHEET
   ============================================================ */
.sheet-bd {
  position: fixed;
  inset: 0;
  z-index: 220;
  background: rgba(10,15,25,.45);
  backdrop-filter: blur(8px);
  animation: fadeIn .2s var(--ease);
}

.sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 221;
  background: var(--g3);
  backdrop-filter: blur(34px) saturate(1.9);
  border-top-left-radius: 28px;
  border-top-right-radius: 28px;
  border-top: 1px solid var(--gb);
  padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  max-height: 82vh;
  overflow-y: auto;
  animation: sheetUp .35s var(--ease);
  box-shadow: 0 -20px 60px -20px rgba(0,0,0,.5);
}

.sheet.closing {
  animation: sheetDown .25s var(--ease) forwards;
}

.sheet-handle {
  width: 42px;
  height: 4px;
  border-radius: 100px;
  background: var(--border-2);
  margin: 2px auto 14px;
}

.sheet-user {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: linear-gradient(135deg, rgba(0,122,255,.08), rgba(175,82,222,.06));
  border: 1px solid var(--gb);
  border-radius: 20px;
  margin-bottom: 14px;
}

.sheet-user .avatar {
  width: 54px;
  height: 54px;
  font-size: 18px;
}

.sheet-user .avatar::after {
  display: none;
}

.sheet-user .info {
  flex: 1;
  min-width: 0;
}

.sheet-user .info b {
  display: block;
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
}

.sheet-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px;
  border-radius: 16px;
  font-size: 14px;
  color: var(--text);
  background: transparent;
  border: 0;
  width: 100%;
  text-align: right;
  cursor: pointer;
  transition: background .2s var(--ease);
  margin-bottom: 2px;
}

.sheet-item:active {
  background: var(--g1);
}

.sheet-ic {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  background: var(--grad-2);
  flex-shrink: 0;
}

.sheet-ic svg {
  width: 18px;
  height: 18px;
}

.sheet-ic.success { background: var(--grad-success); }
.sheet-ic.warn { background: var(--grad-warn); }
.sheet-ic.info { background: var(--grad-info); }
.sheet-ic.danger { background: var(--grad-danger); }

.sheet-item b {
  font-weight: 600;
  flex: 1;
  text-align: right;
  font-size: 13.5px;
}

.sheet-item .sheet-count {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 100px;
  background: var(--grad-danger);
  color: #fff;
}

.sheet-sec {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .7px;
  padding: 14px 8px 8px;
}

/* ============================================================
   USER MENU (desktop dropdown)
   ============================================================ */
.userm {
  position: fixed;
  z-index: 200;
  background: var(--g3);
  backdrop-filter: blur(30px) saturate(1.9);
  border: 1px solid var(--gb);
  border-radius: 22px;
  box-shadow: 0 24px 50px -14px rgba(0,0,0,.35);
  padding: 8px;
  min-width: 240px;
  animation: popIn .3s var(--spring);
}

.userm .header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}

.userm .header .name {
  font-weight: 700;
  font-size: 14px;
}

.userm .header .role {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.userm .header .role::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue);
}

.userm .menu-i {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 100px;
  font-size: 13px;
  color: var(--text-2);
  text-align: right;
  cursor: pointer;
  background: none;
  border: 0;
}

.userm .menu-i:hover {
  background: var(--g1);
}

.userm .menu-i svg {
  width: 16px;
  height: 16px;
}

.userm .sep {
  height: 1px;
  background: var(--border);
  margin: 6px 4px;
}

/* ============================================================
   INSTALL TOAST (PWA)
   ============================================================ */
.install-toast {
  position: fixed;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 900;
  background: var(--g3);
  backdrop-filter: blur(24px) saturate(1.9);
  border: 1px solid var(--gb);
  border-radius: 100px;
  box-shadow: 0 20px 50px -12px rgba(15,23,42,.4);
  padding: 8px 8px 8px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: popIn .4s var(--spring);
  max-width: calc(100vw - 24px);
}

.install-toast .txt {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.install-toast .txt small {
  display: block;
  font-weight: 500;
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 1px;
}

.install-toast button {
  height: 36px;
  padding: 0 14px;
  border-radius: 100px;
  font-size: 12.5px;
  font-weight: 700;
  background: var(--grad);
  color: #fff;
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.install-toast button svg {
  width: 14px;
  height: 14px;
}

.install-toast .x {
  background: transparent;
  color: var(--muted);
  width: 30px;
  height: 30px;
  padding: 0;
  justify-content: center;
  border-radius: 50%;
}

/* ============================================================
   REPORTS
   ============================================================ */
.rep-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.rep-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  background: var(--surface);
  border: 1px solid var(--border-2);
  cursor: pointer;
  transition: all .28s var(--ease);
  white-space: nowrap;
}

.rep-tab:hover {
  background: var(--surface-2);
}

.rep-tab.active {
  background: var(--grad);
  color: #fff;
  border-color: transparent;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 20px -8px rgba(0,122,255,.65);
}

.rep-tab svg {
  width: 15px;
  height: 15px;
}

.rep-filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

.rep-filters .field {
  flex-direction: row;
  align-items: center;
  gap: 8px;
  min-width: auto;
}

.rep-filters .field label {
  font-size: 11.5px;
  white-space: nowrap;
}

.rep-filters select,
.rep-filters input {
  height: 36px;
  padding: 0 32px 0 12px;
  border-radius: 100px;
  background: var(--surface);
  border: 1px solid var(--border-2);
  font-size: 12.5px;
  font-weight: 600;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: left 10px center;
  background-size: 11px;
  min-width: 120px;
}

.rep-filters input[type="date"] {
  padding: 0 12px;
  background-image: none;
  font-family: monospace;
  direction: ltr;
  text-align: left;
}

.rep-actions {
  display: flex;
  gap: 6px;
  margin-right: auto;
}

.rep-stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 16px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}

.rep-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
}

.rep-stat .k {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.rep-stat .k .wh-dot {
  width: 8px;
  height: 8px;
}

.rep-stat .v {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.rep-stat .v small {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  margin-right: 4px;
}

.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  padding: 10px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--muted);
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend .wh-dot {
  width: 8px;
  height: 8px;
}

/* ============================================================
   PDF MODAL
   ============================================================ */
.pdf-modal {
  position: fixed;
  inset: 0;
  z-index: 1300;
  display: flex;
  flex-direction: column;
  background: #e5e7eb;
  animation: fadeIn .25s var(--ease);
}

.pdf-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--g3);
  backdrop-filter: blur(24px) saturate(1.9);
  -webkit-backdrop-filter: blur(24px) saturate(1.9);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  box-shadow: 0 4px 20px -8px rgba(15,23,42,.2);
}

.pdf-toolbar .pdf-title {
  flex: 1;
  text-align: center;
  font-weight: 800;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 8px;
  min-width: 0;
}

.pdf-toolbar .btn {
  flex-shrink: 0;
}

.pdf-frame-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: #fff;
}

.pdf-frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
  display: block;
}

[data-theme="dark"] .pdf-modal {
  background: #0a0d14;
}

[data-theme="dark"] .pdf-frame-wrap {
  background: #1e2739;
}

/* ============================================================
   RESPONSIVE — VERY LARGE DESKTOP (1400px+)
   ============================================================ */
@media (min-width: 1400px) {
  .page {
    padding: 30px 24px 60px;
  }
  .bento {
    gap: 18px;
  }
  .hero {
    padding: 32px;
  }
  .hero h2 {
    font-size: 26px;
  }
  .hero p {
    font-size: 14px;
  }
}

/* ============================================================
   RESPONSIVE — TABLET LANDSCAPE (901px - 1100px)
   ============================================================ */
@media (max-width: 1100px) and (min-width: 901px) {
  .search-btn {
    min-width: 160px;
    padding: 0 12px;
  }
  .user-btn {
    padding: 3px;
    height: 40px;
  }
  .user-btn .who-text,
  .user-btn > svg {
    display: none;
  }
  .user-btn .avatar {
    width: 34px;
    height: 34px;
  }
  .nav-pill {
    padding: 0 12px;
    gap: 6px;
  }
  .nav-pill .kbd {
    display: none;
  }
}

/* ============================================================
   RESPONSIVE — LAPTOP (1101px - 1300px)
   ============================================================ */
@media (max-width: 1300px) and (min-width: 1101px) {
  .nav-pill .kbd {
    display: none;
  }
}

/* ============================================================
   RESPONSIVE — TABLET (641px - 1100px)
   ============================================================ */
@media (max-width: 1100px) and (min-width: 641px) {
  .bento {
    gap: 14px;
  }
  .page {
    padding: 22px 18px 60px;
  }
  .hero {
    padding: 24px;
    border-radius: 24px;
  }
  .hero h2 {
    font-size: 22px;
  }
  .hero p {
    font-size: 13px;
  }
  .hero-stats {
    gap: 22px;
    margin-top: 18px;
  }
  .hero-stat .v {
    font-size: 20px;
  }
  .hero-quick {
    margin-top: 18px;
  }
  .widget {
    padding: 16px;
    border-radius: 20px;
  }
  .stat {
    padding: 16px;
    border-radius: 20px;
  }
  .stat-value {
    font-size: 28px;
  }
  .stat-spark {
    width: 70px;
  }
  .stat-spark .sparkline {
    width: 70px;
    height: 30px;
  }
  .qa {
    gap: 8px;
  }
  .qa-btn {
    padding: 14px;
    border-radius: 16px;
  }
  .qa-btn .ic {
    width: 34px;
    height: 34px;
  }
  .qa-btn .ic svg {
    width: 16px;

  }
  .table-toolbar {
    padding: 12px 16px;
  }
  .dt {

  .dt thead th,

    padding: 12px 16px;
  }
  .rep-tab {

    padding: 0 14px;

  }
  .tl {
    padding-right: 28px;
  }
  .tl::before {
    right: 11px;
  }
  .tl-node {
    right: -28px;
    width: 24px;
    height: 24px;
  }
  .modal {
    padding: 24px;
  }
  .drawer {
    max-width: 480px;
  }
}

/* ============================================================
   RESPONSIVE — MOBILE (<=640px)
   ============================================================ */
@media (max-width: 900px) {
  .nav-wrap {
    padding: 10px 12px 0;
  }
  .navbar {
    justify-content: space-between;
    padding: 0 8px 0 12px;
    height: 58px;
    gap: 0;
  }
  .nav-pills {
    display: none !important;
  }
  .nav-right {
    margin-right: 0 !important;
    margin-left: 0 !important;
    gap: 6px;
  }
  .search-btn {
    min-width: 38px !important;
    width: 38px !important;
    padding: 0 !important;
    justify-content: center !important;
  }
  .search-btn span,
  .search-btn kbd {
    display: none !important;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
  }
  .user-btn {
    padding: 3px;
    height: 40px;
  }
  .user-btn .who-text,
  .user-btn > svg {
    display: none;
  }
  .user-btn .avatar {
    width: 34px;
    height: 34px;
  }
  .brand-text .wm {
    font-size: 17px;
  }
  .brand-text small {
    font-size: 9.5px;
  }
  .splash-logo-wrap {
    width: 130px;
    height: 130px;
  }
  .splash-logo {
    width: 110px;
    height: 110px;
  }
  .splash-logo svg {
    width: 54px;
    height: 54px;
  }
  .splash-wordmark {
    font-size: 42px;
  }
  .page {
    padding: 18px 14px 130px;
  }
  .bottom-tabs {
    display: flex;
  }
  .toast-wrap {
    bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
  .bulk-bar {
    bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
}

@media (min-width: 901px) {
  .user-btn .who-text {
    display: block;
  }
}

/* ============================================================
   RESPONSIVE — SMALL MOBILE (<=640px details)
   ============================================================ */
@media (max-width: 640px) {
  .page {
    padding: 16px 12px 110px;
  }
  .page-head {
    margin-bottom: 16px;
    gap: 10px;
  }
  .page-head h1 {
    font-size: 22px;
  }
  .page-head .sub {
    font-size: 12px;
  }
  .page-actions {
    width: 100%;
  }
  .page-actions .btn {
    flex: 1;
  }
  .bento > * {
    grid-column: span 12 !important;
  }
  .hero {
    padding: 18px;
    border-radius: 20px;
  }
  .hero h2 {

    line-height: 1.35;
  }
  .hero p {
    font-size: 12.5px;
    line-height: 1.8;
  }
  .hero-stats {
    gap: 18px;
    margin-top: 14px;
  }
  .hero-stat .k {
    font-size: 10.5px;
  }
  .hero-stat .v {
    font-size: 17px;
  }
  .hero-quick {
    gap: 6px;
    margin-top: 16px;
  }
  .hero-quick button {

<!-- ============================================================
     ERROR BOUNDARY
     ============================================================ -->
<script>
(function () {
  /**
   * Filters cross-origin / irrelevant errors that would pollute the error bar.
   * "Script error." is what browsers report for cross-origin script errors with
   * no useful information — we skip those since we can't act on them anyway.
   */
  function isCrossOriginNoise(msg, src) {
    if (!msg) return true;
    var m = String(msg);
    if (m === 'Script error.' || m.indexOf('Script error') === 0) return true;
    if (m === 'ResizeObserver loop limit exceeded') return true;
    if (m === 'ResizeObserver loop completed with undelivered notifications.') return true;
    try {
      if (src) {
        var u = new URL(src, location.href);
        if (u.origin !== location.origin) return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  /** Renders a red error bar at the top of the page. Auto-dismisses after 8s. */
  function show(msg, line, col) {
    var e = document.getElementById('err');
    if (!e) return;
    e.style.display = 'block';
    e.textContent = 'ERROR: ' + msg + (line ? ' @ ' + line + ':' + col : '');
    clearTimeout(e._t);
    e._t = setTimeout(function () { e.style.display = 'none'; }, 8000);
  }

  window.onerror = function (msg, src, line, col, err) {
    if (isCrossOriginNoise(msg, src)) return false;
    if (!line && !col && err && !err.stack) return false;
    show(msg, line, col);
    return false;
  };

  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason;
    if (!r) return;
    if (isCrossOriginNoise(r.message || String(r))) return;
    var txt = (r && (r.message || r.toString())) || 'Unhandled rejection';
    if (txt.indexOf('Script error') >= 0) return;
    show(txt, 0, 0);
  });

  window.addEventListener('error', function (ev) {
    if (ev.target && ev.target !== window &&
        (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK' || ev.target.tagName === 'IMG')) {
      ev.preventDefault();
    }
  }, true);
})();
</script>

  /* ============================================================

     ============================================================ */
  function toast(title, desc, type) {
    type = type || 'success';
    var wrap = document.getElementById('toast-wrap');
    if (!wrap) return;
    var icon = type === 'success' ? IC.check : type === 'error' ? IC.x : type === 'warn' ? IC.alert : IC.info;
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<div class="toast-icon">' + icon + '</div><div class="toast-body"><b>' + esc(title) + '</b>' + (desc ? '<span>' + esc(desc) + '</span>' : '') + '</div>';
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    var t1 = setTimeout(function () {
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(function () { if (el.parentNode) el.remove(); }, 260);
    }, 2900);
    el.addEventListener('click', function () {
      clearTimeout(t1);
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(function () { if (el.parentNode) el.remove(); }, 260);
    });
  }

  /**
   * Undo toast — gives the user 5s to revert an action.
   * The undo callback receives no arguments; it should restore state via loadDB/saveDB.
   */
  function showUndoToast(title, onUndo, duration) {
    duration = duration || 5000;
    var wrap = document.getElementById('toast-wrap');
    if (!wrap) return;
    var el = document.createElement('div');
    el.className = 'toast undo show';
    el.innerHTML = '<div class="toast-icon">' + IC.alert + '</div><div class="toast-body"><b>' + esc(title) + '</b></div><button type="button" class="toast-undo-btn">' + IC.undo + ' بازگردانی</button><div class="toast-undo-bar"></div>';
    wrap.appendChild(el);
    var bar = el.querySelector('.toast-undo-bar');
    if (bar) bar.style.animationDuration = duration + 'ms';
    var done = false;
    function dismiss(ran) {
      if (done) return;
      done = true;
      if (ran && onUndo) {
        try { onUndo(); } catch (e) { console.error(e); }
      }
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(function () { if (el.parentNode) el.remove(); }, 260);
    }
    var btn = el.querySelector('.toast-undo-btn');
    if (btn) btn.addEventListener('click', function (e) { e.stopPropagation(); dismiss(true); });
    var tm = setTimeout(function () { dismiss(false); }, duration);
    el.addEventListener('click', function (e) {
      if (e.target === btn) return;
      clearTimeout(tm);
      dismiss(false);
    });
  }

  /** Skeleton loader for page transitions. */
  function showSkeleton(page) {
    if (!page) return;
    page.innerHTML =

  /* ============================================================
     IMAGE COMPRESSION — resize and re-encode to JPEG
     ============================================================ */
  function compressImage(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      try {
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            try {
              var w = img.width, h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                else { w = Math.round(w * maxDim / h); h = maxDim; }
              }
              var c = document.createElement('canvas');
              c.width = w;
              c.height = h;
              var ctx = c.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              var dataUrl = c.toDataURL('image/jpeg', quality || 0.75);
              resolve(dataUrl);
            } catch (err) { reject(err); }
          };
          img.onerror = function () { reject(new Error('تصویر نامعتبر')); };
          img.src = e.target.result;
        };
        reader.onerror = function () { reject(new Error('خطا در خواندن فایل')); };
        reader.readAsDataURL(file);
      } catch (err) { reject(err); }
    });
  }

  function renderDonutSVG(segments, size) {
    size = size || 120;
    var total = segments.reduce(function (a, s) { return a + s.value; }, 0);
    if (total === 0) {
      return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:var(--surface-3)"></div>';
    }

    svgOut += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="16"/>';
    var offset = 0;
    segments.forEach(function (s) {
      var pct = s.value / total;
      var dash = pct * circ;
      svgOut += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="16" stroke-dasharray="' + dash + ' ' + circ + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" stroke-linecap="butt"/>';
      offset += dash;

    svgOut += '<text x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle" dominant-baseline="middle" font-family="Vazirmatn,sans-serif" font-size="18" font-weight="800" fill="var(--text)">' + total.toLocaleString('fa-IR') + '</text>';

  /** Sort rows by key + direction. Uses localeCompare with 'fa' for Persian strings. */
  function sortRows(rows, key, dir, getter) {
    if (!dir) return rows.slice();
    var copy = rows.slice();
    copy.sort(function (a, b) {
      var va = getter ? getter(a, key) : a[key];
      var vb = getter ? getter(b, key) : b[key];
      if (va == null) va = '';
      if (vb == null) vb = '';
      if (typeof va === 'number' && typeof vb === 'number') return dir === 'asc' ? va - vb : vb - va;
      var sa = String(va), sb = String(vb);
      return dir === 'asc' ? sa.localeCompare(sb, 'fa') : sb.localeCompare(sa, 'fa');
    });
    return copy;
  }

  /* ============================================================
     PWA — install prompt + dynamic icons
     ============================================================ */
  var PWA = (function () {
    function drawIcon(size, maskable) {
      var c = document.createElement('canvas');
      c.width = c.height = size;
      var x = c.getContext('2d');
      if (!x) return null;
      var s = size;
      var pad = maskable ? s * 0.18 : s * 0.06;
      var g = x.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#007AFF');
      g.addColorStop(0.55, '#5856D6');
      g.addColorStop(1, '#AF52DE');
      x.fillStyle = g;
      if (maskable) {
        x.fillRect(0, 0, s, s);
      } else {
        var r = s * 0.22;
        x.beginPath();
        x.moveTo(r, 0);
        x.lineTo(s - r, 0);
        x.quadraticCurveTo(s, 0, s, r);
        x.lineTo(s, s - r);
        x.quadraticCurveTo(s, s, s - r, s);
        x.lineTo(r, s);
        x.quadraticCurveTo(0, s, 0, s - r);
        x.lineTo(0, r);
        x.quadraticCurveTo(0, 0, r, 0);
        x.closePath();
        x.fill();
      }
      x.save();
      x.globalCompositeOperation = 'source-atop';
      var hg = x.createRadialGradient(s * 0.75, s * 0.2, 0, s * 0.75, s * 0.2, s * 0.9);
      hg.addColorStop(0, 'rgba(255,255,255,.35)');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = hg;
      x.fillRect(0, 0, s, s);
      x.restore();
      var inner = s - pad * 2;
      var w = inner * 0.62, h = inner * 0.70;
      var cx = s / 2, cy = s / 2 + s * 0.01;
      x.strokeStyle = '#fff';
      x.lineWidth = Math.max(2, inner * 0.085);
      x.lineCap = 'round';
      x.lineJoin = 'round';
      x.beginPath();
      x.moveTo(cx - w / 2, cy + h / 2);
      x.lineTo(cx, cy - h / 2);
      x.lineTo(cx + w / 2, cy + h / 2);
      x.stroke();
      var barY = cy + h * 0.17;
      x.beginPath();
      x.moveTo(cx - w * 0.24, barY);
      x.lineTo(cx + w * 0.24, barY);
      x.stroke();
      try { return c.toDataURL('image/png'); } catch (e) { return null; }
    }

    function installManifest() {
      var i192 = drawIcon(192, false), i512 = drawIcon(512, false);
      var i192m = drawIcon(192, true), i512m = drawIcon(512, true);
      if (!i192 || !i512 || !i192m || !i512m) return;
      var fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/png';
      fav.href = i192;
      document.head.appendChild(fav);
      var apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = i192;
      document.head.appendChild(apple);
      var manifest = {
        name: 'Alus — پنل مدیریت',
        short_name: 'Alus',
        description: 'مدیریت هوشمند موجودی و جابه‌جایی مبلمان',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        display_override: ['standalone', 'minimal-ui'],
        orientation: 'any',
        background_color: '#007AFF',
        theme_color: '#007AFF',
        dir: 'rtl',
        lang: 'fa-IR',
        categories: ['business', 'productivity'],
        icons: [
          { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: i192m, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
          { src: i512m, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      var url;
      try {
        url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      } catch (e) {
        url = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      }
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = url;
      document.head.appendChild(link);
    }

    var deferredPrompt = null;
    var installShown = false;

    function showInstallToast() {
      if (installShown || !deferredPrompt) return;
      try { if (sessionStorage.getItem('alus_install_dismissed') === '1') return; } catch (e) {}
      if (document.querySelector('.install-toast')) return;
      installShown = true;
      var t = document.createElement('div');
      t.className = 'install-toast';
      t.innerHTML = '<div class="alus-mark" style="width:36px;height:36px;border-radius:50%;flex-shrink:0">' + BRAND_A + '</div><div class="txt">نصب Alus<small>برای دسترسی سریع روی صفحه اصلی</small></div><button type="button" data-act="install">' + IC.download + ' نصب</button><button type="button" class="x" data-act="dismiss">' + IC.close + '</button>';
      document.body.appendChild(t);
      t.addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (!b) return;
        if (b.dataset.act === 'install') {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
          }
          t.remove();
        } else if (b.dataset.act === 'dismiss') {
          try { sessionStorage.setItem('alus_install_dismissed', '1'); } catch (e) {}
          t.remove();
        }
      });
      setTimeout(function () { if (t.parentNode) t.remove(); }, 12000);
    }

    function init() {
      try { installManifest(); } catch (e) {}
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(showInstallToast, 3500);
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        var t = document.querySelector('.install-toast');
        if (t) t.remove();
      });
    }

    return { init: init };
  })();

  /* ============================================================
     STORAGE KEYS & DATA MODEL
     ============================================================ */
  var K_DB = 'alus_db_v1';
  var K_SES = 'alus_ses_v1';
  var K_PREF = 'alus_pref_v1';
  var K_ROUTE = 'alus_route_v1';

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function ymd() {
    var d = new Date();
    return '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  }

  function emptyDB() {
    return { users: [], warehouses: [], products: [], stocks: [], transfers: [], adjustments: [] };
  }

  /**
   * Applies migrations to bring older DBs up to current schema.
   * Called automatically on every loadDB().
   */
  function migrateDB(d) {
    var changed = false;
    if (!d.adjustments) { d.adjustments = []; changed = true; }
    if (!d.users) { d.users = []; changed = true; }
    if (!d.warehouses) { d.warehouses = []; changed = true; }
    if (!d.products) { d.products = []; changed = true; }
    if (!d.stocks) { d.stocks = []; changed = true; }
    if (!d.transfers) { d.transfers = []; changed = true; }

    for (var i = 0; i < d.products.length; i++) {
      if (!d.products[i].components) { d.products[i].components = []; changed = true; }
      if (d.products[i].image === undefined) { d.products[i].image = ''; changed = true; }
    }

    for (var j = 0; j < d.warehouses.length; j++) {
      var w = d.warehouses[j];
      if (w.type === 'paint') {
        w.type = 'paint_in';
        if (!w.name || w.name === 'رنگ‌کاری') w.name = 'رنگ‌کاری داخلی';
        changed = true;
      }
    }

    for (var k = 0; k < d.stocks.length; k++) {
      if (d.stocks[k].minQuantity === undefined) { d.stocks[k].minQuantity = 5; changed = true; }
    }

    function ensure(type, name, order) {
      var found = false;
      for (var k2 = 0; k2 < d.warehouses.length; k2++) {
        if (d.warehouses[k2].type === type) { found = true; break; }
      }
      if (!found) {
        d.warehouses.push({ id: uid(), name: name, type: type, isActive: true, order: order || 0 });
        changed = true;
      }
    }
    ensure('central', 'انبار مرکزی', 1);
    ensure('paint_in', 'رنگ‌کاری داخلی', 2);
    ensure('paint_out', 'رنگ‌کاری بیرون', 3);
    ensure('upholstery', 'رویه‌کوبی', 4);
    ensure('store', 'فروشگاه', 5);
    ensure('showroom_khalij', 'نمایشگاه خلیج فارس', 6);
    ensure('showroom_alus', 'نمایشگاه الوس', 7);
    ensure('sold', 'کالای فروش‌رفته', 8);
    ensure('customer', 'مشتری', 9);

    // Migrate legacy default passwords to the current default (1111)
    var oldDefaults = { admin: 'admin', manager: 'manager', acc: 'acc', wh: 'wh' };
    for (var u = 0; u < d.users.length; u++) {
      if (oldDefaults[d.users[u].username] && d.users[u].password === oldDefaults[d.users[u].username]) {
        d.users[u].password = '1111';
        changed = true;
      }
    }
    return changed;
  }

  function loadDB() {
    var raw = null;
    try { raw = localStorage.getItem(K_DB); } catch (e) {}
    if (!raw) return emptyDB();
    try {
      var d = JSON.parse(raw);
      var changed = migrateDB(d);
      if (changed) {
        try { localStorage.setItem(K_DB, JSON.stringify(d)); } catch (e) {}
      }
      return d;
    } catch (e) {
      return emptyDB();
    }
  }

  /** Persists DB. Catches quota-exceeded and shows a friendly toast. */
  function saveDB(db) {
    try {
      localStorage.setItem(K_DB, JSON.stringify(db));
      return true;
    } catch (e) {
      if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
        toast('حافظه پر شد', 'حجم تصاویر کالاها را کم کنید', 'error');
      }
      return false;
    }
  }

  function tcode(db) {
    var y = ymd();
    var n = 1;
    for (var i = 0; i < db.transfers.length; i++) {
      if (db.transfers[i].code && db.transfers[i].code.indexOf('TR-' + y) === 0) n++;
    }
    return 'TR-' + y + '-' + ('00' + n).slice(-3);
  }

  function icode(db) {
    var y = ymd();
    var n = 1;
    for (var i = 0; i < db.transfers.length; i++) {
      if (db.transfers[i].code && db.transfers[i].code.indexOf('IN-' + y) === 0) n++;
    }
    return 'IN-' + y + '-' + ('00' + n).slice(-3);
  }

    if (d < 86400) return Math.floor(d / 3600) + ' ساعت پیش';

    return null;

    for (var i = 0; i < db.products.length; i++) if (db.products[i].id === id) return db.products[i];
    return null;

  /** Returns all stocks whose quantity has hit the low-stock threshold. */
  function lowStockItems(db) {
    var out = [];
    db.stocks.forEach(function (s) {
      if (s.quantity === 0) return;
      var minQ = s.minQuantity || 5;
      var w = getWh(db, s.warehouseId);
      var p = getProd(db, s.productId);
      if (!p || !w || w.type === 'customer') return;
      if (s.quantity <= minQ) out.push({ stock: s, product: p, warehouse: w });
    });
    out.sort(function (a, b) { return a.stock.quantity - b.stock.quantity; });
    return out;
  }

  /* ============================================================
     SPARKLINE DATA & SVG
     ============================================================ */
  function sparklineData(db, whType, days) {
    days = days || 7;
    var ids = db.warehouses.filter(function (w) { return w.type === whType; }).map(function (w) { return w.id; });
    var result = [];
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      d.setHours(0, 0, 0, 0);
      var next = new Date(d);
      next.setDate(next.getDate() + 1);
      var qty = 0;
      db.transfers.forEach(function (t) {
        if (t.status !== 'approved') return;
        var at = new Date(t.completedAt || t.createdAt);
        if (at < d || at >= next) return;
        if (t.type === 'inbound' && ids.indexOf(t.destinationWarehouseId) >= 0) qty += t.quantity;
        else if (ids.indexOf(t.sourceWarehouseId) >= 0 || ids.indexOf(t.destinationWarehouseId) >= 0) qty += t.quantity;
      });
      result.push(qty);
    }
    return result;
  }

  function sparklineSVG(values, color, w, h) {
    w = w || 80;
    h = h || 34;
    if (!values.length) return '';
    var max = Math.max.apply(null, values.concat([1]));
    var step = w / (values.length - 1 || 1);
    var pts = values.map(function (v, i) {
      var x = i * step;
      var y = h - (v / max) * (h - 6) - 3;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var area = '0,' + h + ' ' + pts + ' ' + w + ',' + h;
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polygon points="' + area + '" fill="' + color + '" opacity=".09"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';
  }

  /* ============================================================

     ============================================================ */
  function attachRipple(el) {
    if (el._rip) return;
    el._rip = true;
    el.addEventListener('click', function (e) {
      var r = el.getBoundingClientRect();
      var s = document.createElement('span');
      s.className = 'rip';
      var sz = Math.max(r.width, r.height);
      s.style.width = s.style.height = sz + 'px';
      s.style.left = (e.clientX - r.left - sz / 2) + 'px';
      s.style.top = (e.clientY - r.top - sz / 2) + 'px';
      el.appendChild(s);
      setTimeout(function () { if (s.parentNode) s.remove(); }, 700);
    });
  }

  function attachRippleAll(root) {
    $$('.btn', root || document).forEach(function (b) { attachRipple(b); });

      sh.classList.add('closing');
      setTimeout(function () { if (sh.parentNode) sh.remove(); }, 260);

  /* ============================================================
     NOTIFICATION PANEL
     ============================================================ */
  function getActivityTime(t) {
    if (t.status === 'approved') return t.completedAt || t.createdAt;
    if (t.status === 'rejected' && t.rejection) return t.rejection.at || t.createdAt;
    return t.createdAt;
  }

  /** Groups items into "today", "yesterday", "this week", "older". */
  function groupItemsByDate(items, getDate) {
    var groups = { today: [], yesterday: [], week: [], older: [] };
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var yesterdayStart = new Date(todayStart);
    yesterdayStart.setDate(yesterdayStart.getDate() - 1);
    var weekStart = new Date(todayStart);
    weekStart.setDate(weekStart.getDate() - 7);
    items.forEach(function (it) {
      var dt = getDate(it);
      var d = new Date(dt);
      if (isNaN(d.getTime())) d = new Date();
      if (d >= todayStart) groups.today.push(it);
      else if (d >= yesterdayStart) groups.yesterday.push(it);
      else if (d >= weekStart) groups.week.push(it);
      else groups.older.push(it);
    });
    return [
      { key: 'today', label: 'امروز', items: groups.today },
      { key: 'yesterday', label: 'دیروز', items: groups.yesterday },
      { key: 'week', label: 'این هفته', items: groups.week },
      { key: 'older', label: 'قدیمی‌تر', items: groups.older }
    ].filter(function (g) { return g.items.length > 0; });
  }

  function openNotif() {
    closeNotif();
    var db = loadDB();
    var pending = db.transfers.filter(function (t) {
      return t && typeof t.status === 'string' && t.status.indexOf('pending') === 0;
    }).sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    var activity = db.transfers.filter(function (t) {
      return t && (t.status === 'approved' || t.status === 'rejected');
    }).sort(function (a, b) {
      return new Date(getActivityTime(b)) - new Date(getActivityTime(a));
    }).slice(0, 40);
    var lowStock = lowStockItems(db);
    var notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';

    var bd = document.createElement('div');
    bd.className = 'notif-bd';
    var panel = document.createElement('div');
    panel.className = 'notif-panel';
    var totalPending = pending.length + lowStock.length;
    var badge = totalPending > 9 ? '9+' : String(totalPending);
    var permBanner = '';
    if (notifPerm === 'default') {
      permBanner = '<div class="notif-perm-banner"><div class="npb-ic">' + IC.bellRing + '</div><div class="npb-text"><b>اعلان مرورگر فعال نیست</b>می‌خواهید از تغییرات مهم باخبر شوید؟</div><button class="btn primary" id="notif-perm-btn">فعال کن</button></div>';
    }
    panel.innerHTML =
      '<div class="notif-head">' +
        '<div class="notif-head-icon">' + IC.bell + (totalPending ? '<span class="notif-head-badge">' + badge + '</span>' : '') + '</div>' +
        '<div class="notif-head-titles">' +
          '<div class="notif-head-title">اعلان‌ها</div>' +
          '<div class="notif-head-sub"></div>' +
        '</div>' +
        '<button class="notif-close" title="بستن" aria-label="بستن">' + IC.close + '</button>' +
      '</div>' +
      permBanner +
      '<div class="notif-tabs" role="tablist">' +
        '<button class="notif-tab ' + (pending.length ? 'active' : (lowStock.length ? '' : 'active')) + '" data-tab="pending" role="tab">' + IC.clock + 'تأیید' + (pending.length ? '<span class="notif-tab-count">' + pending.length + '</span>' : '') + '</button>' +
        '<button class="notif-tab" data-tab="low" role="tab">' + IC.alert + 'کم‌موجود' + (lowStock.length ? '<span class="notif-tab-count">' + lowStock.length + '</span>' : '') + '</button>' +
        '<button class="notif-tab" data-tab="activity" role="tab">' + IC.fire + 'تغییرات' + (activity.length ? '<span class="notif-tab-count">' + activity.length + '</span>' : '') + '</button>' +
      '</div>' +
      '<div class="notif-body"></div>';

    document.body.appendChild(bd);
    document.body.appendChild(panel);
    var body = panel.querySelector('.notif-body');
    var sub = panel.querySelector('.notif-head-sub');
    var tab = pending.length ? 'pending' : (lowStock.length ? 'low' : 'activity');

    function setActiveTab() {
      $$('.notif-tab', panel).forEach(function (t) { t.classList.toggle('active', t.dataset.tab === tab); });
    }

    function renderTab() {
      setActiveTab();
      if (tab === 'pending') {
        sub.innerHTML = pending.length ? IC.clock + ' <b>' + pending.length + '</b> درخواست در انتظار' : IC.check + ' درخواستی در انتظار نیست';
        body.innerHTML = renderPending(pending, db);
      } else if (tab === 'low') {
        sub.innerHTML = lowStock.length ? IC.alert + ' <b>' + lowStock.length + '</b> قلم در آستانه اتمام' : IC.check + ' موجودی همه کالاها کافی است';
        body.innerHTML = renderLowStock(lowStock, db);
      } else {
        sub.innerHTML = activity.length ? IC.fire + ' <b>' + activity.length + '</b> تغییر اخیر' : IC.inbox + ' هنوز تغییری ثبت نشده';
        body.innerHTML = renderActivity(activity, db);
      }
      body.scrollTop = 0;
      bindNotif(panel);
    }

    $$('.notif-tab', panel).forEach(function (t) {
      t.addEventListener('click', function () { tab = t.dataset.tab; renderTab(); });
    });

    var nx = panel.querySelector('.notif-close');
    if (nx) nx.addEventListener('click', closeNotif);
    var permBtn = panel.querySelector('#notif-perm-btn');
    if (permBtn) {

        requestNotifPermission();
        var b = panel.querySelector('.notif-perm-banner');
        if (b) b.remove();
      });

    bd.addEventListener('click', closeNotif);

  function closeNotif() {
    $$('.notif-bd').forEach(function (bd) {
      bd.style.animation = 'fadeOut .2s forwards';
      setTimeout(function () { if (bd.parentNode) bd.remove(); }, 200);
    });
    $$('.notif-panel').forEach(function (p) {
      p.style.animation = 'notifOut .3s forwards';
      setTimeout(function () { if (p.parentNode) p.remove(); }, 280);
    });
  }

  function renderPending(pending, db) {
    if (!pending.length) {
      return '<div class="notif-empty"><div class="notif-empty-art">' + IC.check + '</div><b>همه‌چیز مرتب است</b><p>درخواستی در انتظار تأیید شما وجود ندارد</p></div>';
    }
    var groups = groupItemsByDate(pending, function (t) { return t.createdAt; });
    return groups.map(function (g) {
      return '<div class="notif-group"><div class="notif-group-label">' + g.label + '<span class="notif-group-count">' + g.items.length + '</span></div>' +
        g.items.map(function (t) { return pendingCardHTML(t, db); }).join('') + '</div>';
    }).join('');
  }

        '<span class="notif-route-arrow">' + IC.arrowL + '</span>' +

        '<span class="notif-route-chip"><span class="notif-route-dot" style="background:' + (WH_COLOR[src && src.type] || '#94a3b8') + '"></span>' + esc((src && src.name) || '—') + '</span>' +
        '<span class="notif-route-arrow">' + IC.arrowL + '</span>' +
        '<span class="notif-route-chip"><span class="notif-route-dot" style="background:' + (WH_COLOR[dst2 && dst2.type] || '#94a3b8') + '"></span>' + esc((dst2 && dst2.name) || '—') + '</span>' +

      actionsHTML += '<button class="notif-btn reject" data-reject="' + t.id + '">' + IC.x + ' رد</button>';

        '<div class="notif-card-head-left">' +
          '<span class="notif-stage-badge ' + stageClass + '"><span class="notif-stage-dot"></span>' + stageLabel + '</span>' +
          (isIn ? '<span class="notif-type-badge">' + IC.inbound + ' ورود</span>' : '') +

  function renderLowStock(lowStock, db) {
    if (!lowStock.length) {
      return '<div class="notif-empty"><div class="notif-empty-art" style="background:linear-gradient(135deg,rgba(0,122,255,.10),rgba(88,86,214,.06));color:var(--blue);border-color:rgba(0,122,255,.2)">' + IC.check + '</div><b>موجودی همه کالاها کافی است</b><p>هیچ کالایی به آستانه اتمام نرسیده</p></div>';
    }
    return lowStock.map(function (it) {

  function renderActivity(activity, db) {

      return '<div class="notif-empty"><div class="notif-empty-art">' + IC.inbox + '</div><b>تغییری ثبت نشده</b><p>پس از تأیید یا رد اولین درخواست، اینجا نمایش داده می‌شود</p></div>';
    }

        g.items.map(function (t) { return activityCardHTML(t, db); }).join('') + '</div>';

    var when = ok ? t.completedAt : (t.rejection && t.rejection.at);

    var dotClass = isIn && ok ? 'in' : (ok ? 'ok' : 'no');

    var icon = isIn ? IC.inbound : (ok ? IC.check : IC.x);
    return '<div class="notif-card activity ' + (ok ? 'ok' : 'no') + '" data-nid="' + t.id + '">' +
      '<div class="notif-timeline-wrap">' +
        '<div class="notif-timeline-dot ' + dotClass + '">' + icon + '</div>' +
        '<div class="notif-timeline-line"></div>' +
      '</div>' +
      '<div class="notif-activity-body">' +
        '<div class="notif-activity-title"><b>' + esc((p && p.name) || '—') + '</b>' +
          '<span class="notif-qty-badge">' + t.quantity + ' <span class="notif-qty-unit">' + esc((p && p.unit) || '') + '</span></span>' +
        '</div>' +
        '<div class="notif-activity-meta">' +
          '<span class="notif-activity-action ' + actionClass + '">' + txt + '</span>' +
          '<span class="notif-meta-item">' + IC.user + '<b>' + esc(actor) + '</b></span>' +
          '<span class="notif-meta-item">' + IC.clock + relTime(when) + '</span>' +

  function bindNotif(panel) {
    $$('[data-approve]', panel).forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); doApprove(b.dataset.approve); });
    });
    $$('[data-reject]', panel).forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); doReject(b.dataset.reject); });
    });
    $$('[data-open]', panel).forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.dataset.open;
        closeNotif();
        setTimeout(function () { openTransfer(id); }, 250);
      });
    });
    $$('.notif-card.activity[data-nid]', panel).forEach(function (card) {
      card.addEventListener('click', function () {
        var id = card.dataset.nid;
        closeNotif();
        setTimeout(function () { openTransfer(id); }, 250);
      });
    });
  }

  /* ============================================================
     APPROVE / REJECT ACTIONS
     ============================================================ */
  function doApprove(id) {
    openModal({
      title: 'تأیید مرحله',
      desc: 'آیا از تأیید این مرحله مطمئن هستید؟',
      body: '<div class="field"><label>یادداشت (اختیاری)</label><textarea id="ap-note"></textarea></div>',
      actions: [
        { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
        {
          label: IC.check + ' تأیید',
          cls: 'success',
          onClick: function (c) {
            var btn = c.querySelector('button.success');
            if (btn) btn.classList.add('loading');
            var noteBox = c.querySelector('#ap-note');
            var note = noteBox ? noteBox.value.trim() : '';
            setTimeout(function () {
              try {
                var db = loadDB();
                var t = null;
                for (var i = 0; i < db.transfers.length; i++) {
                  if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
                }
                if (!t) { c.remove(); return; }
                if (!canApprove(App.user, t)) { c.remove(); toast('دسترسی ندارید', '', 'error'); return; }
                var step = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), note: note };
                var finalized = false;

                if (t.type === 'inbound') {
                  if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
                  else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
                  else if (t.status === 'pending_manager') {
                    t.managerApproval = step;
                    var ds = findStock(db, t.productId, t.destinationWarehouseId);
                    if (!ds) {
                      ds = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, minQuantity: 5, updatedAt: new Date().toISOString() };
                      db.stocks.push(ds);
                    }
                    ds.quantity = (ds.quantity || 0) + t.quantity;
                    ds.updatedAt = new Date().toISOString();
                    t.status = 'approved';
                    t.completedAt = new Date().toISOString();
                    finalized = true;
                  }
                } else {
                  if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
                  else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
                  else if (t.status === 'pending_manager') {
                    t.managerApproval = step;
                    var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
                    if (!srcStock || srcStock.quantity < t.quantity) {
                      c.remove();
                      toast('موجودی کافی نیست', '', 'error');
                      return;
                    }
                    srcStock.quantity -= t.quantity;
                    srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity);
                    srcStock.updatedAt = new Date().toISOString();
                    var dstW = getWh(db, t.destinationWarehouseId);
                    if (dstW && dstW.type !== 'customer') {
                      var ds2 = findStock(db, t.productId, t.destinationWarehouseId);
                      if (!ds2) {
                        ds2 = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, minQuantity: 5, updatedAt: new Date().toISOString() };
                        db.stocks.push(ds2);
                      }
                      ds2.quantity = (ds2.quantity || 0) + t.quantity;
                      ds2.updatedAt = new Date().toISOString();
                    }
                    t.status = 'approved';
                    t.completedAt = new Date().toISOString();
                    finalized = true;
                  }
                }

                saveDB(db);
                try { c.remove(); } catch (e) {}
                closeNotif();
                if (finalized) {
                  celebrate(t.type === 'inbound' ? 'ورود کالا ثبت شد' : 'انتقال قطعی شد', '', 'success', 2000);
                  notifyBrowser(t.type === 'inbound' ? 'ورود کالا ثبت شد' : 'انتقال قطعی شد', t.code + ' — ' + ((getProd(db, t.productId) || {}).name || ''), t.id);
                } else {
                  toast('تأیید شد', 'به مرحله بعد منتقل شد', 'success');
                  notifyBrowser('تأیید شد', t.code, t.id);
                }
                requestAnimationFrame(function () { requestAnimationFrame(function () { render(); }); });
              } catch (err) {
                try { c.remove(); } catch (e) {}
                toast('خطا', err.message || 'عملیات ناموفق', 'error');
              }
            }, 400);
          }
        }
      ]
    });
  }

  function doReject(id) {
    openModal({
      title: 'رد درخواست',
      desc: 'دلیل رد را وارد کنید.',
      body: '<div class="field"><label>دلیل <span class="req">*</span></label><textarea id="rj-reason"></textarea></div>',
      actions: [
        { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
        {
          label: IC.x + ' ثبت رد',
          cls: 'danger',
          onClick: function (c) {
            var reasonBox = c.querySelector('#rj-reason');
            var reason = reasonBox ? reasonBox.value.trim() : '';
            if (!reason) { toast('دلیل الزامی است', '', 'warn'); return; }
            var btn = c.querySelector('button.danger');
            if (btn) btn.classList.add('loading');
            setTimeout(function () {
              try {
                var db = loadDB();
                var t = null;
                for (var i = 0; i < db.transfers.length; i++) {
                  if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
                }
                if (!t) { c.remove(); return; }
                if (!canApprove(App.user, t)) { c.remove(); toast('دسترسی ندارید', '', 'error'); return; }

                var stageMap = { pending_warehouse: 'warehouse', pending_accountant: 'accountant', pending_manager: 'manager' };
                var stage = stageMap[t.status];
                // Capture undo state BEFORE modifying
                var undoState = {
                  transferId: t.id,
                  prevStatus: t.status,
                  reservedDelta: 0,
                  prevRejection: t.rejection ? JSON.parse(JSON.stringify(t.rejection)) : null
                };
                if (t.type !== 'inbound') {
                  var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
                  if (srcStock) {
                    srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity);
                    srcStock.updatedAt = new Date().toISOString();
                    undoState.reservedDelta = t.quantity;
                  }
                }
                t.rejection = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), reason: reason, stage: stage };
                t.status = 'rejected';
                saveDB(db);
                c.remove();
                closeNotif();

                // Offer 5s undo window
                showUndoToast('درخواست «' + t.code + '» رد شد', function () {
                  try {
                    var fresh = loadDB();
                    var tf = null;
                    for (var j = 0; j < fresh.transfers.length; j++) {
                      if (fresh.transfers[j].id === undoState.transferId) { tf = fresh.transfers[j]; break; }
                    }
                    if (!tf) return;
                    tf.status = undoState.prevStatus;
                    tf.rejection = undoState.prevRejection;
                    if (undoState.reservedDelta > 0) {
                      var ss = findStock(fresh, tf.productId, tf.sourceWarehouseId);
                      if (ss) {
                        ss.reservedQty = (ss.reservedQty || 0) + undoState.reservedDelta;
                        ss.updatedAt = new Date().toISOString();
                      }
                    }
                    saveDB(fresh);
                    toast('بازگردانی شد', 'وضعیت به حالت قبل بازگشت', 'success');
                    requestAnimationFrame(function () { requestAnimationFrame(function () { render(); }); });
                  } catch (err) {

  function doLogin(u, p) {
    var us = loadDB().users;
    for (var i = 0; i < us.length; i++) {
      if (us[i].username === u && us[i].password === p && us[i].isActive) {
        try { localStorage.setItem(K_SES, us[i].id); } catch (e) {}

  /* ============================================================
     COMMAND PALETTE
     ============================================================ */
  function openCmd() {
    if ($('#cmd-bd')) return;
    var bd = document.createElement('div');
    bd.className = 'cmd-bd';
    bd.id = 'cmd-bd';
    var items = NAV.filter(function (i) { return i.roles.indexOf(App.user.role) >= 0; });
    bd.innerHTML = '<div class="cmd"><input id="cmd-input" placeholder="جستجو یا اجرای دستور..." autocomplete="off" /><div class="cmd-list" id="cmd-list"></div></div>';
    document.body.appendChild(bd);
    var input = $('#cmd-input');
    var list = $('#cmd-list');
    var sel = 0;
    var currentQuery = '';
    var db = loadDB();

    function build(q) {
      currentQuery = q;
      var query = (q || '').toLowerCase().trim();
      var html = '';

      // History (only when empty query)
      var hist = getSearchHistory();
      if (!query && hist.length) {
        html += '<div class="cmd-history-title">' + IC.history + ' جستجوهای اخیر</div>';
        hist.forEach(function (h, idx) {
          html += '<div class="cmd-history-item" data-hist="' + esc(h) + '">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
            '<span class="cmd-hist-q">' + esc(h) + '</span>' +
            '<button class="cmd-hist-x" data-hist-x="' + esc(h) + '" title="حذف">' + IC.close + '</button></div>';
        });
      }

      var navItems = items.map(function (i) {
        return { label: i.label, icon: i.icon, kbd: '↵', run: function () { go(i.key); }, sec: 'صفحه‌ها' };
      });
      var acts = [
        { label: 'میانبرهای کیبورد', icon: IC.keyboard, run: openShortcutsHelp, sec: 'راهنما' },
        { label: 'مرکز اعلان‌ها', icon: IC.bell, run: function () { openNotif(); }, sec: 'اقدامات' },
        { label: App.theme === 'light' ? 'حالت تاریک' : 'حالت روشن', icon: App.theme === 'light' ? IC.moon : IC.sun, run: toggleTheme, sec: 'تنظیمات' },
        { label: 'خروج از حساب', icon: IC.logout, run: doLogout, sec: 'تنظیمات' }
      ];

      var globals = query ? globalSearchEntries(db, query) : [];
      var navFiltered = query ? navItems.concat(acts).filter(function (c) { return c.label.toLowerCase().indexOf(query) >= 0; }) : navItems.concat(acts);

      var all = [];
      globals.forEach(function (g) { all.push(g); });
      navFiltered.forEach(function (g) { all.push(g); });

      if (!all.length) {
        list.innerHTML = html + '<div class="cmd-empty">موردی یافت نشد</div>';
        list._f = [];
        return;
      }

      var lastSec = null;
      all.forEach(function (c, i) {
        if (c.sec && c.sec !== lastSec) {
          html += '<div class="cmd-sec">' + c.sec + '</div>';
          lastSec = c.sec;
        }
        html += '<div class="cmd-item ' + (i === sel ? 'sel' : '') + '" data-i="' + i + '">' + c.icon +
          '<div style="flex:1;min-width:0"><b>' + esc(c.label) + '</b>' +
          (c.sub ? '<div class="cmd-sub">' + esc(c.sub) + '</div>' : '') +
          '</div>' + (c.kbd ? '<span class="kbd">' + c.kbd + '</span>' : '') + '</div>';
      });
      list.innerHTML = html;
      list._f = all;
      $$('.cmd-item', list).forEach(function (el) {
        el.addEventListener('click', function () {
          var c = all[+el.dataset.i];
          closeCmd();
          if (currentQuery.trim().length >= 2) pushSearchHistory(currentQuery);
          if (c && c.run) c.run();
        });
        el.addEventListener('mouseenter', function () {
          sel = +el.dataset.i;
          $$('.cmd-item', list).forEach(function (x) { x.classList.toggle('sel', +x.dataset.i === sel); });
        });
      });
      $$('.cmd-history-item', list).forEach(function (el) {
        el.addEventListener('click', function (ev) {
          if (ev.target.closest('[data-hist-x]')) return;
          input.value = el.dataset.hist;
          sel = 0;
          build(el.dataset.hist);
          input.focus();
        });
        var x = el.querySelector('[data-hist-x]');
        if (x) {
          x.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var target = x.getAttribute('data-hist-x');
            var h = getSearchHistory().filter(function (hh) { return hh !== target; });
            App.prefs.searchHistory = h;
            savePrefs();
            build(input.value);
          });
        }
      });
    }

    build('');
    input.focus();
    input.addEventListener('input', function () { sel = 0; build(input.value); });
    input.addEventListener('keydown', function (e) {
      var f = list._f || [];
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        sel = Math.min(sel + 1, f.length - 1);
        $$('.cmd-item', list).forEach(function (x) { x.classList.toggle('sel', +x.dataset.i === sel); });
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        sel = Math.max(sel - 1, 0);
        $$('.cmd-item', list).forEach(function (x) { x.classList.toggle('sel', +x.dataset.i === sel); });
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        var c = f[sel];
        if (c) {
          closeCmd();
          if (currentQuery.trim().length >= 2) pushSearchHistory(currentQuery);
          if (c.run) c.run();
        }
      }
      if (e.key === 'Escape') closeCmd();
    });
    bd.addEventListener('click', function (e) { if (e.target === bd) closeCmd(); });
  }

  function closeCmd() {
    var x = $('#cmd-bd');
    if (x) x.remove();
  }
