name: Keep Supabase Alive

on:
  schedule:
    # هر ۳ روز یک بار ساعت ۱۲ ظهر UTC اجرا می‌شود
    - cron: '0 12 */3 * *'
  workflow_dispatch: # اجازه اجرای دستی

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -4 -sS --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/alus_sync?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Ping Supabase Storage
        run: |
          curl -4 -sS --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X GET "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/product-images" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"