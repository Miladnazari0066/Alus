name: Debug Supabase Connection

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check URL and DNS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "تست بررسی آدرس..."
          echo "طول آدرس ذخیره شده: ${#SUPABASE_URL}"
          
          if [[ "$SUPABASE_URL" == https://* ]]; then
            echo "✅ آدرس با https شروع می‌شود."
            HOSTNAME=$(echo $SUPABASE_URL | sed 's|https://||')
            echo "🌐 دامنه استخراج شده: $HOSTNAME"
            
            echo "در حال تست DNS..."
            nslookup $HOSTNAME || echo "❌ خطای DNS: گیت‌هاب نمی‌تواند این دامنه را پیدا کند!"
          else
            echo "❌ خطا: آدرس (SUPABASE_URL) خالی است یا با https شروع نمی‌شود!"
          fi